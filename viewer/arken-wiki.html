<script id="wiki-data" type="application/json">{"pages":[{"id":"ART-BEA-HART","record":"BEA-HART","name":"은각 사슴 아우렌","category":"SacredBeast","tags":["SacredBeast","은각 사슴 아우렌"],"references":["BEA-HART","LOC-HUSH","ORG-HUSH","SYS-BLESSING"],"body":"\n# 은각 사슴 아우렌\n\n육체를 가진 장수 영물이며 무음림 경계 계약의 증인.\n\n## 생태와 능력\n\n은빛 뿔은 계절마다 자라지만 잘라 팔면 가호가 생기지 않는다. 계약자 한 명에게 밤눈을 빌려주는 동안 자신은 색을 구별하지 못한다. 수혜자는 숲의 부상 동물을 돌보되 사람의 생명을 희생할 의무는 없다.\n\n## 관계와 대응\n\n죽을 수 있는 존재다. 태어난 정확한 해는 미정이며 최초 문헌 기록만 181년이다. 오래된 기억이 모든 역사적 사실을 보증하지는 않는다.\n\n## 관련 문서\n\n- [무음림](LOC-HUSH.md)\n- [침묵의 정원](ORG-HUSH.md)\n- [가호와 호명 계약](SYS-BLESSING.md)\n","data":{"id":"BEA-HART","kind":"SacredBeast","name":"은각 사슴 아우렌","summary":"육체를 가진 장수 영물이며 무음림 경계 계약의 증인.","references":["LOC-HUSH","ORG-HUSH","SYS-BLESSING"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"은빛 뿔은 계절마다 자라지만 잘라 팔면 가호가 생기지 않는다. 계약자 한 명에게 밤눈을 빌려주는 동안 자신은 색을 구별하지 못한다. 수혜자는 숲의 부상 동물을 돌보되 사람의 생명을 희생할 의무는 없다."},{"heading":"관계와 대응","text":"죽을 수 있는 존재다. 태어난 정확한 해는 미정이며 최초 문헌 기록만 181년이다. 오래된 기억이 모든 역사적 사실을 보증하지는 않는다."}]}},{"id":"ART-BEA-TORTOISE","record":"BEA-TORTOISE","name":"청동등 거북 이룸","category":"SacredBeast","tags":["SacredBeast","청동등 거북 이룸"],"references":["BEA-TORTOISE","CLM-SHELL","LOC-SAHEL","NPC-SURI"],"body":"\n# 청동등 거북 이룸\n\n사헬 지하수 주변을 이동하는 거대한 영물.\n\n## 생태와 능력\n\n등껍질은 광물 침전으로 청동빛을 띤다. 물길을 감지하지만 물을 창조하지 않는다. 우물을 지키는 수리와 협력하며, 소음이 심한 펌프가 번식 굴을 방해하면 이동한다.\n\n## 관계와 대응\n\n마을은 이룸의 이동을 가뭄의 징조로 해석하지만 모든 이동이 가뭄을 뜻하지 않는다. 등껍질 조각의 만병 치료 효능은 확인되지 않은 상인의 주장이다.\n\n## 관련 문서\n\n- [청동등 껍질의 만병통치설](CLM-SHELL.md)\n- [사헬 유리사막](LOC-SAHEL.md)\n- [수리 안](NPC-SURI.md)\n","data":{"id":"BEA-TORTOISE","kind":"SacredBeast","name":"청동등 거북 이룸","summary":"사헬 지하수 주변을 이동하는 거대한 영물.","references":["CLM-SHELL","LOC-SAHEL","NPC-SURI"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"등껍질은 광물 침전으로 청동빛을 띤다. 물길을 감지하지만 물을 창조하지 않는다. 우물을 지키는 수리와 협력하며, 소음이 심한 펌프가 번식 굴을 방해하면 이동한다."},{"heading":"관계와 대응","text":"마을은 이룸의 이동을 가뭄의 징조로 해석하지만 모든 이동이 가뭄을 뜻하지 않는다. 등껍질 조각의 만병 치료 효능은 확인되지 않은 상인의 주장이다."}]}},{"id":"ART-CLM-HUSH-BOUNDARY","record":"CLM-HUSH-BOUNDARY","name":"옛 물길 경계설","category":"Claim","tags":["Claim","옛 물길 경계설"],"references":["CLM-HUSH-BOUNDARY","EVT-HUSH-SURVEY","SPI-ASH","ORG-HUSH"],"body":"\n# 옛 물길 경계설\n\n기억과 도면의 차이를 옛 물길 이동으로 설명하는 미확인 주장.\n\n## 주장의 내용\n\n일부 측량 참여자는 옛 물길이 움직여 아샤의 기억과 새 도면이 서로 다른 지형을 가리킨다고 제안한다. 물길 이동은 여러 가능한 지형 변화 가운데 하나이며, 현재 이 주장만을 입증하는 기록은 확인되지 않았다.\n\n## 확인과 영향\n\n참여자들은 오래된 흔적과 계절별 물높이를 더 살피자고 제안한다. 조사가 끝나기 전에는 어느 쪽의 채취권도 이 설만으로 확정할 수 없다. 기다리는 동안 낮춘 채취량이 가계에 부담이 되므로, 주민들은 재측량 일정과 식량 마련도 함께 논의한다.\n\n## 관련 문서\n\n- [EVT-HUSH-SURVEY](EVT-HUSH-SURVEY.md)\n- [SPI-ASH](SPI-ASH.md)\n- [ORG-HUSH](ORG-HUSH.md)\n","data":{"schema_version":1,"id":"CLM-HUSH-BOUNDARY","kind":"Claim","name":"옛 물길 경계설","summary":"기억과 도면의 차이를 옛 물길 이동으로 설명하는 미확인 주장.","references":["EVT-HUSH-SURVEY","SPI-ASH","ORG-HUSH"],"truth":"undecided","details":[{"heading":"주장의 내용","text":"일부 측량 참여자는 옛 물길이 움직여 아샤의 기억과 새 도면이 서로 다른 지형을 가리킨다고 제안한다. 물길 이동은 여러 가능한 지형 변화 가운데 하나이며, 현재 이 주장만을 입증하는 기록은 확인되지 않았다."},{"heading":"확인과 영향","text":"참여자들은 오래된 흔적과 계절별 물높이를 더 살피자고 제안한다. 조사가 끝나기 전에는 어느 쪽의 채취권도 이 설만으로 확정할 수 없다. 기다리는 동안 낮춘 채취량이 가계에 부담이 되므로, 주민들은 재측량 일정과 식량 마련도 함께 논의한다."}]}},{"id":"ART-CLM-ORVAN-DEBT","record":"CLM-ORVAN-DEBT","name":"오르반의 채무 조건에 관한 주장","category":"Claim","tags":["Claim","오르반의 채무 조건에 관한 주장"],"references":["CLM-ORVAN-DEBT","HERO-ORVAN","NPC-BREN","LOC-KARD","ITM-BASTION","EVT-ORVAN-REPAIR"],"body":"\n# 오르반의 채무 조건에 관한 주장\n\n오르반의 채무 계약이 환기 수선 청원에 대한 공개 지지를 금지한다는 주장.\n\n## 주장의 내용\n\n오르반의 채무 계약에 브렌의 환기 수선 청원을 공개적으로 지지하지 못하게 하는 조건이 있다는 주장이 돈다. 그 조항의 존재와 실제 적용 여부는 확인되지 않았다. 누가 처음 주장했는지와 계약의 정확한 문구도 미정이다.\n\n## 확인된 사정\n\n오르반은 철벽 장비의 정비료를 대려고 귀족 호위를 맡고 빚을 갚으려 한다. 브렌은 동상 건립비를 환기 수선비로 돌리자는 청원에 그의 공개 지지를 부탁했고, 오르반의 채권자는 반대한다. 채권자의 반대 자체가 계약상 금지 조항의 증거는 아니다.\n\n## 조사와 이해관계\n\n계약서와 당사자의 설명을 살피면 주장에 접근할 수 있지만 아직 결론은 없다. 공개 지지를 둘러싼 선택은 오르반의 생계와 명예, 광부들의 안전과 수선 재원에 영향을 준다. 오르반은 광산 노동자의 대표가 아니며 청원은 그의 발언 여부와 별도로 판단할 수 있다.\n\n## 관련 문서\n\n- [HERO-ORVAN](HERO-ORVAN.md)\n- [NPC-BREN](NPC-BREN.md)\n- [LOC-KARD](LOC-KARD.md)\n- [ITM-BASTION](ITM-BASTION.md)\n- [EVT-ORVAN-REPAIR](EVT-ORVAN-REPAIR.md)\n","data":{"schema_version":1,"id":"CLM-ORVAN-DEBT","kind":"Claim","name":"오르반의 채무 조건에 관한 주장","summary":"오르반의 채무 계약이 환기 수선 청원에 대한 공개 지지를 금지한다는 주장.","references":["HERO-ORVAN","NPC-BREN","LOC-KARD","ITM-BASTION","EVT-ORVAN-REPAIR"],"truth":"undecided","details":[{"heading":"주장의 내용","text":"오르반의 채무 계약에 브렌의 환기 수선 청원을 공개적으로 지지하지 못하게 하는 조건이 있다는 주장이 돈다. 그 조항의 존재와 실제 적용 여부는 확인되지 않았다. 누가 처음 주장했는지와 계약의 정확한 문구도 미정이다."},{"heading":"확인된 사정","text":"오르반은 철벽 장비의 정비료를 대려고 귀족 호위를 맡고 빚을 갚으려 한다. 브렌은 동상 건립비를 환기 수선비로 돌리자는 청원에 그의 공개 지지를 부탁했고, 오르반의 채권자는 반대한다. 채권자의 반대 자체가 계약상 금지 조항의 증거는 아니다."},{"heading":"조사와 이해관계","text":"계약서와 당사자의 설명을 살피면 주장에 접근할 수 있지만 아직 결론은 없다. 공개 지지를 둘러싼 선택은 오르반의 생계와 명예, 광부들의 안전과 수선 재원에 영향을 준다. 오르반은 광산 노동자의 대표가 아니며 청원은 그의 발언 여부와 별도로 판단할 수 있다."}]}},{"id":"ART-CLM-SHELL","record":"CLM-SHELL","name":"청동등 껍질의 만병통치설","category":"Claim","tags":["Claim","청동등 껍질의 만병통치설"],"references":["CLM-SHELL","BEA-TORTOISE","NPC-ENA","NPC-SURI"],"body":"\n# 청동등 껍질의 만병통치설\n\n영물의 껍질 조각이 모든 병을 낫게 한다는 상인의 선전.\n\n## 판정\n\n세계의 설정상 만병 치료 효능은 없다. 껍질은 광물 침전물이며 일부 약재의 받침으로 쓰일 수는 있다. 선전을 믿는 인물의 행동과 실제 효능을 구별한다.\n\n## 갈등\n\n밀렵자는 효능을 과장해 값을 올린다. 에나와 수리는 환자에게 치료를 제공하면서 밀렵 시장의 수요도 줄여야 한다.\n\n## 생활과 후속 이야기\n\n이 소문은 환자의 절박함과 치료 접근성 부족을 타고 퍼진다. 판매자가 모두 고의적 사기꾼인 것은 아니며 실제로 믿는 사람도 있다. 조사자는 구입 장부와 증상 변화를 비교하고 다른 치료가 병행됐는지 확인한다. 소문을 반박하는 일은 영물을 숭배하는 신앙 전체를 부정하는 일과 구별한다.\n\n## 관련 문서\n\n- [청동등 거북 이룸](BEA-TORTOISE.md)\n- [에나 로](NPC-ENA.md)\n- [수리 안](NPC-SURI.md)\n","data":{"id":"CLM-SHELL","kind":"Claim","name":"청동등 껍질의 만병통치설","summary":"영물의 껍질 조각이 모든 병을 낫게 한다는 상인의 선전.","references":["BEA-TORTOISE","NPC-ENA","NPC-SURI"],"truth":"false","schema_version":1,"details":[{"heading":"판정","text":"세계의 설정상 만병 치료 효능은 없다. 껍질은 광물 침전물이며 일부 약재의 받침으로 쓰일 수는 있다. 선전을 믿는 인물의 행동과 실제 효능을 구별한다."},{"heading":"갈등","text":"밀렵자는 효능을 과장해 값을 올린다. 에나와 수리는 환자에게 치료를 제공하면서 밀렵 시장의 수요도 줄여야 한다."},{"heading":"생활과 후속 이야기","text":"이 소문은 환자의 절박함과 치료 접근성 부족을 타고 퍼진다. 판매자가 모두 고의적 사기꾼인 것은 아니며 실제로 믿는 사람도 있다. 조사자는 구입 장부와 증상 변화를 비교하고 다른 치료가 병행됐는지 확인한다. 소문을 반박하는 일은 영물을 숭배하는 신앙 전체를 부정하는 일과 구별한다."}]}},{"id":"ART-CLM-WAR","record":"CLM-WAR","name":"신들의 전쟁 원인설","category":"Claim","tags":["Claim","신들의 전쟁 원인설"],"references":["CLM-WAR","EVT-FRACTURE"],"body":"\n# 신들의 전쟁 원인설\n\n하늘의 파열이 신들의 전쟁 때문이라는 후대 해석.\n\n## 내용과 출처\n\n파열 후 80년 무렵의 찬가가 하늘의 검과 방패를 노래한다. 실제 전쟁을 목격한 기록인지 재해의 비유인지는 미정이다.\n\n## 활용 경계\n\n인물이 믿거나 정치적으로 이용할 수 있다. 이 주장을 근거로 실제 신의 전쟁이나 특정 세력의 책임을 확정하지 않는다.\n\n## 생활과 후속 이야기\n\n찬가는 지금도 추모제에서 불린다. 가사가 역사적 사실이 아니어도 공동체가 재해를 기억하는 기능은 있다. 맹약원은 찬가의 유통을 금지하지 않고 자료에 후대 문헌이라는 분류를 붙인다. 원인설을 확정하려면 당시 자료와 독립된 증거가 필요하며, 단지 오래된 책이라는 이유로 우선하지 않는다.\n\n## 관련 문서\n\n- [하늘의 파열](EVT-FRACTURE.md)\n","data":{"id":"CLM-WAR","kind":"Claim","name":"신들의 전쟁 원인설","summary":"하늘의 파열이 신들의 전쟁 때문이라는 후대 해석.","references":["EVT-FRACTURE"],"truth":"undecided","schema_version":1,"details":[{"heading":"내용과 출처","text":"파열 후 80년 무렵의 찬가가 하늘의 검과 방패를 노래한다. 실제 전쟁을 목격한 기록인지 재해의 비유인지는 미정이다."},{"heading":"활용 경계","text":"인물이 믿거나 정치적으로 이용할 수 있다. 이 주장을 근거로 실제 신의 전쟁이나 특정 세력의 책임을 확정하지 않는다."},{"heading":"생활과 후속 이야기","text":"찬가는 지금도 추모제에서 불린다. 가사가 역사적 사실이 아니어도 공동체가 재해를 기억하는 기능은 있다. 맹약원은 찬가의 유통을 금지하지 않고 자료에 후대 문헌이라는 분류를 붙인다. 원인설을 확정하려면 당시 자료와 독립된 증거가 필요하며, 단지 오래된 책이라는 이유로 우선하지 않는다."}]}},{"id":"ART-CUL-HUSH-BARTER","record":"CUL-HUSH-BARTER","name":"무음림 약초 교환","category":"Culture","tags":["Culture","무음림 약초 교환"],"references":["CUL-HUSH-BARTER","LOC-HUSH","ORG-HUSH","SPI-ASH"],"body":"\n# 무음림 약초 교환\n\n무음림 입구에서 약초와 식량을 맞바꾸는 관습.\n\n## 교환과 동의\n\n마을 약초사는 정령의 동의를 얻어 채취한 약초를 말려 숲 입구에서 곡물과 천으로 바꾼다. 입구에서 종과 금속 북을 맡기고, 운반자는 채취지와 건조 날짜를 적어 품질을 확인한다. 약초가 부족한 계절에는 약속한 분량을 줄이고 다음 교환일에 다시 협상한다.\n\n## 노동과 갈등\n\n약초를 말리고 운반하는 노동은 채취량과 별도로 값을 매긴다. 침묵의 정원 사람들은 생계 때문에 더 팔고 싶은 이들과 숲의 회복을 기다리자는 이들의 의견을 함께 듣는다. 정령의 동의는 사람의 노동을 대신하지 않으며, 교환품이 모자라면 마을의 식량도 줄어든다.\n\n## 관련 문서\n\n- [LOC-HUSH](LOC-HUSH.md)\n- [ORG-HUSH](ORG-HUSH.md)\n- [SPI-ASH](SPI-ASH.md)\n","data":{"schema_version":1,"id":"CUL-HUSH-BARTER","kind":"Culture","name":"무음림 약초 교환","summary":"무음림 입구에서 약초와 식량을 맞바꾸는 관습.","references":["LOC-HUSH","ORG-HUSH","SPI-ASH"],"details":[{"heading":"교환과 동의","text":"마을 약초사는 정령의 동의를 얻어 채취한 약초를 말려 숲 입구에서 곡물과 천으로 바꾼다. 입구에서 종과 금속 북을 맡기고, 운반자는 채취지와 건조 날짜를 적어 품질을 확인한다. 약초가 부족한 계절에는 약속한 분량을 줄이고 다음 교환일에 다시 협상한다."},{"heading":"노동과 갈등","text":"약초를 말리고 운반하는 노동은 채취량과 별도로 값을 매긴다. 침묵의 정원 사람들은 생계 때문에 더 팔고 싶은 이들과 숲의 회복을 기다리자는 이들의 의견을 함께 듣는다. 정령의 동의는 사람의 노동을 대신하지 않으며, 교환품이 모자라면 마을의 식량도 줄어든다."}]}},{"id":"ART-CUL-HUSH-FUNERAL","record":"CUL-HUSH-FUNERAL","name":"무음림의 조용한 작별","category":"Culture","tags":["Culture","무음림의 조용한 작별"],"references":["CUL-HUSH-FUNERAL","LOC-HUSH","ORG-HUSH","SYS-DEATH"],"body":"\n# 무음림의 조용한 작별\n\n큰 충격음을 피하면서 죽은 이를 기리는 숲가의 장례 관습.\n\n## 작별의 절차\n\n유족은 숲 입구에서 금속 북과 종을 맡기고 천 조각에 고인의 이름을 적는다. 모인 사람들은 평소 목소리로 기억을 나누고 천을 집으로 가져간다. 참여와 이름 공개는 유족의 선택이며 숲의 잔향을 죽은 사람의 귀환으로 취급하지 않는다.\n\n## 돌봄과 비용\n\n장례에 필요한 천과 음식을 이웃이 나누지만 누구에게도 정해진 분량을 강제하지 않는다. 하루를 쉬면 약초를 말릴 일손이 모자라므로 친족들은 돌아가며 빈자리를 메운다. 돌봄에 참여하지 못한 이도 나중에 음식을 건넬 수 있고, 산 사람의 생계는 애도와 함께 계속된다.\n\n## 관련 문서\n\n- [LOC-HUSH](LOC-HUSH.md)\n- [ORG-HUSH](ORG-HUSH.md)\n- [SYS-DEATH](SYS-DEATH.md)\n","data":{"schema_version":1,"id":"CUL-HUSH-FUNERAL","kind":"Culture","name":"무음림의 조용한 작별","summary":"큰 충격음을 피하면서 죽은 이를 기리는 숲가의 장례 관습.","references":["LOC-HUSH","ORG-HUSH","SYS-DEATH"],"details":[{"heading":"작별의 절차","text":"유족은 숲 입구에서 금속 북과 종을 맡기고 천 조각에 고인의 이름을 적는다. 모인 사람들은 평소 목소리로 기억을 나누고 천을 집으로 가져간다. 참여와 이름 공개는 유족의 선택이며 숲의 잔향을 죽은 사람의 귀환으로 취급하지 않는다."},{"heading":"돌봄과 비용","text":"장례에 필요한 천과 음식을 이웃이 나누지만 누구에게도 정해진 분량을 강제하지 않는다. 하루를 쉬면 약초를 말릴 일손이 모자라므로 친족들은 돌아가며 빈자리를 메운다. 돌봄에 참여하지 못한 이도 나중에 음식을 건넬 수 있고, 산 사람의 생계는 애도와 함께 계속된다."}]}},{"id":"ART-CUL-REGIONAL-EXCHANGE","record":"CUL-REGIONAL-EXCHANGE","name":"세 지역 물품 교환의 관행","category":"Culture","tags":["Culture","세 지역 물품 교환의 관행"],"references":["CUL-REGIONAL-EXCHANGE","LOC-VELSU","LOC-KARD","LOC-HUSH","CUL-HUSH-BARTER","EVT-TRADE-PAUSE","EVT-TRADE-PARTIAL"],"body":"\n# 세 지역 물품 교환의 관행\n\n벨수·카르드·무음림의 생계와 운반을 잇는 반복적 교환.\n\n## 서로 다른 생산\n\n벨수의 배와 운반 노동은 물품을 옮기고 카르드는 철을 생산하며 무음림은 동의를 얻은 약초를 말려 교환한다. 각 지역은 식량과 도구를 서로 다른 경로로 구하므로 한 운반 일정이 늦어져도 모든 거래가 일제히 끝나는 것은 아니다. 물품마다 출하자와 운반자의 합의가 필요하다.\n\n## 최근의 교훈\n\n312년 초여름 약초와 철의 지연은 한 항차를 늦췄고, 남은 물품의 부분 운반은 일부 장비 수선을 도왔다. 운반에 드는 시간과 품삯은 물품 가격과 별도로 협상된다. 대기 비용과 안전을 누가 책임질지 정하지 못하면 다음 교환에서도 같은 부담이 되풀이될 수 있다.\n\n## 관련 문서\n\n- [LOC-VELSU](LOC-VELSU.md)\n- [LOC-KARD](LOC-KARD.md)\n- [LOC-HUSH](LOC-HUSH.md)\n- [CUL-HUSH-BARTER](CUL-HUSH-BARTER.md)\n- [EVT-TRADE-PAUSE](EVT-TRADE-PAUSE.md)\n- [EVT-TRADE-PARTIAL](EVT-TRADE-PARTIAL.md)\n","data":{"schema_version":1,"id":"CUL-REGIONAL-EXCHANGE","kind":"Culture","name":"세 지역 물품 교환의 관행","summary":"벨수·카르드·무음림의 생계와 운반을 잇는 반복적 교환.","references":["LOC-VELSU","LOC-KARD","LOC-HUSH","CUL-HUSH-BARTER","EVT-TRADE-PAUSE","EVT-TRADE-PARTIAL"],"details":[{"heading":"서로 다른 생산","text":"벨수의 배와 운반 노동은 물품을 옮기고 카르드는 철을 생산하며 무음림은 동의를 얻은 약초를 말려 교환한다. 각 지역은 식량과 도구를 서로 다른 경로로 구하므로 한 운반 일정이 늦어져도 모든 거래가 일제히 끝나는 것은 아니다. 물품마다 출하자와 운반자의 합의가 필요하다."},{"heading":"최근의 교훈","text":"312년 초여름 약초와 철의 지연은 한 항차를 늦췄고, 남은 물품의 부분 운반은 일부 장비 수선을 도왔다. 운반에 드는 시간과 품삯은 물품 가격과 별도로 협상된다. 대기 비용과 안전을 누가 책임질지 정하지 못하면 다음 교환에서도 같은 부담이 되풀이될 수 있다."}]}},{"id":"ART-CUL-VELSU-DRILL","record":"CUL-VELSU-DRILL","name":"벨수 공동 구조 훈련","category":"Culture","tags":["Culture","벨수","구조"],"references":["CUL-VELSU-DRILL","LOC-VELSU","ORG-FERRY","NPC-TOMA","EVT-FLOOD","LOC-VELSU-STORE"],"body":"\n# 벨수 공동 구조 훈련\n\n마을 배와 제방 노동자가 함께 익히는 범람 대응 관습.\n\n## 훈련과 역할\n\n초여름 물이 불기 전에 마을마다 배를 내어 얕은 물에서 사람 모형을 옮기고 제방 노동자는 접근로와 밧줄 고정점을 확인한다. 참가자는 노 젓는 사람과 물가에서 받는 사람의 역할을 바꾸어 익힌다. 가호의 응답을 전제로 하지 않으며 실제 조난에는 훈련보다 안전 판단이 앞선다.\n\n## 비용과 기억\n\n푸른 제방의 밤에 잃은 사람들의 이름을 부른 뒤 시작하되 유족은 참석을 거절할 수 있다. 연맹은 공동 창고에서 젖은 줄을 교체하고 비용을 임시분담장부에 적는다. 훈련 시간에 운임을 벌지 못하는 노 젓는 이들은 보상 범위를 놓고 선주와 의견이 다르다.\n\n## 관련 문서\n\n- [LOC-VELSU](LOC-VELSU.md)\n- [ORG-FERRY](ORG-FERRY.md)\n- [NPC-TOMA](NPC-TOMA.md)\n- [EVT-FLOOD](EVT-FLOOD.md)\n- [LOC-VELSU-STORE](LOC-VELSU-STORE.md)\n","data":{"id":"CUL-VELSU-DRILL","kind":"Culture","name":"벨수 공동 구조 훈련","summary":"마을 배와 제방 노동자가 함께 익히는 범람 대응 관습.","references":["LOC-VELSU","ORG-FERRY","NPC-TOMA","EVT-FLOOD","LOC-VELSU-STORE"],"schema_version":1,"details":[{"heading":"훈련과 역할","text":"초여름 물이 불기 전에 마을마다 배를 내어 얕은 물에서 사람 모형을 옮기고 제방 노동자는 접근로와 밧줄 고정점을 확인한다. 참가자는 노 젓는 사람과 물가에서 받는 사람의 역할을 바꾸어 익힌다. 가호의 응답을 전제로 하지 않으며 실제 조난에는 훈련보다 안전 판단이 앞선다."},{"heading":"비용과 기억","text":"푸른 제방의 밤에 잃은 사람들의 이름을 부른 뒤 시작하되 유족은 참석을 거절할 수 있다. 연맹은 공동 창고에서 젖은 줄을 교체하고 비용을 임시분담장부에 적는다. 훈련 시간에 운임을 벌지 못하는 노 젓는 이들은 보상 범위를 놓고 선주와 의견이 다르다."}]}},{"id":"ART-CUL-WELL-DAY","record":"CUL-WELL-DAY","name":"사헬의 우물 손보는 날","category":"Culture","tags":["사헬","공동노동"],"references":["CUL-WELL-DAY","LOC-SAHEL","NPC-SURI","THR-WATER","LOC-SURI-WELL"],"body":"# 사헬의 우물 손보는 날\n\n## 정비의 순서\n\n수리가 사는 사헬 마을은 큰 바람이 지난 뒤 주민 대표들이 정한 새벽에 공동 우물을 멈추고 모래받이와 밧줄을 살핀다. 이는 사헬 전체의 법이 아니라 그 우물을 함께 쓰는 집들의 관습이다. 밤에 길어 둔 물을 항아리에 나누어 두므로 정비 중에도 환자와 어린아이의 식수는 먼저 남는다. 바람 뒤에도 저장량이 적으면 정비를 나누어 시행한다.\n\n## 노동과 식탁\n\n물통을 들기 어려운 노인은 매듭의 마모를 세고, 어린이는 씻은 나무 표에 빠진 부품의 그림을 그린다. 노동을 못 낸 집에 자동으로 물을 끊지는 않지만 남은 집이 대신 쓴 시간이 장부에 남아 다음 장날 운반이나 음식 준비로 갚는다. 수리는 기름 묻은 손을 씻은 뒤 모두와 보리죽을 나눈다. 부품 설명을 알아듣지 못한 이가 다시 묻는 시간을 정비 시간에 포함한다.\n\n## 남는 다툼\n\n바르카의 펌프를 들일지는 이 관습만으로 결정되지 않았다. 당장 물이 필요한 집은 긴 설명 때문에 정비가 늦어진다고 불평하고, 수리는 사람이 바뀌어도 수리할 수 있어야 한다고 답한다. 공동 장부는 수리 교육에 쓸 수 있으나 펌프의 실제 회복량이나 독점 계약의 정당성을 증명하지는 않는다.\n","data":{"schema_version":1,"id":"CUL-WELL-DAY","kind":"Culture","name":"사헬의 우물 손보는 날","summary":"사헬 수리의 마을에서 물통과 노동을 함께 배분하는 반복 정비 관습.","references":["LOC-SAHEL","NPC-SURI","THR-WATER","LOC-SURI-WELL"],"details":[{"heading":"정비의 순서","text":"수리가 사는 사헬 마을은 큰 바람이 지난 뒤 주민 대표들이 정한 새벽에 공동 우물을 멈추고 모래받이와 밧줄을 살핀다. 이는 사헬 전체의 법이 아니라 그 우물을 함께 쓰는 집들의 관습이다. 밤에 길어 둔 물을 항아리에 나누어 두므로 정비 중에도 환자와 어린아이의 식수는 먼저 남는다. 바람 뒤에도 저장량이 적으면 정비를 나누어 시행한다."},{"heading":"노동과 식탁","text":"물통을 들기 어려운 노인은 매듭의 마모를 세고, 어린이는 씻은 나무 표에 빠진 부품의 그림을 그린다. 노동을 못 낸 집에 자동으로 물을 끊지는 않지만 남은 집이 대신 쓴 시간이 장부에 남아 다음 장날 운반이나 음식 준비로 갚는다. 수리는 기름 묻은 손을 씻은 뒤 모두와 보리죽을 나눈다. 부품 설명을 알아듣지 못한 이가 다시 묻는 시간을 정비 시간에 포함한다."},{"heading":"남는 다툼","text":"바르카의 펌프를 들일지는 이 관습만으로 결정되지 않았다. 당장 물이 필요한 집은 긴 설명 때문에 정비가 늦어진다고 불평하고, 수리는 사람이 바뀌어도 수리할 수 있어야 한다고 답한다. 공동 장부는 수리 교육에 쓸 수 있으나 펌프의 실제 회복량이나 독점 계약의 정당성을 증명하지는 않는다."}]}},{"id":"ART-EVT-COMPACT","record":"EVT-COMPACT","name":"일곱 맹약의 체결","category":"Event","tags":["Event","일곱 맹약의 체결"],"references":["EVT-COMPACT","EVT-FRACTURE","ORG-COMPACT"],"body":"\n# 일곱 맹약의 체결\n\n맹약력 6년, 일곱 피난 공동체가 구조와 자원 분배의 조약을 체결했다.\n\n## 내용\n\n공동 구조 요청, 피난민 통행, 잔해 위험 고지, 우물 오염 금지, 계약 강요 금지, 증언 보존, 유일물 분쟁 조정이 일곱 조항이다. 이 조약은 일곱 권능 좌를 창설한 사건이 아니다.\n\n## 변화\n\n현대의 맹약원은 당시 공동체의 완전한 후손 정부가 아니라 조약을 다시 가입한 도시와 씨족의 사무기구다.\n\n## 생활과 후속 이야기\n\n조약은 구조에 필요한 비용을 공동체별 보유 자원에 맞춰 나누는 원칙을 세웠다. 모든 피난민에게 같은 노동을 강요하지 않고 아동과 중상자를 보호 대상으로 뒀다. 당시 서명자 개인의 명단과 각 공동체의 후속 변천은 아직 설정하지 않았다. 새 역사를 쓸 때 현대 조직을 그대로 과거로 옮기지 않는다.\n\n## 관련 문서\n\n- [하늘의 파열](EVT-FRACTURE.md)\n- [맹약원](ORG-COMPACT.md)\n","data":{"id":"EVT-COMPACT","kind":"Event","name":"일곱 맹약의 체결","summary":"맹약력 6년, 일곱 피난 공동체가 구조와 자원 분배의 조약을 체결했다.","references":["EVT-FRACTURE","ORG-COMPACT"],"time":6,"after":["EVT-FRACTURE"],"schema_version":1,"details":[{"heading":"내용","text":"공동 구조 요청, 피난민 통행, 잔해 위험 고지, 우물 오염 금지, 계약 강요 금지, 증언 보존, 유일물 분쟁 조정이 일곱 조항이다. 이 조약은 일곱 권능 좌를 창설한 사건이 아니다."},{"heading":"변화","text":"현대의 맹약원은 당시 공동체의 완전한 후손 정부가 아니라 조약을 다시 가입한 도시와 씨족의 사무기구다."},{"heading":"생활과 후속 이야기","text":"조약은 구조에 필요한 비용을 공동체별 보유 자원에 맞춰 나누는 원칙을 세웠다. 모든 피난민에게 같은 노동을 강요하지 않고 아동과 중상자를 보호 대상으로 뒀다. 당시 서명자 개인의 명단과 각 공동체의 후속 변천은 아직 설정하지 않았다. 새 역사를 쓸 때 현대 조직을 그대로 과거로 옮기지 않는다."}]}},{"id":"ART-EVT-FLOOD","record":"EVT-FLOOD","name":"푸른 제방의 밤","category":"Event","tags":["Event","푸른 제방의 밤"],"references":["EVT-FLOOD","HERO-SERIN","NPC-TOMA","SPI-NEM"],"body":"\n# 푸른 제방의 밤\n\n맹약력 307년 벨수의 제방 붕괴 때 구조대가 세 마을을 대피시켰다.\n\n## 행동\n\n세린은 문턱 권능으로 안전이 확인된 높은 제방으로 통로를 열었다. 토마와 주민들은 권능이 열리지 않는 시간에 배로 사람을 옮겼다. 네므는 계약한 구조자들의 호흡을 보조했지만 홍수를 없애지는 않았다.\n\n## 후유증\n\n희생자 43명이 기록됐고 부상자와 이주민의 생계는 현재도 문제다. 세린의 영웅담만으로 공동 구조 노동이나 사망자를 지우지 않는다.\n\n## 관련 문서\n\n- [세린 바엘](HERO-SERIN.md)\n- [토마 리드](NPC-TOMA.md)\n- [네므 — 여울의 정령](SPI-NEM.md)\n","data":{"id":"EVT-FLOOD","kind":"Event","name":"푸른 제방의 밤","summary":"맹약력 307년 벨수의 제방 붕괴 때 구조대가 세 마을을 대피시켰다.","references":["HERO-SERIN","NPC-TOMA","SPI-NEM"],"time":307,"schema_version":1,"details":[{"heading":"행동","text":"세린은 문턱 권능으로 안전이 확인된 높은 제방으로 통로를 열었다. 토마와 주민들은 권능이 열리지 않는 시간에 배로 사람을 옮겼다. 네므는 계약한 구조자들의 호흡을 보조했지만 홍수를 없애지는 않았다."},{"heading":"후유증","text":"희생자 43명이 기록됐고 부상자와 이주민의 생계는 현재도 문제다. 세린의 영웅담만으로 공동 구조 노동이나 사망자를 지우지 않는다."}]}},{"id":"ART-EVT-FRACTURE","record":"EVT-FRACTURE","name":"하늘의 파열","category":"Event","tags":["Event","하늘의 파열"],"references":["EVT-FRACTURE","CLM-WAR","LOC-ARKEN"],"body":"\n# 하늘의 파열\n\n맹약력 0년, 하늘의 연속된 막이 갈라지고 잔해가 대륙에 떨어진 사건.\n\n## 확정된 결과\n\n루멘 남부와 사헬 지표가 변형되고 대규모 이주가 일어났다. 6년에 맺은 일곱 맹약은 이후 재해 공동 대응의 기준이 됐다. 파열의 원인은 아직 확정하지 않는다.\n\n## 기록의 한계\n\n후대 문헌은 신들의 전쟁이나 인간의 금술을 원인으로 제시한다. 둘 다 세계의 확정 원인이 아니다. 당시 생존자의 직접 기록과 후대 해석을 구분한다.\n\n## 생활과 후속 이야기\n\n오늘의 맹약력은 사건을 기점으로 후대에 통일한 연호다. 0년 이전에도 인간 공동체와 기술은 있었으며 파열이 인간이나 마법을 처음 만든 것은 아니다. 잔해는 지금도 위험하지만 매번 같은 규모의 재해를 일으키지는 않는다. 낙하 예보와 대피 훈련은 현재 시민의 생활에 속한다.\n\n## 관련 문서\n\n- [신들의 전쟁 원인설](CLM-WAR.md)\n- [아르켄 대륙](LOC-ARKEN.md)\n","data":{"id":"EVT-FRACTURE","kind":"Event","name":"하늘의 파열","summary":"맹약력 0년, 하늘의 연속된 막이 갈라지고 잔해가 대륙에 떨어진 사건.","references":["CLM-WAR","LOC-ARKEN"],"time":0,"schema_version":1,"details":[{"heading":"확정된 결과","text":"루멘 남부와 사헬 지표가 변형되고 대규모 이주가 일어났다. 6년에 맺은 일곱 맹약은 이후 재해 공동 대응의 기준이 됐다. 파열의 원인은 아직 확정하지 않는다."},{"heading":"기록의 한계","text":"후대 문헌은 신들의 전쟁이나 인간의 금술을 원인으로 제시한다. 둘 다 세계의 확정 원인이 아니다. 당시 생존자의 직접 기록과 후대 해석을 구분한다."},{"heading":"생활과 후속 이야기","text":"오늘의 맹약력은 사건을 기점으로 후대에 통일한 연호다. 0년 이전에도 인간 공동체와 기술은 있었으며 파열이 인간이나 마법을 처음 만든 것은 아니다. 잔해는 지금도 위험하지만 매번 같은 규모의 재해를 일으키지는 않는다. 낙하 예보와 대피 훈련은 현재 시민의 생활에 속한다."}]}},{"id":"ART-EVT-HUSH-SURVEY","record":"EVT-HUSH-SURVEY","name":"숲가의 임시 재측량","category":"Event","tags":["Event","숲가의 임시 재측량"],"references":["EVT-HUSH-SURVEY","LOC-HUSH","ORG-HUSH","SPI-ASH","NPC-MIRA"],"body":"\n# 숲가의 임시 재측량\n\n맹약력 312년 숲가 주민들이 경계 기억과 새 도면을 나란히 살폈다.\n\n## 두 기록\n\n마을 측량자들은 312년 숲가의 현재 지형을 재어 도면에 옮기고 아샤가 기억하는 오래된 경계와 나란히 적었다. 아샤가 기억하는 지형은 산불 이전의 것이며 현 도면과 다르다. 어느 기록도 자동으로 거짓이나 최종 경계로 판정하지 않았다.\n\n## 임시 조치\n\n침묵의 정원은 합의가 이뤄질 때까지 의견이 갈리는 구간의 채취량을 낮추고 다시 측량하기로 했다. 도면을 고치는 동안 운반과 채취에 쓸 노동이 줄어 마을의 교환 수입도 감소한다. 옛 지형 변화가 차이의 가능한 설명이지만 원인을 확정하지 않았다.\n\n## 관련 문서\n\n- [LOC-HUSH](LOC-HUSH.md)\n- [ORG-HUSH](ORG-HUSH.md)\n- [SPI-ASH](SPI-ASH.md)\n- [NPC-MIRA](NPC-MIRA.md)\n","data":{"schema_version":1,"id":"EVT-HUSH-SURVEY","kind":"Event","name":"숲가의 임시 재측량","summary":"맹약력 312년 숲가 주민들이 경계 기억과 새 도면을 나란히 살폈다.","references":["LOC-HUSH","ORG-HUSH","SPI-ASH","NPC-MIRA"],"time":312,"details":[{"heading":"두 기록","text":"마을 측량자들은 312년 숲가의 현재 지형을 재어 도면에 옮기고 아샤가 기억하는 오래된 경계와 나란히 적었다. 아샤가 기억하는 지형은 산불 이전의 것이며 현 도면과 다르다. 어느 기록도 자동으로 거짓이나 최종 경계로 판정하지 않았다."},{"heading":"임시 조치","text":"침묵의 정원은 합의가 이뤄질 때까지 의견이 갈리는 구간의 채취량을 낮추고 다시 측량하기로 했다. 도면을 고치는 동안 운반과 채취에 쓸 노동이 줄어 마을의 교환 수입도 감소한다. 옛 지형 변화가 차이의 가능한 설명이지만 원인을 확정하지 않았다."}]}},{"id":"ART-EVT-ORVAN-REPAIR","record":"EVT-ORVAN-REPAIR","name":"접힌 성벽의 경첩 정비","category":"Event","tags":["Event","접힌 성벽의 경첩 정비"],"references":["EVT-ORVAN-REPAIR","HERO-ORVAN","ITM-BASTION","LOC-KARD","EVT-PASS"],"body":"\n# 접힌 성벽의 경첩 정비\n\n맹약력 311년 오르반이 접힌 성벽의 피로한 경첩을 정비했다.\n\n## 정비\n\n검은 눈 고개 전투 뒤 오르반은 접힌 성벽의 경첩을 정비했다. 충격마다 철제 경첩에 피로가 쌓이므로 방패를 계속 쓰려면 점검과 수선에 노동과 재료가 든다. 정비는 방패의 성능을 유지하는 일이지 오르반의 무릎 부상을 치료하지는 못한다.\n\n## 비용과 선택\n\n오르반은 철벽 장비 정비료를 대기 위해 귀족 호위를 맡는다. 호위에 들이는 시간과 무릎의 부담은 고개의 상설 구조대를 만들려는 목표와 함께 감당해야 할 대가다. 방패는 약한 갱도에서 쓸 수 없으므로 정비만으로 환기갱의 위험을 해결하지 못한다.\n\n## 이어지는 문제\n\n카르드에서 브렌은 동상 건립비를 환기 수선비로 돌리자는 청원에 오르반의 공개 지지를 부탁했다. 그의 채권자는 이에 반대한다. 정비 비용과 빚은 알려져 있지만 채무 계약이 공개 지지를 금지하는지는 별도의 미정 주장이다.\n\n## 관련 문서\n\n- [HERO-ORVAN](HERO-ORVAN.md)\n- [ITM-BASTION](ITM-BASTION.md)\n- [LOC-KARD](LOC-KARD.md)\n- [EVT-PASS](EVT-PASS.md)\n","data":{"schema_version":1,"id":"EVT-ORVAN-REPAIR","kind":"Event","name":"접힌 성벽의 경첩 정비","summary":"맹약력 311년 오르반이 접힌 성벽의 피로한 경첩을 정비했다.","references":["HERO-ORVAN","ITM-BASTION","LOC-KARD","EVT-PASS"],"time":311,"after":["EVT-PASS"],"details":[{"heading":"정비","text":"검은 눈 고개 전투 뒤 오르반은 접힌 성벽의 경첩을 정비했다. 충격마다 철제 경첩에 피로가 쌓이므로 방패를 계속 쓰려면 점검과 수선에 노동과 재료가 든다. 정비는 방패의 성능을 유지하는 일이지 오르반의 무릎 부상을 치료하지는 못한다."},{"heading":"비용과 선택","text":"오르반은 철벽 장비 정비료를 대기 위해 귀족 호위를 맡는다. 호위에 들이는 시간과 무릎의 부담은 고개의 상설 구조대를 만들려는 목표와 함께 감당해야 할 대가다. 방패는 약한 갱도에서 쓸 수 없으므로 정비만으로 환기갱의 위험을 해결하지 못한다."},{"heading":"이어지는 문제","text":"카르드에서 브렌은 동상 건립비를 환기 수선비로 돌리자는 청원에 오르반의 공개 지지를 부탁했다. 그의 채권자는 이에 반대한다. 정비 비용과 빚은 알려져 있지만 채무 계약이 공개 지지를 금지하는지는 별도의 미정 주장이다."}]}},{"id":"ART-EVT-PASS","record":"EVT-PASS","name":"검은 눈 고개 전투","category":"Event","tags":["Event","검은 눈 고개 전투"],"references":["EVT-PASS","HERO-ORVAN","MON-WOLF","NPC-BREN"],"body":"\n# 검은 눈 고개 전투\n\n맹약력 309년 이상 한파에 내려온 서리늑대 무리를 구조대가 몰아냈다.\n\n## 전투\n\n오르반은 철벽 장비로 좁은 길을 지켰고 브렌은 광산 환기갱을 피난로로 열었다. 포식자를 모두 멸종시킨 전투가 아니라 굶주린 무리와 사람의 경계를 회복한 사건이다.\n\n## 대가\n\n오르반은 왼쪽 무릎을 크게 다쳐 장거리 행군을 지속할 수 없다. 갑옷의 힘이 관절 손상을 치료하지는 못한다.\n\n## 생활과 후속 이야기\n\n전투 뒤 광부 조합은 피난로의 소유와 유지 책임을 문서로 남기자고 요구했다. 개인의 영웅적 행동만 믿으면 다음 재해에 같은 길을 쓰지 못할 수 있기 때문이다. 구조대는 늑대의 이동 경로도 기록했다. 다음 한파에는 전투를 반복하기 전에 먹이 이동과 피난 계획을 함께 살핀다.\n\n## 관련 문서\n\n- [오르반 켈](HERO-ORVAN.md)\n- [서리늑대](MON-WOLF.md)\n- [브렌 돌](NPC-BREN.md)\n","data":{"id":"EVT-PASS","kind":"Event","name":"검은 눈 고개 전투","summary":"맹약력 309년 이상 한파에 내려온 서리늑대 무리를 구조대가 몰아냈다.","references":["HERO-ORVAN","MON-WOLF","NPC-BREN"],"time":309,"schema_version":1,"details":[{"heading":"전투","text":"오르반은 철벽 장비로 좁은 길을 지켰고 브렌은 광산 환기갱을 피난로로 열었다. 포식자를 모두 멸종시킨 전투가 아니라 굶주린 무리와 사람의 경계를 회복한 사건이다."},{"heading":"대가","text":"오르반은 왼쪽 무릎을 크게 다쳐 장거리 행군을 지속할 수 없다. 갑옷의 힘이 관절 손상을 치료하지는 못한다."},{"heading":"생활과 후속 이야기","text":"전투 뒤 광부 조합은 피난로의 소유와 유지 책임을 문서로 남기자고 요구했다. 개인의 영웅적 행동만 믿으면 다음 재해에 같은 길을 쓰지 못할 수 있기 때문이다. 구조대는 늑대의 이동 경로도 기록했다. 다음 한파에는 전투를 반복하기 전에 먹이 이동과 피난 계획을 함께 살핀다."}]}},{"id":"ART-EVT-TRADE-PARTIAL","record":"EVT-TRADE-PARTIAL","name":"남은 물품의 임시 교환","category":"Event","tags":["Event","남은 물품의 임시 교환"],"references":["EVT-TRADE-PARTIAL","EVT-TRADE-PAUSE","THR-TRADE-PAUSE","NPC-DAON","CUL-HUSH-BARTER","ORG-KARD-VENT"],"body":"\n# 남은 물품의 임시 교환\n\n312년 세 지역의 운반자들이 남은 물량 일부를 먼저 교환했다.\n\n## 제한된 운반\n\n지연 뒤 운반자들은 이미 안전하게 출하된 소량의 철 부속과 동의를 얻어 채취해 말린 약초를 한 차례 먼저 운반하기로 했다. 벨수에서는 다온과 동료들이 부속 하나를 닳은 줄의 고정구 교체에 썼다. 배와 인력은 한정되어 남은 주문은 다음 운반일을 기다린다.\n\n## 남는 대가\n\n참여자들은 이번 운반의 품삯과 물품을 각자 확인해 적었지만 이전 대기 시간의 보상에는 합의하지 못했다. 환기갱의 위험 구간은 여전히 점검과 수선이 필요하고 숲의 경계와 채취량도 최종 합의 전이다. 소량 교환은 생계 손실 전체를 지우지 못한다.\n\n## 관련 문서\n\n- [EVT-TRADE-PAUSE](EVT-TRADE-PAUSE.md)\n- [THR-TRADE-PAUSE](THR-TRADE-PAUSE.md)\n- [NPC-DAON](NPC-DAON.md)\n- [CUL-HUSH-BARTER](CUL-HUSH-BARTER.md)\n- [ORG-KARD-VENT](ORG-KARD-VENT.md)\n","data":{"schema_version":1,"id":"EVT-TRADE-PARTIAL","kind":"Event","name":"남은 물품의 임시 교환","summary":"312년 세 지역의 운반자들이 남은 물량 일부를 먼저 교환했다.","references":["EVT-TRADE-PAUSE","THR-TRADE-PAUSE","NPC-DAON","CUL-HUSH-BARTER","ORG-KARD-VENT"],"time":312,"details":[{"heading":"제한된 운반","text":"지연 뒤 운반자들은 이미 안전하게 출하된 소량의 철 부속과 동의를 얻어 채취해 말린 약초를 한 차례 먼저 운반하기로 했다. 벨수에서는 다온과 동료들이 부속 하나를 닳은 줄의 고정구 교체에 썼다. 배와 인력은 한정되어 남은 주문은 다음 운반일을 기다린다."},{"heading":"남는 대가","text":"참여자들은 이번 운반의 품삯과 물품을 각자 확인해 적었지만 이전 대기 시간의 보상에는 합의하지 못했다. 환기갱의 위험 구간은 여전히 점검과 수선이 필요하고 숲의 경계와 채취량도 최종 합의 전이다. 소량 교환은 생계 손실 전체를 지우지 못한다."}],"after":["EVT-TRADE-PAUSE"]}},{"id":"ART-EVT-TRADE-PAUSE","record":"EVT-TRADE-PAUSE","name":"초여름 교역 중단","category":"Event","tags":["Event","초여름 교역 중단"],"references":["EVT-TRADE-PAUSE","LOC-VELSU","LOC-KARD","ORG-KARD-VENT","CUL-HUSH-BARTER","EVT-HUSH-SURVEY","NPC-DAON"],"body":"\n# 초여름 교역 중단\n\n312년 벨수와 카르드, 무음림을 잇는 약속된 교환이 늦어졌다.\n\n## 엇갈린 물품\n\n무음림에서 경계 재측량 중 채취를 줄이자 말린 약초의 교환 물량이 감소했다. 같은 초여름 카르드의 한 환기갱 점검에서 공기 흐름이 약해져 담당 작업자들이 위험 구간 작업을 거절했다. 광산 운영자는 해당 구간의 철 출하를 점검 때까지 미뤘다. 두 결정은 별개의 이유로 이뤄졌다.\n\n## 벨수의 대기\n\n교환에 쓸 철과 약초가 약속된 날 도착하지 않아 벨수의 운반자들은 해당 물품을 실을 항차를 미뤘다. 다온이 살피는 장비창고의 줄 교체에도 철 부속을 기다려야 했고 창고 점검 노동은 계속됐다. 기존 비축품은 남아 있어 모든 강 운송이나 구조가 중단된 것은 아니다.\n\n## 손실의 분배\n\n운반자들은 대기 시간에 다른 운임을 벌지 못했고 무음림의 건조 일꾼도 팔 물량이 줄었다. 카르드에서는 해당 구간 노동자의 중단 기간 품삯을 둘러싼 협상이 이어졌다. 기상이나 누군가의 방해를 단일 원인으로 확정할 근거는 없다.\n\n## 관련 문서\n\n- [LOC-VELSU](LOC-VELSU.md)\n- [LOC-KARD](LOC-KARD.md)\n- [ORG-KARD-VENT](ORG-KARD-VENT.md)\n- [CUL-HUSH-BARTER](CUL-HUSH-BARTER.md)\n- [EVT-HUSH-SURVEY](EVT-HUSH-SURVEY.md)\n- [NPC-DAON](NPC-DAON.md)\n","data":{"schema_version":1,"id":"EVT-TRADE-PAUSE","kind":"Event","name":"초여름 교역 중단","summary":"312년 벨수와 카르드, 무음림을 잇는 약속된 교환이 늦어졌다.","references":["LOC-VELSU","LOC-KARD","ORG-KARD-VENT","CUL-HUSH-BARTER","EVT-HUSH-SURVEY","NPC-DAON"],"time":312,"details":[{"heading":"엇갈린 물품","text":"무음림에서 경계 재측량 중 채취를 줄이자 말린 약초의 교환 물량이 감소했다. 같은 초여름 카르드의 한 환기갱 점검에서 공기 흐름이 약해져 담당 작업자들이 위험 구간 작업을 거절했다. 광산 운영자는 해당 구간의 철 출하를 점검 때까지 미뤘다. 두 결정은 별개의 이유로 이뤄졌다."},{"heading":"벨수의 대기","text":"교환에 쓸 철과 약초가 약속된 날 도착하지 않아 벨수의 운반자들은 해당 물품을 실을 항차를 미뤘다. 다온이 살피는 장비창고의 줄 교체에도 철 부속을 기다려야 했고 창고 점검 노동은 계속됐다. 기존 비축품은 남아 있어 모든 강 운송이나 구조가 중단된 것은 아니다."},{"heading":"손실의 분배","text":"운반자들은 대기 시간에 다른 운임을 벌지 못했고 무음림의 건조 일꾼도 팔 물량이 줄었다. 카르드에서는 해당 구간 노동자의 중단 기간 품삯을 둘러싼 협상이 이어졌다. 기상이나 누군가의 방해를 단일 원인으로 확정할 근거는 없다."}]}},{"id":"ART-HERO-ERDAN","record":"HERO-ERDAN","name":"에르단 솔","category":"Character","tags":["Character","에르단 솔"],"references":["HERO-ERDAN","ORG-GLASS","ORG-RED","SYS-MAGIC"],"body":"\n# 에르단 솔\n\n유리학회의 현장 술식사이자 시민 교육 운동가.\n\n## 능력과 이력\n\n화려한 결투보다 보냉 창고와 수차 수리를 잘한다. 과거 실험 사고로 오른손의 촉각이 약해져 정밀한 도식에는 보조 장치를 쓴다. 자신의 무료 교재에서도 안전 재료를 생략하지 않는다.\n\n## 관계와 선택\n\n수가 부족한 시골 장인을 위해 장학금을 늘리려 하지만 측량단의 후원금을 받으면 채굴 정당화에 이용될 위험이 있다.\n\n## 생활과 후속 이야기\n\n평소에는 수리할 물건을 분해하기 전에 주인의 사용 습관부터 묻는다. 부유한 공방의 기준으로 만든 장치가 시골에서는 부품 하나 때문에 멈추는 일을 싫어한다. 조수에게 도식의 정답만 외우게 하지 않고 왜 실패했는지 설명하게 한다. 후원자를 잃어도 교재의 안전 주의사항을 삭제하지 않는 것이 그의 기준이다.\n\n## 관련 문서\n\n- [유리학회](ORG-GLASS.md)\n- [붉은 측량단](ORG-RED.md)\n- [術式魔法 — 술식마법](SYS-MAGIC.md)\n","data":{"id":"HERO-ERDAN","kind":"Character","name":"에르단 솔","summary":"유리학회의 현장 술식사이자 시민 교육 운동가.","references":["ORG-GLASS","ORG-RED","SYS-MAGIC"],"born":286,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"화려한 결투보다 보냉 창고와 수차 수리를 잘한다. 과거 실험 사고로 오른손의 촉각이 약해져 정밀한 도식에는 보조 장치를 쓴다. 자신의 무료 교재에서도 안전 재료를 생략하지 않는다."},{"heading":"관계와 선택","text":"수가 부족한 시골 장인을 위해 장학금을 늘리려 하지만 측량단의 후원금을 받으면 채굴 정당화에 이용될 위험이 있다."},{"heading":"생활과 후속 이야기","text":"평소에는 수리할 물건을 분해하기 전에 주인의 사용 습관부터 묻는다. 부유한 공방의 기준으로 만든 장치가 시골에서는 부품 하나 때문에 멈추는 일을 싫어한다. 조수에게 도식의 정답만 외우게 하지 않고 왜 실패했는지 설명하게 한다. 후원자를 잃어도 교재의 안전 주의사항을 삭제하지 않는 것이 그의 기준이다."}]}},{"id":"ART-HERO-IRA","record":"HERO-IRA","name":"이라 덴","category":"Character","tags":["Character","이라 덴"],"references":["HERO-IRA","NPC-MIRA","ORG-UNBOUND","POW-WITNESS"],"body":"\n# 이라 덴\n\n증언의 현 집행자이며 법정의 기억 감정인.\n\n## 능력과 이력\n\n맹약원 문서관 출신으로 302년 증언의 좌를 이었다. 남의 마음을 읽는 사람이 아니라 자발적으로 제출한 기억 조각의 변형을 확인하는 사람이다. 가족의 기억도 동의 없이 조사하지 않는다.\n\n## 관계와 선택\n\n동생 미라는 부패 조사에 협조하지만 의뢰인의 비밀을 공개하는 데 반대한다. 무관의 새벽이 요구하는 강제 기억 심문을 거부하면서도 권력자의 침묵을 보호한다는 비판을 받는다.\n\n## 관련 문서\n\n- [미라 덴](NPC-MIRA.md)\n- [무관의 새벽](ORG-UNBOUND.md)\n- [증언 — 기억 봉인의 권능](POW-WITNESS.md)\n","data":{"id":"HERO-IRA","kind":"Character","name":"이라 덴","summary":"증언의 현 집행자이며 법정의 기억 감정인.","references":["NPC-MIRA","ORG-UNBOUND","POW-WITNESS"],"born":278,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"맹약원 문서관 출신으로 302년 증언의 좌를 이었다. 남의 마음을 읽는 사람이 아니라 자발적으로 제출한 기억 조각의 변형을 확인하는 사람이다. 가족의 기억도 동의 없이 조사하지 않는다."},{"heading":"관계와 선택","text":"동생 미라는 부패 조사에 협조하지만 의뢰인의 비밀을 공개하는 데 반대한다. 무관의 새벽이 요구하는 강제 기억 심문을 거부하면서도 권력자의 침묵을 보호한다는 비판을 받는다."}]}},{"id":"ART-HERO-ORVAN","record":"HERO-ORVAN","name":"오르반 켈","category":"Character","tags":["Character","오르반 켈"],"references":["HERO-ORVAN","EVT-PASS","ITM-BASTION","NPC-BREN"],"body":"\n# 오르반 켈\n\n검은 눈 고개를 지킨 방패 기사.\n\n## 능력과 이력\n\n권능은 없고 술식 장비와 훈련으로 싸운다. 309년 부상 뒤 보행 보조대를 쓰며, 힘을 발휘할 때마다 무릎 상태를 확인해야 한다. 광부 브렌이 뚫은 피난로를 자기 전공으로 돌리지 않는다.\n\n## 관계와 선택\n\n철벽 장비의 정비료를 대기 위해 귀족 호위를 맡는다. 명예를 지키며 빚을 갚을 수 있는지가 그의 일상적인 갈등이다.\n\n## 생활과 후속 이야기\n\n사람들 앞에서 보조대를 숨기지 않지만 도움을 청하는 데는 아직 서툴다. 아침에는 경첩을 닦고 오후에는 젊은 경비병에게 피난로를 지키는 훈련을 시킨다. 승리담을 부탁받으면 자신이 막은 적보다 밖으로 나간 사람을 말한다. 현재의 목표는 더 강한 방패가 아니라 빚을 갚으며 고개의 상설 구조대를 만드는 것이다.\n\n## 관련 문서\n\n- [검은 눈 고개 전투](EVT-PASS.md)\n- [접힌 성벽](ITM-BASTION.md)\n- [브렌 돌](NPC-BREN.md)\n","data":{"id":"HERO-ORVAN","kind":"Character","name":"오르반 켈","summary":"검은 눈 고개를 지킨 방패 기사.","references":["EVT-PASS","ITM-BASTION","NPC-BREN"],"born":271,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"권능은 없고 술식 장비와 훈련으로 싸운다. 309년 부상 뒤 보행 보조대를 쓰며, 힘을 발휘할 때마다 무릎 상태를 확인해야 한다. 광부 브렌이 뚫은 피난로를 자기 전공으로 돌리지 않는다."},{"heading":"관계와 선택","text":"철벽 장비의 정비료를 대기 위해 귀족 호위를 맡는다. 명예를 지키며 빚을 갚을 수 있는지가 그의 일상적인 갈등이다."},{"heading":"생활과 후속 이야기","text":"사람들 앞에서 보조대를 숨기지 않지만 도움을 청하는 데는 아직 서툴다. 아침에는 경첩을 닦고 오후에는 젊은 경비병에게 피난로를 지키는 훈련을 시킨다. 승리담을 부탁받으면 자신이 막은 적보다 밖으로 나간 사람을 말한다. 현재의 목표는 더 강한 방패가 아니라 빚을 갚으며 고개의 상설 구조대를 만드는 것이다."}]}},{"id":"ART-HERO-SERIN","record":"HERO-SERIN","name":"세린 바엘","category":"Character","tags":["Character","세린 바엘"],"references":["HERO-SERIN","EVT-FLOOD","NPC-TOMA","POW-THRESHOLD"],"body":"\n# 세린 바엘\n\n문턱의 현 집행자이자 제방 구조의 영웅.\n\n## 능력과 이력\n\n가난한 석공 집안에서 자랐다. 문턱 시험을 통과한 305년부터 집행했으며 군 지휘권은 없다. 구조할 수 있는 사람을 골라야 했던 밤 이후, 영웅에게 모든 책임을 맡기는 관행을 싫어한다.\n\n## 관계와 선택\n\n가장 가까운 협력자는 토마지만 무상 구조를 계속하라는 요구에는 답을 찾지 못한다. 문턱을 전쟁 보급에 쓰라는 도시의 요청을 거절하면 제방 예산이 삭감될 수 있다.\n\n## 관련 문서\n\n- [푸른 제방의 밤](EVT-FLOOD.md)\n- [토마 리드](NPC-TOMA.md)\n- [문턱 — 연결의 권능](POW-THRESHOLD.md)\n","data":{"id":"HERO-SERIN","kind":"Character","name":"세린 바엘","summary":"문턱의 현 집행자이자 제방 구조의 영웅.","references":["EVT-FLOOD","NPC-TOMA","POW-THRESHOLD"],"born":284,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"가난한 석공 집안에서 자랐다. 문턱 시험을 통과한 305년부터 집행했으며 군 지휘권은 없다. 구조할 수 있는 사람을 골라야 했던 밤 이후, 영웅에게 모든 책임을 맡기는 관행을 싫어한다."},{"heading":"관계와 선택","text":"가장 가까운 협력자는 토마지만 무상 구조를 계속하라는 요구에는 답을 찾지 못한다. 문턱을 전쟁 보급에 쓰라는 도시의 요청을 거절하면 제방 예산이 삭감될 수 있다."}]}},{"id":"ART-ITM-BASTION","record":"ITM-BASTION","name":"접힌 성벽","category":"Item","tags":["Item","접힌 성벽"],"references":["ITM-BASTION","EVT-PASS","HERO-ORVAN","SYS-UNIQUE"],"body":"\n# 접힌 성벽\n\n오르반이 사용하는 전개식 철제 방패.\n\n## 기능\n\n땅에 고정하면 폭 네 미터의 충격 분산막을 만든다. 충격은 지면으로 전달되므로 약한 갱도나 배 위에서는 사용할 수 없다. 측면과 뒤쪽은 열려 있다.\n\n## 대가와 한계\n\n철제 경첩이 충격마다 피로해져 정비가 필요하다. 성벽을 옮기려면 전개를 해제해야 하고, 들고 달리면서 같은 방어력을 얻을 수 없다. 물리적 방어가 질병이나 정신적 압박을 막지는 않는다.\n\n## 권리와 이력\n\n현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다.\n\n## 관련 문서\n\n- [검은 눈 고개 전투](EVT-PASS.md)\n- [오르반 켈](HERO-ORVAN.md)\n- [유일물과 소유·보관·사용](SYS-UNIQUE.md)\n","data":{"id":"ITM-BASTION","kind":"Item","name":"접힌 성벽","summary":"오르반이 사용하는 전개식 철제 방패.","references":["EVT-PASS","HERO-ORVAN","SYS-UNIQUE"],"unique":true,"owner":"HERO-ORVAN","keeper":"HERO-ORVAN","as_of":312,"schema_version":1,"details":[{"heading":"기능","text":"땅에 고정하면 폭 네 미터의 충격 분산막을 만든다. 충격은 지면으로 전달되므로 약한 갱도나 배 위에서는 사용할 수 없다. 측면과 뒤쪽은 열려 있다."},{"heading":"대가와 한계","text":"철제 경첩이 충격마다 피로해져 정비가 필요하다. 성벽을 옮기려면 전개를 해제해야 하고, 들고 달리면서 같은 방어력을 얻을 수 없다. 물리적 방어가 질병이나 정신적 압박을 막지는 않는다."},{"heading":"권리와 이력","text":"현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다."}]}},{"id":"ART-ITM-COMPASS","record":"ITM-COMPASS","name":"거짓 북쪽의 나침반","category":"Item","tags":["Item","거짓 북쪽의 나침반"],"references":["ITM-COMPASS","NPC-VARKA","ORG-RED","SYS-UNIQUE"],"body":"\n# 거짓 북쪽의 나침반\n\n사헬 유적에서 회수된 목적지 대신 약속을 가리키는 나침반.\n\n## 기능\n\n사용자가 자발적으로 맺고 아직 이행하지 않은 약속 중 가장 오래된 약속의 상대가 마지막으로 확인된 장소를 가리킨다. 상대의 현재 위치를 추적하거나 약속의 정당성을 판단하지 않는다.\n\n## 대가와 한계\n\n사용자는 작동시킬 때 약속 내용을 소리 내어 인정해야 한다. 잘못 기억한 약속에는 반응하지 않으며, 약속 상대가 사망하면 마지막 확인 장소만 가리킨다. 바르카는 단체의 담보품으로 보관하며 자신의 오래된 구조 약속 때문에 공개 사용을 꺼린다.\n\n## 권리와 이력\n\n현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다.\n\n## 관련 문서\n\n- [바르카 렌](NPC-VARKA.md)\n- [붉은 측량단](ORG-RED.md)\n- [유일물과 소유·보관·사용](SYS-UNIQUE.md)\n","data":{"id":"ITM-COMPASS","kind":"Item","name":"거짓 북쪽의 나침반","summary":"사헬 유적에서 회수된 목적지 대신 약속을 가리키는 나침반.","references":["NPC-VARKA","ORG-RED","SYS-UNIQUE"],"unique":true,"owner":"ORG-RED","keeper":"NPC-VARKA","as_of":312,"schema_version":1,"details":[{"heading":"기능","text":"사용자가 자발적으로 맺고 아직 이행하지 않은 약속 중 가장 오래된 약속의 상대가 마지막으로 확인된 장소를 가리킨다. 상대의 현재 위치를 추적하거나 약속의 정당성을 판단하지 않는다."},{"heading":"대가와 한계","text":"사용자는 작동시킬 때 약속 내용을 소리 내어 인정해야 한다. 잘못 기억한 약속에는 반응하지 않으며, 약속 상대가 사망하면 마지막 확인 장소만 가리킨다. 바르카는 단체의 담보품으로 보관하며 자신의 오래된 구조 약속 때문에 공개 사용을 꺼린다."},{"heading":"권리와 이력","text":"현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다."}]}},{"id":"ART-ITM-LANTERN","record":"ITM-LANTERN","name":"구명 등불","category":"Item","tags":["Item","구명 등불"],"references":["ITM-LANTERN","LOC-ESTEL","NPC-MARE","ORG-LANTERN","SYS-DEATH","SYS-UNIQUE"],"body":"\n# 구명 등불\n\n파열 직후 구조선에서 발견된 단 하나의 푸른 등불.\n\n## 기능\n\n반경 두 킬로미터 안에서 사용자가 이름을 아는 살아 있는 사람에게 이르는 안전한 수상 경로를 가리킨다. 안전한 길이 없거나 대상이 확정 사망했으면 빛나지 않는다. 빛이 없다는 사실만으로 사망을 확정할 수 없다.\n\n## 대가와 한계\n\n한 번 밝히면 연료인 바다 소금 결정과 사용자의 체온을 소모한다. 열다섯 분 뒤 끄고 한 시간 보온해야 한다. 전쟁의 매복이나 육지 길을 모두 예측하는 도구가 아니다.\n\n## 권리와 이력\n\n현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다.\n\n## 관련 문서\n\n- [에스텔 군도](LOC-ESTEL.md)\n- [마레 에스](NPC-MARE.md)\n- [등대 협약회](ORG-LANTERN.md)\n- [죽음과 잔향](SYS-DEATH.md)\n- [유일물과 소유·보관·사용](SYS-UNIQUE.md)\n","data":{"id":"ITM-LANTERN","kind":"Item","name":"구명 등불","summary":"파열 직후 구조선에서 발견된 단 하나의 푸른 등불.","references":["LOC-ESTEL","NPC-MARE","ORG-LANTERN","SYS-DEATH","SYS-UNIQUE"],"unique":true,"owner":"ORG-LANTERN","keeper":"NPC-MARE","as_of":312,"schema_version":1,"details":[{"heading":"기능","text":"반경 두 킬로미터 안에서 사용자가 이름을 아는 살아 있는 사람에게 이르는 안전한 수상 경로를 가리킨다. 안전한 길이 없거나 대상이 확정 사망했으면 빛나지 않는다. 빛이 없다는 사실만으로 사망을 확정할 수 없다."},{"heading":"대가와 한계","text":"한 번 밝히면 연료인 바다 소금 결정과 사용자의 체온을 소모한다. 열다섯 분 뒤 끄고 한 시간 보온해야 한다. 전쟁의 매복이나 육지 길을 모두 예측하는 도구가 아니다."},{"heading":"권리와 이력","text":"현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다."}]}},{"id":"ART-ITM-NEEDLE","record":"ITM-NEEDLE","name":"봉합의 바늘","category":"Item","tags":["Item","봉합의 바늘"],"references":["ITM-NEEDLE","NPC-ENA","SYS-DEATH","SYS-UNIQUE"],"body":"\n# 봉합의 바늘\n\n찢긴 물질의 결을 다시 맞추는 유일한 은색 바늘.\n\n## 기능\n\n끊어진 천과 가죽, 살아 있는 피부의 가장자리를 맞춘다. 잃어버린 살이나 장기를 만들지 않으며 감염된 상처를 먼저 세척해야 한다. 죽은 사람의 의식을 잇지 못한다.\n\n## 대가와 한계\n\n봉합한 길이만큼 사용자의 손가락에 일시적 감각 둔화가 생겨 하루 작업 길이를 손바닥 한 뼘으로 제한한다. 무리하면 영구 신경 손상 위험이 있다. 치유사 에나는 응급 상황에도 동의와 소독 절차를 지킨다.\n\n## 권리와 이력\n\n현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다.\n\n## 관련 문서\n\n- [에나 로](NPC-ENA.md)\n- [죽음과 잔향](SYS-DEATH.md)\n- [유일물과 소유·보관·사용](SYS-UNIQUE.md)\n","data":{"id":"ITM-NEEDLE","kind":"Item","name":"봉합의 바늘","summary":"찢긴 물질의 결을 다시 맞추는 유일한 은색 바늘.","references":["NPC-ENA","SYS-DEATH","SYS-UNIQUE"],"unique":true,"owner":"NPC-ENA","keeper":"NPC-ENA","as_of":312,"schema_version":1,"details":[{"heading":"기능","text":"끊어진 천과 가죽, 살아 있는 피부의 가장자리를 맞춘다. 잃어버린 살이나 장기를 만들지 않으며 감염된 상처를 먼저 세척해야 한다. 죽은 사람의 의식을 잇지 못한다."},{"heading":"대가와 한계","text":"봉합한 길이만큼 사용자의 손가락에 일시적 감각 둔화가 생겨 하루 작업 길이를 손바닥 한 뼘으로 제한한다. 무리하면 영구 신경 손상 위험이 있다. 치유사 에나는 응급 상황에도 동의와 소독 절차를 지킨다."},{"heading":"권리와 이력","text":"현재 소유권과 보관 관계는 구조화 필드에 기록한다. 취득 이전의 세부 경로는 미정이며 새 발견담을 현재의 확정 취득 사실처럼 소급하지 않는다."}]}},{"id":"ART-LOC-ARKEN","record":"LOC-ARKEN","name":"아르켄 대륙","category":"Place","tags":["Place","아르켄 대륙"],"references":["LOC-ARKEN","EVT-FRACTURE","ORG-COMPACT"],"body":"\n# 아르켄 대륙\n\n깨진 하늘의 잔해를 둘러싸고 일곱 지역이 교역하는 대륙.\n\n## 지리\n\n중앙의 루멘 분지에서 서쪽으로 이틀 가면 벨수 수계, 북쪽으로 엿새 가면 카르드 고개다. 동쪽의 무음림은 강 상류와 맞닿고, 남쪽 소금길은 사흘 뒤 사헬 유리사막에 닿는다. 더 남쪽 열흘 항해권에는 해안 군도 에스텔이 있다. 거리는 평상시 여객 이동 기준이며 전쟁과 홍수 때 달라진다.\n\n## 현재\n\n현재 시점은 맹약력 312년 초여름이다. 하늘은 0년의 파열 이후 봉합됐지만 별빛처럼 보이는 잔해가 계절마다 떨어진다. 잔해가 자원인 동시에 재해여서 어느 세력도 단독으로 국경을 닫고 살 수 없다.\n\n## 정치와 생활\n\n대륙 전체를 지배하는 황제는 없다. 도시 의회·산악 씨족·강 유역 공동체가 통행과 재해 구조 조약으로 연결된다. 보리와 염장 생선, 유리 렌즈와 철재, 수로 수선 기술이 교역의 기본이다. 영웅은 조약 위에 군림하는 계급이 아니라 특정 사건에서 명성을 얻은 개인이다.\n\n## 관련 문서\n\n- [하늘의 파열](EVT-FRACTURE.md)\n- [맹약원](ORG-COMPACT.md)\n","data":{"id":"LOC-ARKEN","kind":"Place","name":"아르켄 대륙","summary":"깨진 하늘의 잔해를 둘러싸고 일곱 지역이 교역하는 대륙.","references":["EVT-FRACTURE","ORG-COMPACT"],"schema_version":1,"details":[{"heading":"지리","text":"중앙의 루멘 분지에서 서쪽으로 이틀 가면 벨수 수계, 북쪽으로 엿새 가면 카르드 고개다. 동쪽의 무음림은 강 상류와 맞닿고, 남쪽 소금길은 사흘 뒤 사헬 유리사막에 닿는다. 더 남쪽 열흘 항해권에는 해안 군도 에스텔이 있다. 거리는 평상시 여객 이동 기준이며 전쟁과 홍수 때 달라진다."},{"heading":"현재","text":"현재 시점은 맹약력 312년 초여름이다. 하늘은 0년의 파열 이후 봉합됐지만 별빛처럼 보이는 잔해가 계절마다 떨어진다. 잔해가 자원인 동시에 재해여서 어느 세력도 단독으로 국경을 닫고 살 수 없다."},{"heading":"정치와 생활","text":"대륙 전체를 지배하는 황제는 없다. 도시 의회·산악 씨족·강 유역 공동체가 통행과 재해 구조 조약으로 연결된다. 보리와 염장 생선, 유리 렌즈와 철재, 수로 수선 기술이 교역의 기본이다. 영웅은 조약 위에 군림하는 계급이 아니라 특정 사건에서 명성을 얻은 개인이다."}]}},{"id":"ART-LOC-ESTEL","record":"LOC-ESTEL","name":"에스텔 군도","category":"Place","tags":["Place","에스텔 군도"],"references":["LOC-ESTEL","ITM-LANTERN","ORG-LANTERN","SPI-SIA"],"body":"\n# 에스텔 군도\n\n등대 협약으로 연결된 남쪽 항구와 부유 암초의 군도.\n\n## 생활과 제도\n\n항구마다 자치법이 있지만 조난선 구조를 거부하면 다음 철의 공동 보험에서 제외된다. 바람 정령 시아는 선장의 소유물이 아니며 승선마다 계약을 새로 맺는다.\n\n## 현재의 갈등\n\n구명 등불은 길을 찾는 유일물이다. 항구 위원회가 소유하지만 순회 구조선이 보관하여, 전쟁 때 군함에 넘기라는 요구를 거부할 근거가 있다.\n\n## 후속 확장\n\n세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다.\n\n## 관련 문서\n\n- [구명 등불](ITM-LANTERN.md)\n- [등대 협약회](ORG-LANTERN.md)\n- [시아 — 돛 사이의 바람](SPI-SIA.md)\n","data":{"id":"LOC-ESTEL","kind":"Place","name":"에스텔 군도","summary":"등대 협약으로 연결된 남쪽 항구와 부유 암초의 군도.","references":["ITM-LANTERN","ORG-LANTERN","SPI-SIA"],"schema_version":1,"details":[{"heading":"생활과 제도","text":"항구마다 자치법이 있지만 조난선 구조를 거부하면 다음 철의 공동 보험에서 제외된다. 바람 정령 시아는 선장의 소유물이 아니며 승선마다 계약을 새로 맺는다."},{"heading":"현재의 갈등","text":"구명 등불은 길을 찾는 유일물이다. 항구 위원회가 소유하지만 순회 구조선이 보관하여, 전쟁 때 군함에 넘기라는 요구를 거부할 근거가 있다."},{"heading":"후속 확장","text":"세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다."}]}},{"id":"ART-LOC-HUSH","record":"LOC-HUSH","name":"무음림","category":"Place","tags":["Place","무음림"],"references":["LOC-HUSH","BEA-HART","ORG-HUSH","SPI-ASH"],"body":"\n# 무음림\n\n소리를 저장하는 수목과 오래된 계약이 남아 있는 동부 숲.\n\n## 생활과 제도\n\n숲에 들어가는 사람은 종과 금속 북을 입구에 맡긴다. 소리가 모두 사라지는 곳이 아니라 큰 충격음이 수목의 잔향을 깨우는 곳이다. 약초 채취에는 정령의 동의와 마을의 노동이 모두 필요하다.\n\n## 현재의 갈등\n\n은각 사슴은 숲의 군주가 아니라 오래된 경계 계약의 수호자다. 흉년 때 나무를 더 베어야 한다는 마을과 침묵회 사이에 합의가 필요하다.\n\n## 후속 확장\n\n세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다.\n\n## 관련 문서\n\n- [은각 사슴 아우렌](BEA-HART.md)\n- [침묵의 정원](ORG-HUSH.md)\n- [아샤 — 재의 정령](SPI-ASH.md)\n","data":{"id":"LOC-HUSH","kind":"Place","name":"무음림","summary":"소리를 저장하는 수목과 오래된 계약이 남아 있는 동부 숲.","references":["BEA-HART","ORG-HUSH","SPI-ASH"],"schema_version":1,"details":[{"heading":"생활과 제도","text":"숲에 들어가는 사람은 종과 금속 북을 입구에 맡긴다. 소리가 모두 사라지는 곳이 아니라 큰 충격음이 수목의 잔향을 깨우는 곳이다. 약초 채취에는 정령의 동의와 마을의 노동이 모두 필요하다."},{"heading":"현재의 갈등","text":"은각 사슴은 숲의 군주가 아니라 오래된 경계 계약의 수호자다. 흉년 때 나무를 더 베어야 한다는 마을과 침묵회 사이에 합의가 필요하다."},{"heading":"후속 확장","text":"세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다."}]}},{"id":"ART-LOC-KARD","record":"LOC-KARD","name":"카르드 고개","category":"Place","tags":["Place","카르드 고개"],"references":["LOC-KARD","HERO-ORVAN","MON-WOLF","NPC-BREN"],"body":"\n# 카르드 고개\n\n북부 철광과 남부 곡창을 잇는 산악 통로.\n\n## 생활과 제도\n\n산악 씨족은 공동 창고를 유지하고 겨울 통행세 일부를 구조대에 배정한다. 서리늑대는 여름에는 높은 암반으로 물러나므로 늑대 출현은 이상 한파의 징후다.\n\n## 현재의 갈등\n\n영웅 오르반은 고개를 구한 전공이 있지만 광산 노동자의 대표가 아니다. 광부들은 영웅의 동상을 세우는 예산보다 환기갱 수선을 원한다.\n\n## 후속 확장\n\n세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다.\n\n## 관련 문서\n\n- [오르반 켈](HERO-ORVAN.md)\n- [서리늑대](MON-WOLF.md)\n- [브렌 돌](NPC-BREN.md)\n","data":{"id":"LOC-KARD","kind":"Place","name":"카르드 고개","summary":"북부 철광과 남부 곡창을 잇는 산악 통로.","references":["HERO-ORVAN","MON-WOLF","NPC-BREN"],"schema_version":1,"details":[{"heading":"생활과 제도","text":"산악 씨족은 공동 창고를 유지하고 겨울 통행세 일부를 구조대에 배정한다. 서리늑대는 여름에는 높은 암반으로 물러나므로 늑대 출현은 이상 한파의 징후다."},{"heading":"현재의 갈등","text":"영웅 오르반은 고개를 구한 전공이 있지만 광산 노동자의 대표가 아니다. 광부들은 영웅의 동상을 세우는 예산보다 환기갱 수선을 원한다."},{"heading":"후속 확장","text":"세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다."}]}},{"id":"ART-LOC-LUMEN","record":"LOC-LUMEN","name":"루멘 자유시","category":"Place","tags":["Place","루멘 자유시"],"references":["LOC-LUMEN","LOC-VELSU","NPC-MIRA","ORG-GLASS"],"body":"\n# 루멘 자유시\n\n중앙 분지의 수로와 렌즈 공방이 모인 자유시.\n\n## 생활과 제도\n\n일곱 구역의 선출 의원이 예산을 의결한다. 유리학회는 술식 면허를 심사하지만 체포 권한은 없다. 북문 노동자들은 고가의 면허 보증금 때문에 임시 허가제를 요구한다.\n\n## 현재의 갈등\n\n수로는 벨수 강의 취수량에 의존한다. 도시 확장과 하류 어촌의 산란기 물 확보가 충돌한다. 수로 도면 원본을 보관한 기록원 미라는 양쪽의 숨겨진 우회 수문을 알고 있다.\n\n## 후속 확장\n\n세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다.\n\n## 관련 문서\n\n- [벨수 수계](LOC-VELSU.md)\n- [미라 덴](NPC-MIRA.md)\n- [유리학회](ORG-GLASS.md)\n","data":{"id":"LOC-LUMEN","kind":"Place","name":"루멘 자유시","summary":"중앙 분지의 수로와 렌즈 공방이 모인 자유시.","references":["LOC-VELSU","NPC-MIRA","ORG-GLASS"],"schema_version":1,"details":[{"heading":"생활과 제도","text":"일곱 구역의 선출 의원이 예산을 의결한다. 유리학회는 술식 면허를 심사하지만 체포 권한은 없다. 북문 노동자들은 고가의 면허 보증금 때문에 임시 허가제를 요구한다."},{"heading":"현재의 갈등","text":"수로는 벨수 강의 취수량에 의존한다. 도시 확장과 하류 어촌의 산란기 물 확보가 충돌한다. 수로 도면 원본을 보관한 기록원 미라는 양쪽의 숨겨진 우회 수문을 알고 있다."},{"heading":"후속 확장","text":"세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다."}]}},{"id":"ART-LOC-SAHEL","record":"LOC-SAHEL","name":"사헬 유리사막","category":"Place","tags":["Place","사헬 유리사막"],"references":["LOC-SAHEL","MON-WORM","NPC-SURI","ORG-RED"],"body":"\n# 사헬 유리사막\n\n하늘 잔해의 열로 모래층이 유리로 굳은 남부 지역.\n\n## 생활과 제도\n\n사막 주민은 깊은 지하수와 새벽 안개를 모아 산다. 가호가 없는 우물 기술자가 도시를 먹여 살린다. 잔해 채굴은 렌즈 산업에 필수지만 사막 벌레의 번식 통로를 훼손한다.\n\n## 현재의 갈등\n\n붉은 측량단은 폐허 좌표를 팔며, 진짜 피난로와 과장된 보물 지도를 함께 유통한다. 이곳에서 발견한 물건의 소유권을 대륙 어느 법정이 판단하는지도 다툼이다.\n\n## 후속 확장\n\n세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다.\n\n## 관련 문서\n\n- [유리굴착충](MON-WORM.md)\n- [수리 안](NPC-SURI.md)\n- [붉은 측량단](ORG-RED.md)\n","data":{"id":"LOC-SAHEL","kind":"Place","name":"사헬 유리사막","summary":"하늘 잔해의 열로 모래층이 유리로 굳은 남부 지역.","references":["MON-WORM","NPC-SURI","ORG-RED"],"schema_version":1,"details":[{"heading":"생활과 제도","text":"사막 주민은 깊은 지하수와 새벽 안개를 모아 산다. 가호가 없는 우물 기술자가 도시를 먹여 살린다. 잔해 채굴은 렌즈 산업에 필수지만 사막 벌레의 번식 통로를 훼손한다."},{"heading":"현재의 갈등","text":"붉은 측량단은 폐허 좌표를 팔며, 진짜 피난로와 과장된 보물 지도를 함께 유통한다. 이곳에서 발견한 물건의 소유권을 대륙 어느 법정이 판단하는지도 다툼이다."},{"heading":"후속 확장","text":"세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다."}]}},{"id":"ART-LOC-SURI-WELL","record":"LOC-SURI-WELL","name":"수리 마을의 공동 우물마당","category":"Place","tags":["사헬","공동노동"],"references":["LOC-SURI-WELL","LOC-SAHEL","NPC-SURI","CUL-WELL-DAY","THR-WATER"],"body":"# 수리 마을의 공동 우물마당\n\n## 공간과 물\n\n수리가 사는 마을의 우물마당은 유리질 모래바닥에 낮은 돌턱을 두른 곳이다. 우물 입구와 물을 받는 줄은 떨어져 있어 아이가 줄을 잡으러 뛰어들지 않게 한다. 그늘막 아래의 저장 항아리는 하루의 부족분을 버티는 용도이지 지하수의 회복을 대신하지 못한다. 마당이 공급하는 물은 이 마을의 식수와 작은 밭 일부에 쓰이며 사막 전체를 먹일 규모가 아니다.\n\n## 관리와 접근\n\n우물을 함께 쓰는 집들이 마당의 청소 순번과 열쇠 보관자를 정한다. 수리는 기술 판단을 맡지만 홀로 물값을 바꾸거나 채굴권을 넘길 권한은 없다. 모래받이를 건조하는 선반 옆에는 폐기 부품을 따로 놓아 학습용 부품이 다시 배관에 섞이지 않게 한다. 여행자는 관리 집에 물을 청하고 저장량이 적을 때의 배분 설명을 듣는다.\n\n## 협상의 자리\n\n바르카와의 펌프 협상을 앞두고 주민들은 그늘막에서 고장 난 밸브를 돌려 보며 교체 비용을 묻는다. 우물마당이 있다는 사실은 새 펌프가 설치되었다는 뜻이 아니다. 공동 정비일에 남긴 부품 그림과 노동 장부는 다음 수리 교육의 출발점이지만, 도면 공개와 부품 공급 계약은 아직 풀어야 할 문제다.\n","data":{"schema_version":1,"id":"LOC-SURI-WELL","kind":"Place","name":"수리 마을의 공동 우물마당","summary":"사헬에서 물 배분과 부품 학습이 이루어지는 작은 공동 작업 공간.","references":["LOC-SAHEL","NPC-SURI","CUL-WELL-DAY","THR-WATER"],"details":[{"heading":"공간과 물","text":"수리가 사는 마을의 우물마당은 유리질 모래바닥에 낮은 돌턱을 두른 곳이다. 우물 입구와 물을 받는 줄은 떨어져 있어 아이가 줄을 잡으러 뛰어들지 않게 한다. 그늘막 아래의 저장 항아리는 하루의 부족분을 버티는 용도이지 지하수의 회복을 대신하지 못한다. 마당이 공급하는 물은 이 마을의 식수와 작은 밭 일부에 쓰이며 사막 전체를 먹일 규모가 아니다."},{"heading":"관리와 접근","text":"우물을 함께 쓰는 집들이 마당의 청소 순번과 열쇠 보관자를 정한다. 수리는 기술 판단을 맡지만 홀로 물값을 바꾸거나 채굴권을 넘길 권한은 없다. 모래받이를 건조하는 선반 옆에는 폐기 부품을 따로 놓아 학습용 부품이 다시 배관에 섞이지 않게 한다. 여행자는 관리 집에 물을 청하고 저장량이 적을 때의 배분 설명을 듣는다."},{"heading":"협상의 자리","text":"바르카와의 펌프 협상을 앞두고 주민들은 그늘막에서 고장 난 밸브를 돌려 보며 교체 비용을 묻는다. 우물마당이 있다는 사실은 새 펌프가 설치되었다는 뜻이 아니다. 공동 정비일에 남긴 부품 그림과 노동 장부는 다음 수리 교육의 출발점이지만, 도면 공개와 부품 공급 계약은 아직 풀어야 할 문제다."}]}},{"id":"ART-LOC-VELSU-STORE","record":"LOC-VELSU-STORE","name":"갈대섬 구조 장비창고","category":"Place","tags":["Place","벨수","구조"],"references":["LOC-VELSU-STORE","LOC-VELSU","ORG-FERRY","NPC-TOMA","CUL-VELSU-DRILL","EVT-TRADE-PARTIAL"],"body":"\n# 갈대섬 구조 장비창고\n\n벨수 연맹이 구조용 밧줄과 방수천을 보관하는 공동 창고.\n\n## 보관과 사용\n\n갈대섬의 높은 흙둔덕 위 목조 창고에는 밧줄과 방수천을 말려 걸고 노와 수리 도구를 따로 둔다. 연맹 회원이 교대로 상태를 확인하며 홍수 때 구조 배정에 맞춰 장비를 내준다. 창고가 강이나 마을의 배를 소유하는 것은 아니다.\n\n## 장부와 마찰\n\n훈련 뒤 젖거나 닳은 물품은 사용자가 장부에 적고 다음 점검자가 교체 필요를 표시한다. 토마는 조난자에게 운임을 흥정하지 않지만 손실은 연맹이 분담해 달라고 요구한다. 임시분담장부에 적힌 비용을 누가 부담할지와 보수 및 생계 보상의 우선순위는 계속 논의 중이다.\n\n## 부분 수선\n\n초여름 교역 지연 뒤 다온과 동료들은 먼저 도착한 철 부속 하나로 닳은 줄의 고정구를 교체했다. 나머지 주문과 대기 노동의 보상은 여전히 정해지지 않았으며 임시분담장부는 지급을 보장하지 않는다.\n\n## 관련 문서\n\n- [LOC-VELSU](LOC-VELSU.md)\n- [ORG-FERRY](ORG-FERRY.md)\n- [NPC-TOMA](NPC-TOMA.md)\n- [CUL-VELSU-DRILL](CUL-VELSU-DRILL.md)\n\n- [EVT-TRADE-PARTIAL](EVT-TRADE-PARTIAL.md)\n","data":{"id":"LOC-VELSU-STORE","kind":"Place","name":"갈대섬 구조 장비창고","summary":"벨수 연맹이 구조용 밧줄과 방수천을 보관하는 공동 창고.","references":["LOC-VELSU","ORG-FERRY","NPC-TOMA","CUL-VELSU-DRILL","EVT-TRADE-PARTIAL"],"schema_version":1,"details":[{"heading":"보관과 사용","text":"갈대섬의 높은 흙둔덕 위 목조 창고에는 밧줄과 방수천을 말려 걸고 노와 수리 도구를 따로 둔다. 연맹 회원이 교대로 상태를 확인하며 홍수 때 구조 배정에 맞춰 장비를 내준다. 창고가 강이나 마을의 배를 소유하는 것은 아니다."},{"heading":"장부와 마찰","text":"훈련 뒤 젖거나 닳은 물품은 사용자가 장부에 적고 다음 점검자가 교체 필요를 표시한다. 토마는 조난자에게 운임을 흥정하지 않지만 손실은 연맹이 분담해 달라고 요구한다. 임시분담장부에 적힌 비용을 누가 부담할지와 보수 및 생계 보상의 우선순위는 계속 논의 중이다."},{"heading":"부분 수선","text":"초여름 교역 지연 뒤 다온과 동료들은 먼저 도착한 철 부속 하나로 닳은 줄의 고정구를 교체했다. 나머지 주문과 대기 노동의 보상은 여전히 정해지지 않았으며 임시분담장부는 지급을 보장하지 않는다."}]}},{"id":"ART-LOC-VELSU","record":"LOC-VELSU","name":"벨수 수계","category":"Place","tags":["Place","벨수 수계"],"references":["LOC-VELSU","NPC-TOMA","ORG-FERRY","SPI-NEM"],"body":"\n# 벨수 수계\n\n범람원과 갈대섬을 묶는 어업·뱃길 공동체.\n\n## 생활과 제도\n\n마을마다 홍수 때 배를 내는 의무가 있다. 강 수호자 네므의 가호는 구조를 돕지만 제방 관리까지 대신하지 않는다. 봄 산란기에는 군용 수송선도 얕은 여울을 우회해야 한다.\n\n## 현재의 갈등\n\n상류의 취수 허가와 하류의 생계가 부딪힌다. 뱃사공 토마는 밀수품보다 피난민을 우선 태워 운송 길드와 자주 다툰다.\n\n## 후속 확장\n\n세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다.\n\n## 관련 문서\n\n- [토마 리드](NPC-TOMA.md)\n- [갈대 노 연맹](ORG-FERRY.md)\n- [네므 — 여울의 정령](SPI-NEM.md)\n","data":{"id":"LOC-VELSU","kind":"Place","name":"벨수 수계","summary":"범람원과 갈대섬을 묶는 어업·뱃길 공동체.","references":["NPC-TOMA","ORG-FERRY","SPI-NEM"],"schema_version":1,"details":[{"heading":"생활과 제도","text":"마을마다 홍수 때 배를 내는 의무가 있다. 강 수호자 네므의 가호는 구조를 돕지만 제방 관리까지 대신하지 않는다. 봄 산란기에는 군용 수송선도 얕은 여울을 우회해야 한다."},{"heading":"현재의 갈등","text":"상류의 취수 허가와 하류의 생계가 부딪힌다. 뱃사공 토마는 밀수품보다 피난민을 우선 태워 운송 길드와 자주 다툰다."},{"heading":"후속 확장","text":"세부 마을·직업·음식·축제는 확장 가능하다. 기존 지리와 생계 조건을 유지하고 새 행정 권한을 부여할 때는 주체와 범위를 기록한다."}]}},{"id":"ART-MON-MIMIC","record":"MON-MIMIC","name":"메아리 포식자","category":"Monster","tags":["Monster","메아리 포식자"],"references":["MON-MIMIC","LOC-HUSH","ORG-HUSH"],"body":"\n# 메아리 포식자\n\n무음림의 빈 나무에 기생하며 들은 소리를 흉내 내는 생물.\n\n## 생태와 능력\n\n피해자의 목소리를 흉내 내지만 기억을 읽지 못한다. 같은 문장을 반복하는 습성과 잎맥 모양의 입이 식별 단서다. 빛과 진동으로 위치를 확인하면 소리를 지르지 않고 피할 수 있다.\n\n## 관계와 대응\n\n구조를 요청하는 진짜 사람과 혼동하기 쉽다. 따라서 침묵회는 암구호만 믿지 않고 시야 확인과 밧줄 연락을 병행한다. 사람의 형상을 완벽하게 복제하지는 못한다.\n\n## 생활과 후속 이야기\n\n먹이는 소리에 다가오는 작은 동물이며 인간을 흉내 내는 개체는 길가에서 오래 산 경우가 많다. 숲길을 옮기면 먹이 습관도 달라진다. 둥지를 태우면 저장된 소리가 한꺼번에 터져 구조자를 혼란시키므로 무작정 소각하지 않는다. 어린 개체의 소리 수집을 놀이로 오해해 집으로 데려오는 일도 위험하다.\n\n## 관련 문서\n\n- [무음림](LOC-HUSH.md)\n- [침묵의 정원](ORG-HUSH.md)\n","data":{"id":"MON-MIMIC","kind":"Monster","name":"메아리 포식자","summary":"무음림의 빈 나무에 기생하며 들은 소리를 흉내 내는 생물.","references":["LOC-HUSH","ORG-HUSH"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"피해자의 목소리를 흉내 내지만 기억을 읽지 못한다. 같은 문장을 반복하는 습성과 잎맥 모양의 입이 식별 단서다. 빛과 진동으로 위치를 확인하면 소리를 지르지 않고 피할 수 있다."},{"heading":"관계와 대응","text":"구조를 요청하는 진짜 사람과 혼동하기 쉽다. 따라서 침묵회는 암구호만 믿지 않고 시야 확인과 밧줄 연락을 병행한다. 사람의 형상을 완벽하게 복제하지는 못한다."},{"heading":"생활과 후속 이야기","text":"먹이는 소리에 다가오는 작은 동물이며 인간을 흉내 내는 개체는 길가에서 오래 산 경우가 많다. 숲길을 옮기면 먹이 습관도 달라진다. 둥지를 태우면 저장된 소리가 한꺼번에 터져 구조자를 혼란시키므로 무작정 소각하지 않는다. 어린 개체의 소리 수집을 놀이로 오해해 집으로 데려오는 일도 위험하다."}]}},{"id":"ART-MON-WOLF","record":"MON-WOLF","name":"서리늑대","category":"Monster","tags":["Monster","서리늑대"],"references":["MON-WOLF","EVT-PASS","LOC-KARD"],"body":"\n# 서리늑대\n\n북부 고지의 무리 사냥 포식자.\n\n## 생태와 능력\n\n털 사이 얼음 결정은 주변 습기를 얼려 만든다. 결정이 자랄수록 체열을 잃어 따뜻한 사체와 피난처가 필요하다. 불에 무조건 약한 것이 아니라 갑작스러운 온도 변화가 감각을 흐린다.\n\n## 관계와 대응\n\n지능은 뛰어나지만 인간 언어 계약을 맺지는 못한다. 이상 한파로 먹이가 줄어 309년 고개로 내려왔다. 무리를 몰살하면 사슴 개체수가 늘어 산림에 다른 피해가 생긴다.\n\n## 생활과 후속 이야기\n\n무리의 선두는 고정된 수컷 하나가 아니라 먹이 위치를 잘 아는 개체가 맡는다. 발자국의 얼음막과 휴식 장소를 보면 이동 방향을 추정할 수 있다. 사냥꾼은 모피를 얻지만 모든 서리 결정이 마법 재료로 보존되는 것은 아니다. 해빙 뒤 남은 털은 일반적인 방한재에 가깝다.\n\n## 관련 문서\n\n- [검은 눈 고개 전투](EVT-PASS.md)\n- [카르드 고개](LOC-KARD.md)\n","data":{"id":"MON-WOLF","kind":"Monster","name":"서리늑대","summary":"북부 고지의 무리 사냥 포식자.","references":["EVT-PASS","LOC-KARD"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"털 사이 얼음 결정은 주변 습기를 얼려 만든다. 결정이 자랄수록 체열을 잃어 따뜻한 사체와 피난처가 필요하다. 불에 무조건 약한 것이 아니라 갑작스러운 온도 변화가 감각을 흐린다."},{"heading":"관계와 대응","text":"지능은 뛰어나지만 인간 언어 계약을 맺지는 못한다. 이상 한파로 먹이가 줄어 309년 고개로 내려왔다. 무리를 몰살하면 사슴 개체수가 늘어 산림에 다른 피해가 생긴다."},{"heading":"생활과 후속 이야기","text":"무리의 선두는 고정된 수컷 하나가 아니라 먹이 위치를 잘 아는 개체가 맡는다. 발자국의 얼음막과 휴식 장소를 보면 이동 방향을 추정할 수 있다. 사냥꾼은 모피를 얻지만 모든 서리 결정이 마법 재료로 보존되는 것은 아니다. 해빙 뒤 남은 털은 일반적인 방한재에 가깝다."}]}},{"id":"ART-MON-WORM","record":"MON-WORM","name":"유리굴착충","category":"Monster","tags":["Monster","유리굴착충"],"references":["MON-WORM","LOC-SAHEL","ORG-RED"],"body":"\n# 유리굴착충\n\n사헬 지표 아래 유리층을 먹어 굴을 만드는 대형 절지동물.\n\n## 생태와 능력\n\n소화 과정의 열로 굴 벽을 녹이며, 반복 진동에 접근한다. 펌프와 채굴 망치가 무리를 끌어들일 수 있다. 굴을 무너뜨리는 것보다 진동원을 옮기는 편이 마을을 덜 해친다.\n\n## 관계와 대응\n\n껍질은 렌즈 연마재가 되지만 산란기 채취는 우물 아래 지반을 불안정하게 한다. 붉은 측량단의 안전 지도가 실제 번식 주기를 반영하는지 검증할 필요가 있다.\n\n## 생활과 후속 이야기\n\n번식 굴은 어린 개체가 지표로 나올 때까지 여러 출구를 유지한다. 출구 하나를 막으면 다른 출구가 우물 아래로 생길 수 있다. 마을의 숙련 작업자는 굴의 온도와 미세 진동을 함께 살피며, 한 번의 측정으로 안전을 보장하지 않는다. 굴착충이 남긴 오래된 굴은 피난로가 될 수 있지만 붕괴 검사가 먼저다.\n\n## 관련 문서\n\n- [사헬 유리사막](LOC-SAHEL.md)\n- [붉은 측량단](ORG-RED.md)\n","data":{"id":"MON-WORM","kind":"Monster","name":"유리굴착충","summary":"사헬 지표 아래 유리층을 먹어 굴을 만드는 대형 절지동물.","references":["LOC-SAHEL","ORG-RED"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"소화 과정의 열로 굴 벽을 녹이며, 반복 진동에 접근한다. 펌프와 채굴 망치가 무리를 끌어들일 수 있다. 굴을 무너뜨리는 것보다 진동원을 옮기는 편이 마을을 덜 해친다."},{"heading":"관계와 대응","text":"껍질은 렌즈 연마재가 되지만 산란기 채취는 우물 아래 지반을 불안정하게 한다. 붉은 측량단의 안전 지도가 실제 번식 주기를 반영하는지 검증할 필요가 있다."},{"heading":"생활과 후속 이야기","text":"번식 굴은 어린 개체가 지표로 나올 때까지 여러 출구를 유지한다. 출구 하나를 막으면 다른 출구가 우물 아래로 생길 수 있다. 마을의 숙련 작업자는 굴의 온도와 미세 진동을 함께 살피며, 한 번의 측정으로 안전을 보장하지 않는다. 굴착충이 남긴 오래된 굴은 피난로가 될 수 있지만 붕괴 검사가 먼저다."}]}},{"id":"ART-NPC-BREN","record":"NPC-BREN","name":"브렌 돌","category":"Character","tags":["Character","브렌 돌"],"references":["NPC-BREN","HERO-ORVAN","LOC-KARD"],"body":"\n# 브렌 돌\n\n카르드 광산 환기갱 관리인.\n\n## 능력과 이력\n\n전투 중 피난로를 개방했으나 평소에는 광부의 호흡과 갱도 온도를 확인한다. 오래된 갱도 도면은 그의 경험으로 보완되며 술식 탐지보다 정확한 구간도 있다.\n\n## 관계와 선택\n\n동상 건립비를 환기 수선비로 돌리자는 청원을 냈다. 오르반에게 공개 지지를 부탁했지만 영웅의 채권자가 반대한다.\n\n## 생활과 후속 이야기\n\n브렌은 하루의 시작에 종이 띠를 환기구에 매달아 바람을 확인한다. 비싼 탐지 장치가 멈춰도 계속할 수 있는 검사법을 제자에게 가르친다. 가족은 그가 은퇴하길 바라지만 후임 교육비가 부족하다. 광산 문을 닫는 것과 위험한 상태로 계속 일하는 것 사이에서 노동자가 선택할 수 있는 대안을 만들고 싶어 한다.\n\n## 관련 문서\n\n- [오르반 켈](HERO-ORVAN.md)\n- [카르드 고개](LOC-KARD.md)\n","data":{"id":"NPC-BREN","kind":"Character","name":"브렌 돌","summary":"카르드 광산 환기갱 관리인.","references":["HERO-ORVAN","LOC-KARD"],"born":269,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"전투 중 피난로를 개방했으나 평소에는 광부의 호흡과 갱도 온도를 확인한다. 오래된 갱도 도면은 그의 경험으로 보완되며 술식 탐지보다 정확한 구간도 있다."},{"heading":"관계와 선택","text":"동상 건립비를 환기 수선비로 돌리자는 청원을 냈다. 오르반에게 공개 지지를 부탁했지만 영웅의 채권자가 반대한다."},{"heading":"생활과 후속 이야기","text":"브렌은 하루의 시작에 종이 띠를 환기구에 매달아 바람을 확인한다. 비싼 탐지 장치가 멈춰도 계속할 수 있는 검사법을 제자에게 가르친다. 가족은 그가 은퇴하길 바라지만 후임 교육비가 부족하다. 광산 문을 닫는 것과 위험한 상태로 계속 일하는 것 사이에서 노동자가 선택할 수 있는 대안을 만들고 싶어 한다."}]}},{"id":"ART-NPC-DAON","record":"NPC-DAON","name":"다온","category":"Character","tags":["Character","벨수","다온"],"references":["NPC-DAON","LOC-VELSU","ORG-FERRY","CUL-VELSU-DRILL","LOC-VELSU-STORE"],"body":"\n# 다온\n\n벨수의 제방 노동자이자 구조 장비 점검자.\n\n## 일과 생계\n\n다온은 갈대 노 연맹의 제방 노동자로 흙둔덕과 접근로를 살피고 품삯을 받는다. 구조 장비창고에서는 닳은 줄을 점검하고 교체가 필요한 물품을 장부에 표시한다. 홍수 대응은 중요한 일이지만 점검과 훈련에 든 시간이 생계를 대신하지는 못한다.\n\n## 의견과 선택\n\n다온은 공동 훈련에 참여하면서도 잃은 운임과 품삯을 누가 부담할지 공개적으로 논의하자고 주장한다. 임시분담장부는 각 비용을 기록할 뿐 지급을 보장하지 않는다. 다온은 안전하지 않은 접근로에 투입되기를 거절하고 보수가 끝날 때까지 다른 길을 제안할 수 있다.\n\n## 앞으로의 일\n\n다온은 훈련에서 배를 받는 사람과 노 젓는 사람의 역할을 번갈아 익힌다. 다음 물철에는 창고의 젖은 줄을 더 빨리 말릴 자리를 마련하고 싶지만, 재료와 작업 시간을 마련하려면 동료들과 분담을 협의해야 한다.\n\n## 관련 문서\n\n- [LOC-VELSU](LOC-VELSU.md)\n- [ORG-FERRY](ORG-FERRY.md)\n- [CUL-VELSU-DRILL](CUL-VELSU-DRILL.md)\n- [LOC-VELSU-STORE](LOC-VELSU-STORE.md)\n","data":{"schema_version":1,"id":"NPC-DAON","kind":"Character","name":"다온","summary":"벨수의 제방 노동자이자 구조 장비 점검자.","references":["LOC-VELSU","ORG-FERRY","CUL-VELSU-DRILL","LOC-VELSU-STORE"],"born":287,"death_status":"alive","as_of":312,"details":[{"heading":"일과 생계","text":"다온은 갈대 노 연맹의 제방 노동자로 흙둔덕과 접근로를 살피고 품삯을 받는다. 구조 장비창고에서는 닳은 줄을 점검하고 교체가 필요한 물품을 장부에 표시한다. 홍수 대응은 중요한 일이지만 점검과 훈련에 든 시간이 생계를 대신하지는 못한다."},{"heading":"의견과 선택","text":"다온은 공동 훈련에 참여하면서도 잃은 운임과 품삯을 누가 부담할지 공개적으로 논의하자고 주장한다. 임시분담장부는 각 비용을 기록할 뿐 지급을 보장하지 않는다. 다온은 안전하지 않은 접근로에 투입되기를 거절하고 보수가 끝날 때까지 다른 길을 제안할 수 있다."},{"heading":"앞으로의 일","text":"다온은 훈련에서 배를 받는 사람과 노 젓는 사람의 역할을 번갈아 익힌다. 다음 물철에는 창고의 젖은 줄을 더 빨리 말릴 자리를 마련하고 싶지만, 재료와 작업 시간을 마련하려면 동료들과 분담을 협의해야 한다."}]}},{"id":"ART-NPC-ENA","record":"NPC-ENA","name":"에나 로","category":"Character","tags":["Character","에나 로"],"references":["NPC-ENA","ITM-LANTERN","SYS-DEATH"],"body":"\n# 에나 로\n\n군도 출신의 순회 치유사.\n\n## 능력과 이력\n\n외과와 가호 치료를 함께 배웠다. 죽음의 경계를 확인할 때 독립된 동료의 소견을 요구한다. 환자가 수호자와 계약하지 않겠다고 해도 일반 치료를 거부하지 않는다.\n\n## 관계와 선택\n\n수명이 다한 환자의 가족이 구명 등불을 부활 도구로 오해한다. 에나는 거짓 희망을 팔지 않으면서 가족의 이별을 돕는다.\n\n## 생활과 후속 이야기\n\n진료비를 내지 못하는 환자는 공동 기금에 기록하고 장기적으로 분담한다. 모든 치료를 무료로 약속하면 약재와 조수의 임금이 끊기기 때문이다. 환자의 가족에게 가능한 처치와 불가능한 처치를 따로 설명한다. 유일물 바늘을 갖고 있어도 열병의 원인 진단이나 깨끗한 식수 공급은 다른 사람의 협력이 필요하다.\n\n## 관련 문서\n\n- [구명 등불](ITM-LANTERN.md)\n- [죽음과 잔향](SYS-DEATH.md)\n","data":{"id":"NPC-ENA","kind":"Character","name":"에나 로","summary":"군도 출신의 순회 치유사.","references":["ITM-LANTERN","SYS-DEATH"],"born":275,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"외과와 가호 치료를 함께 배웠다. 죽음의 경계를 확인할 때 독립된 동료의 소견을 요구한다. 환자가 수호자와 계약하지 않겠다고 해도 일반 치료를 거부하지 않는다."},{"heading":"관계와 선택","text":"수명이 다한 환자의 가족이 구명 등불을 부활 도구로 오해한다. 에나는 거짓 희망을 팔지 않으면서 가족의 이별을 돕는다."},{"heading":"생활과 후속 이야기","text":"진료비를 내지 못하는 환자는 공동 기금에 기록하고 장기적으로 분담한다. 모든 치료를 무료로 약속하면 약재와 조수의 임금이 끊기기 때문이다. 환자의 가족에게 가능한 처치와 불가능한 처치를 따로 설명한다. 유일물 바늘을 갖고 있어도 열병의 원인 진단이나 깨끗한 식수 공급은 다른 사람의 협력이 필요하다."}]}},{"id":"ART-NPC-HARIN","record":"NPC-HARIN","name":"하린 서","category":"Character","tags":["Character","하린 서"],"references":["NPC-HARIN","LOC-KARD","NPC-BREN","HERO-ORVAN","ORG-KARD-VENT"],"body":"\n# 하린 서\n\n카르드 환기갱에서 바람을 살피는 견습 점검원.\n\n## 일과 생계\n\n하린은 환기갱 점검 품삯과 쉬는 날 도구 손질 일로 생계를 잇는다. 종이 띠와 온도 기록을 대조하고 이상을 브렌에게 보고하며, 오래된 도면의 틀린 곳을 함께 고친다. 먼지와 추위에 오래 노출되면 기침이 심해져 작업을 멈추고 쉬어야 한다.\n\n## 관계와 선택\n\n브렌에게 점검을 배우지만 교육 시간을 내면 도구 손질 품삯을 잃는다. 하린은 점검 기록을 누구나 읽을 수 있게 남겨 후임들이 한 사람의 기억에 의존하지 않기를 바란다. 위험한 갱에 들어가라는 요청을 거절할 수 있으며, 오르반의 명성이 광부의 의견을 대신하지 않는다고 생각한다.\n\n## 비용과 목표\n\n하린은 장갑과 등불 기름을 직접 사며 가족의 식비도 보탠다. 갱이 멈추면 품삯이 줄지만 위험을 감춘 채 일하기보다 수선 기간의 생계 대책이 필요하다고 주장한다. 환기갱 모임에서 점검 기록을 공유하는 교육 시간을 유급으로 마련하는 것이 목표다.\n\n## 관련 문서\n\n- [LOC-KARD](LOC-KARD.md)\n- [NPC-BREN](NPC-BREN.md)\n- [HERO-ORVAN](HERO-ORVAN.md)\n- [ORG-KARD-VENT](ORG-KARD-VENT.md)\n","data":{"schema_version":1,"id":"NPC-HARIN","kind":"Character","name":"하린 서","summary":"카르드 환기갱에서 바람을 살피는 견습 점검원.","references":["LOC-KARD","NPC-BREN","HERO-ORVAN","ORG-KARD-VENT"],"born":291,"death_status":"alive","as_of":312,"details":[{"heading":"일과 생계","text":"하린은 환기갱 점검 품삯과 쉬는 날 도구 손질 일로 생계를 잇는다. 종이 띠와 온도 기록을 대조하고 이상을 브렌에게 보고하며, 오래된 도면의 틀린 곳을 함께 고친다. 먼지와 추위에 오래 노출되면 기침이 심해져 작업을 멈추고 쉬어야 한다."},{"heading":"관계와 선택","text":"브렌에게 점검을 배우지만 교육 시간을 내면 도구 손질 품삯을 잃는다. 하린은 점검 기록을 누구나 읽을 수 있게 남겨 후임들이 한 사람의 기억에 의존하지 않기를 바란다. 위험한 갱에 들어가라는 요청을 거절할 수 있으며, 오르반의 명성이 광부의 의견을 대신하지 않는다고 생각한다."},{"heading":"비용과 목표","text":"하린은 장갑과 등불 기름을 직접 사며 가족의 식비도 보탠다. 갱이 멈추면 품삯이 줄지만 위험을 감춘 채 일하기보다 수선 기간의 생계 대책이 필요하다고 주장한다. 환기갱 모임에서 점검 기록을 공유하는 교육 시간을 유급으로 마련하는 것이 목표다."}]}},{"id":"ART-NPC-LEA","record":"NPC-LEA","name":"레아 펜","category":"Character","tags":["Character","레아 펜"],"references":["NPC-LEA","HERO-SERIN","ORG-COMPACT"],"body":"\n# 레아 펜\n\n맹약원 구조기금 실무관.\n\n## 역할\n\n가입 도시의 구조 분담금을 정산하며 피해자 명부를 대조한다. 예산을 독단적으로 전용할 권한은 없으나 긴급 지급 절차를 요청할 수 있다.\n\n## 선택\n\n세린에게 군 보급을 맡기면 기금이 늘지만 구조 여력이 줄어든다. 마을별 부담 능력을 공개하면 부유 도시의 반발을 받으므로 숫자와 정치 사이에서 협상한다.\n\n## 생활과 후속 이야기\n\n레아의 책상에는 구조 요청서와 지급 영수증이 함께 놓인다. 숫자가 맞아도 실제 피해자가 빠질 수 있음을 알아 현장을 방문한다. 자신의 권한을 넘는 약속은 하지 않지만 어느 위원에게 결정을 요구해야 하는지 알려 준다. 장기 목표는 영웅 한 사람의 명성에 기대지 않는 상시 재해 기금을 만드는 것이다.\n\n## 관련 문서\n\n- [세린 바엘](HERO-SERIN.md)\n- [맹약원](ORG-COMPACT.md)\n","data":{"id":"NPC-LEA","kind":"Character","name":"레아 펜","summary":"맹약원 구조기금 실무관.","references":["HERO-SERIN","ORG-COMPACT"],"born":282,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"역할","text":"가입 도시의 구조 분담금을 정산하며 피해자 명부를 대조한다. 예산을 독단적으로 전용할 권한은 없으나 긴급 지급 절차를 요청할 수 있다."},{"heading":"선택","text":"세린에게 군 보급을 맡기면 기금이 늘지만 구조 여력이 줄어든다. 마을별 부담 능력을 공개하면 부유 도시의 반발을 받으므로 숫자와 정치 사이에서 협상한다."},{"heading":"생활과 후속 이야기","text":"레아의 책상에는 구조 요청서와 지급 영수증이 함께 놓인다. 숫자가 맞아도 실제 피해자가 빠질 수 있음을 알아 현장을 방문한다. 자신의 권한을 넘는 약속은 하지 않지만 어느 위원에게 결정을 요구해야 하는지 알려 준다. 장기 목표는 영웅 한 사람의 명성에 기대지 않는 상시 재해 기금을 만드는 것이다."}]}},{"id":"ART-NPC-MARE","record":"NPC-MARE","name":"마레 에스","category":"Character","tags":["Character","마레 에스"],"references":["NPC-MARE","ITM-LANTERN","ORG-LANTERN","SPI-SIA"],"body":"\n# 마레 에스\n\n순회 구조선 새벽새의 선장.\n\n## 능력과 이력\n\n등대 협약회의 구명 등불 보관자다. 소유자는 항구 공동 위원회이며 개인 재산으로 팔 수 없다. 선원에게 항해 임금과 조난 구조 보너스를 따로 지급한다.\n\n## 관계와 선택\n\n태풍 뒤 부족한 보급품을 군함에서 받으면 등불의 군용 대여를 요구받는다. 구조 의무와 선원의 안전을 동시에 지켜야 한다.\n\n## 생활과 후속 이야기\n\n마레는 항해 전 선원에게 구조 순서를 설명하고 누구도 혼자 밧줄을 끊지 못하게 한다. 선장은 마지막까지 배에 남는다는 명예보다 모두가 살아갈 절차를 중시한다. 구조한 사람이 나중에 적이 되더라도 당시의 구조를 잘못이라고 부르지 않는다. 다만 선원의 가족에게 위험을 숨기거나 임금을 미루는 일을 정당화하지 않는다.\n\n## 관련 문서\n\n- [구명 등불](ITM-LANTERN.md)\n- [등대 협약회](ORG-LANTERN.md)\n- [시아 — 돛 사이의 바람](SPI-SIA.md)\n","data":{"id":"NPC-MARE","kind":"Character","name":"마레 에스","summary":"순회 구조선 새벽새의 선장.","references":["ITM-LANTERN","ORG-LANTERN","SPI-SIA"],"born":281,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"등대 협약회의 구명 등불 보관자다. 소유자는 항구 공동 위원회이며 개인 재산으로 팔 수 없다. 선원에게 항해 임금과 조난 구조 보너스를 따로 지급한다."},{"heading":"관계와 선택","text":"태풍 뒤 부족한 보급품을 군함에서 받으면 등불의 군용 대여를 요구받는다. 구조 의무와 선원의 안전을 동시에 지켜야 한다."},{"heading":"생활과 후속 이야기","text":"마레는 항해 전 선원에게 구조 순서를 설명하고 누구도 혼자 밧줄을 끊지 못하게 한다. 선장은 마지막까지 배에 남는다는 명예보다 모두가 살아갈 절차를 중시한다. 구조한 사람이 나중에 적이 되더라도 당시의 구조를 잘못이라고 부르지 않는다. 다만 선원의 가족에게 위험을 숨기거나 임금을 미루는 일을 정당화하지 않는다."}]}},{"id":"ART-NPC-MIRA","record":"NPC-MIRA","name":"미라 덴","category":"Character","tags":["Character","미라 덴"],"references":["NPC-MIRA","HERO-IRA","LOC-LUMEN"],"body":"\n# 미라 덴\n\n루멘 수로 기록원이며 이라의 동생.\n\n## 능력과 이력\n\n수로 도면과 공사 장부를 다루며 마법 없이 측량 오류를 찾아낸다. 기록 공개 청구를 접수하지만 개인의 거주 정보는 가린다.\n\n## 관계와 선택\n\n우회 수문이 불법 취수인지 옛 홍수 피난 설비인지 먼저 확인하려 한다. 언니의 권능으로 애매한 기록을 자동 해결할 수는 없다.\n\n## 생활과 후속 이야기\n\n미라는 해독하기 어려운 옛 글씨를 먼저 베껴 쓰고 현대식 용어를 옆에 붙인다. 원본을 고쳐 버리면 나중에 자신의 해석이 틀렸음을 알 수 없기 때문이다. 언니가 유명해진 뒤에도 사소한 누수 민원을 중요하게 여긴다. 물이 새는 집의 사람에게 대륙의 정치보다 오늘의 침대가 마르는 일이 먼저라는 것을 안다.\n\n## 관련 문서\n\n- [이라 덴](HERO-IRA.md)\n- [루멘 자유시](LOC-LUMEN.md)\n","data":{"id":"NPC-MIRA","kind":"Character","name":"미라 덴","summary":"루멘 수로 기록원이며 이라의 동생.","references":["HERO-IRA","LOC-LUMEN"],"born":283,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"수로 도면과 공사 장부를 다루며 마법 없이 측량 오류를 찾아낸다. 기록 공개 청구를 접수하지만 개인의 거주 정보는 가린다."},{"heading":"관계와 선택","text":"우회 수문이 불법 취수인지 옛 홍수 피난 설비인지 먼저 확인하려 한다. 언니의 권능으로 애매한 기록을 자동 해결할 수는 없다."},{"heading":"생활과 후속 이야기","text":"미라는 해독하기 어려운 옛 글씨를 먼저 베껴 쓰고 현대식 용어를 옆에 붙인다. 원본을 고쳐 버리면 나중에 자신의 해석이 틀렸음을 알 수 없기 때문이다. 언니가 유명해진 뒤에도 사소한 누수 민원을 중요하게 여긴다. 물이 새는 집의 사람에게 대륙의 정치보다 오늘의 침대가 마르는 일이 먼저라는 것을 안다."}]}},{"id":"ART-NPC-SOLI","record":"NPC-SOLI","name":"솔이 단","category":"Character","tags":["Character","솔이 단"],"references":["NPC-SOLI","LOC-HUSH","ORG-HUSH","SPI-ASH","SYS-BLESSING","CUL-HUSH-BARTER"],"body":"\n# 솔이 단\n\n숲가에서 약초를 말리고 가호 조건을 협상하는 일꾼.\n\n## 일과 생계\n\n솔이는 약초를 말리고 꾸러미로 묶는 품삯으로 식량을 산다. 채취량이 줄면 건조 일감도 줄어들기 때문에 곡물을 따로 보관하고 이웃의 운반을 돕는다. 축축한 약초를 무리하게 팔면 신뢰를 잃으므로 불량품은 교환대에 올리지 않는다.\n\n## 협상과 선택\n\n솔이는 아샤에게 식물의 열 손상을 알아차리는 가호의 조건을 묻고 있다. 아샤의 자발적 응답과 이름 교환 전에는 계약이 성립하지 않으며 솔이도 거절할 수 있다. 묘목 세 그루를 매년 돌볼 시간과 물을 확보할 수 있는지 먼저 계산한다.\n\n## 목표와 한계\n\n솔이는 수확량을 늘리는 일보다 상한 약초를 덜 내다 파는 일을 원한다. 가호를 받더라도 치료나 재료가 저절로 생기지 않으며 정령에게도 생기와 기억의 비용이 든다. 합의하지 못하면 손으로 상태를 확인하며 거래량을 줄인다.\n\n## 관련 문서\n\n- [LOC-HUSH](LOC-HUSH.md)\n- [ORG-HUSH](ORG-HUSH.md)\n- [SPI-ASH](SPI-ASH.md)\n- [SYS-BLESSING](SYS-BLESSING.md)\n- [CUL-HUSH-BARTER](CUL-HUSH-BARTER.md)\n","data":{"schema_version":1,"id":"NPC-SOLI","kind":"Character","name":"솔이 단","summary":"숲가에서 약초를 말리고 가호 조건을 협상하는 일꾼.","references":["LOC-HUSH","ORG-HUSH","SPI-ASH","SYS-BLESSING","CUL-HUSH-BARTER"],"born":287,"death_status":"alive","as_of":312,"details":[{"heading":"일과 생계","text":"솔이는 약초를 말리고 꾸러미로 묶는 품삯으로 식량을 산다. 채취량이 줄면 건조 일감도 줄어들기 때문에 곡물을 따로 보관하고 이웃의 운반을 돕는다. 축축한 약초를 무리하게 팔면 신뢰를 잃으므로 불량품은 교환대에 올리지 않는다."},{"heading":"협상과 선택","text":"솔이는 아샤에게 식물의 열 손상을 알아차리는 가호의 조건을 묻고 있다. 아샤의 자발적 응답과 이름 교환 전에는 계약이 성립하지 않으며 솔이도 거절할 수 있다. 묘목 세 그루를 매년 돌볼 시간과 물을 확보할 수 있는지 먼저 계산한다."},{"heading":"목표와 한계","text":"솔이는 수확량을 늘리는 일보다 상한 약초를 덜 내다 파는 일을 원한다. 가호를 받더라도 치료나 재료가 저절로 생기지 않으며 정령에게도 생기와 기억의 비용이 든다. 합의하지 못하면 손으로 상태를 확인하며 거래량을 줄인다."}]}},{"id":"ART-NPC-SURI","record":"NPC-SURI","name":"수리 안","category":"Character","tags":["Character","수리 안"],"references":["NPC-SURI","LOC-SAHEL","NPC-VARKA"],"body":"\n# 수리 안\n\n사헬 우물 기술자와 마을의 계약 협상인.\n\n## 능력과 이력\n\n정령 가호 없이 지하수층을 읽는 기술을 배웠다. 물값을 받을 권리는 인정하지만 고갈 위험을 숨기는 채굴 계약에는 서명하지 않는다.\n\n## 관계와 선택\n\n바르카의 펌프를 들이면 당장 물을 얻지만 우물의 유지 기술이 외부 부품에 묶인다. 그녀의 목표는 독립적인 수리 교육이다.\n\n## 생활과 후속 이야기\n\n수리는 어린 도제에게 펌프를 분해하게 한 뒤 남은 부품의 이름을 설명하게 한다. 한 사람만 수리할 수 있는 장비는 그 사람이 아플 때 마을 전체를 멈추게 한다. 계약 협상에서도 가격보다 부품 도면 공개를 먼저 요구한다. 마을 안에는 당장의 물이 더 급하다는 이웃이 있어 그녀가 항상 만장일치의 지지를 받지는 않는다.\n\n## 관련 문서\n\n- [사헬 유리사막](LOC-SAHEL.md)\n- [바르카 렌](NPC-VARKA.md)\n","data":{"id":"NPC-SURI","kind":"Character","name":"수리 안","summary":"사헬 우물 기술자와 마을의 계약 협상인.","references":["LOC-SAHEL","NPC-VARKA"],"born":290,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"정령 가호 없이 지하수층을 읽는 기술을 배웠다. 물값을 받을 권리는 인정하지만 고갈 위험을 숨기는 채굴 계약에는 서명하지 않는다."},{"heading":"관계와 선택","text":"바르카의 펌프를 들이면 당장 물을 얻지만 우물의 유지 기술이 외부 부품에 묶인다. 그녀의 목표는 독립적인 수리 교육이다."},{"heading":"생활과 후속 이야기","text":"수리는 어린 도제에게 펌프를 분해하게 한 뒤 남은 부품의 이름을 설명하게 한다. 한 사람만 수리할 수 있는 장비는 그 사람이 아플 때 마을 전체를 멈추게 한다. 계약 협상에서도 가격보다 부품 도면 공개를 먼저 요구한다. 마을 안에는 당장의 물이 더 급하다는 이웃이 있어 그녀가 항상 만장일치의 지지를 받지는 않는다."}]}},{"id":"ART-NPC-TOMA","record":"NPC-TOMA","name":"토마 리드","category":"Character","tags":["Character","토마 리드"],"references":["NPC-TOMA","HERO-SERIN","ORG-FERRY","SPI-NEM"],"body":"\n# 토마 리드\n\n벨수의 뱃사공이자 두 조카의 보호자.\n\n## 능력과 이력\n\n강의 가호를 받았지만 배 수리와 운임 협상은 평범한 노동이다. 제방의 밤에 서른두 사람을 배로 옮겼으며 이 숫자는 전체 구조 인원이나 사망자 수와 다르다.\n\n## 관계와 선택\n\n조카의 교육비 때문에 더는 모든 승객을 무료로 태울 수 없다. 영웅을 돕는 인물이면서도 자신의 생계를 선택할 권리가 있다.\n\n## 생활과 후속 이야기\n\n토마의 배에는 값비싼 장식 대신 조카들이 칠한 색띠가 있다. 안개 속에서 가족이 배를 알아보도록 한 것이다. 손님에게는 운임을 분명히 말하지만 조난자에게 흥정하지 않는다. 구조 뒤 누가 손실을 부담할지 연맹에 요구하는 행동은 그 원칙을 버리는 일이 아니라 오래 지키기 위한 선택이다.\n\n## 관련 문서\n\n- [세린 바엘](HERO-SERIN.md)\n- [갈대 노 연맹](ORG-FERRY.md)\n- [네므 — 여울의 정령](SPI-NEM.md)\n","data":{"id":"NPC-TOMA","kind":"Character","name":"토마 리드","summary":"벨수의 뱃사공이자 두 조카의 보호자.","references":["HERO-SERIN","ORG-FERRY","SPI-NEM"],"born":280,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"강의 가호를 받았지만 배 수리와 운임 협상은 평범한 노동이다. 제방의 밤에 서른두 사람을 배로 옮겼으며 이 숫자는 전체 구조 인원이나 사망자 수와 다르다."},{"heading":"관계와 선택","text":"조카의 교육비 때문에 더는 모든 승객을 무료로 태울 수 없다. 영웅을 돕는 인물이면서도 자신의 생계를 선택할 권리가 있다."},{"heading":"생활과 후속 이야기","text":"토마의 배에는 값비싼 장식 대신 조카들이 칠한 색띠가 있다. 안개 속에서 가족이 배를 알아보도록 한 것이다. 손님에게는 운임을 분명히 말하지만 조난자에게 흥정하지 않는다. 구조 뒤 누가 손실을 부담할지 연맹에 요구하는 행동은 그 원칙을 버리는 일이 아니라 오래 지키기 위한 선택이다."}]}},{"id":"ART-NPC-VARKA","record":"NPC-VARKA","name":"바르카 렌","category":"Character","tags":["Character","바르카 렌"],"references":["NPC-VARKA","NPC-SURI","ORG-RED"],"body":"\n# 바르카 렌\n\n붉은 측량단의 현 단장.\n\n## 능력과 이력\n\n전쟁 고아 출신으로 안정된 교역을 원한다. 물 공급과 구조 비용을 먼저 부담한 뒤 채굴 독점권을 받아 이윤을 얻는다. 계약을 지키는 상인이지만 상대가 거절할 여지가 없는 상황을 이용한다.\n\n## 관계와 선택\n\n일부 지부의 지도 위조를 알면 손해를 감수하고 공개할지, 단체를 보호할지 선택해야 한다. 세계의 모든 재앙을 일으킨 배후는 아니다.\n\n## 생활과 후속 이야기\n\n바르카는 회계 장부를 읽고 우물의 생산량을 직접 확인한다. 마을의 채무를 탕감할 수는 있지만 그러면 다른 지부의 임금이 줄어든다고 계산한다. 그 계산에 포함되지 않은 생태 손실을 수리가 지적하면 불편해한다. 협상 상대를 죽이거나 속이는 것만으로 성공하는 단순한 악역이 아니라 불평등한 계약의 책임을 묻는 인물이다.\n\n## 관련 문서\n\n- [수리 안](NPC-SURI.md)\n- [붉은 측량단](ORG-RED.md)\n","data":{"id":"NPC-VARKA","kind":"Character","name":"바르카 렌","summary":"붉은 측량단의 현 단장.","references":["NPC-SURI","ORG-RED"],"born":274,"death_status":"alive","as_of":312,"schema_version":1,"details":[{"heading":"능력과 이력","text":"전쟁 고아 출신으로 안정된 교역을 원한다. 물 공급과 구조 비용을 먼저 부담한 뒤 채굴 독점권을 받아 이윤을 얻는다. 계약을 지키는 상인이지만 상대가 거절할 여지가 없는 상황을 이용한다."},{"heading":"관계와 선택","text":"일부 지부의 지도 위조를 알면 손해를 감수하고 공개할지, 단체를 보호할지 선택해야 한다. 세계의 모든 재앙을 일으킨 배후는 아니다."},{"heading":"생활과 후속 이야기","text":"바르카는 회계 장부를 읽고 우물의 생산량을 직접 확인한다. 마을의 채무를 탕감할 수는 있지만 그러면 다른 지부의 임금이 줄어든다고 계산한다. 그 계산에 포함되지 않은 생태 손실을 수리가 지적하면 불편해한다. 협상 상대를 죽이거나 속이는 것만으로 성공하는 단순한 악역이 아니라 불평등한 계약의 책임을 묻는 인물이다."}]}},{"id":"ART-NPC-YURI","record":"NPC-YURI","name":"유리","category":"Character","tags":["Character","벨수","유리"],"references":["NPC-YURI","NPC-TOMA","LOC-VELSU","CUL-VELSU-DRILL","LOC-VELSU-STORE"],"body":"\n# 유리\n\n토마가 보호하는 두 조카 중 한 사람.\n\n## 가족과 배움\n\n유리는 토마가 돌보는 두 조카 중 한 사람으로 벨수에서 학교에 다닌다. 교육비는 가족의 운임 선택에 영향을 주지만 유리는 그 부담만으로 정의되지 않는다. 안개 속에서 토마의 배를 알아볼 수 있도록 다른 조카와 함께 배의 색띠를 칠했다.\n\n## 관계와 선택\n\n유리는 물길과 장부 읽기에 관심이 있어 창고에서 물품 이름과 수량을 배우고 싶어 한다. 토마를 돕고 싶어도 위험한 구조에 나서는 대신 안전한 곳에서 할 일을 고를 수 있다. 가족의 필요와 자신의 공부 시간이 겹치면 부탁을 거절하거나 시간을 다시 정한다.\n\n## 바라는 일\n\n유리는 공동 구조 훈련을 지켜보며 사람을 물가에서 받는 역할에도 기술이 필요하다는 것을 배운다. 언젠가 마을 아이들에게 물길 표식을 읽는 법을 가르치고 싶지만, 먼저 수업을 마치고 어른들에게 안전한 범위의 일을 배워야 한다.\n\n## 관련 문서\n\n- [NPC-TOMA](NPC-TOMA.md)\n- [LOC-VELSU](LOC-VELSU.md)\n- [CUL-VELSU-DRILL](CUL-VELSU-DRILL.md)\n- [LOC-VELSU-STORE](LOC-VELSU-STORE.md)\n","data":{"schema_version":1,"id":"NPC-YURI","kind":"Character","name":"유리","summary":"토마가 보호하는 두 조카 중 한 사람.","references":["NPC-TOMA","LOC-VELSU","CUL-VELSU-DRILL","LOC-VELSU-STORE"],"born":300,"death_status":"alive","as_of":312,"details":[{"heading":"가족과 배움","text":"유리는 토마가 돌보는 두 조카 중 한 사람으로 벨수에서 학교에 다닌다. 교육비는 가족의 운임 선택에 영향을 주지만 유리는 그 부담만으로 정의되지 않는다. 안개 속에서 토마의 배를 알아볼 수 있도록 다른 조카와 함께 배의 색띠를 칠했다."},{"heading":"관계와 선택","text":"유리는 물길과 장부 읽기에 관심이 있어 창고에서 물품 이름과 수량을 배우고 싶어 한다. 토마를 돕고 싶어도 위험한 구조에 나서는 대신 안전한 곳에서 할 일을 고를 수 있다. 가족의 필요와 자신의 공부 시간이 겹치면 부탁을 거절하거나 시간을 다시 정한다."},{"heading":"바라는 일","text":"유리는 공동 구조 훈련을 지켜보며 사람을 물가에서 받는 역할에도 기술이 필요하다는 것을 배운다. 언젠가 마을 아이들에게 물길 표식을 읽는 법을 가르치고 싶지만, 먼저 수업을 마치고 어른들에게 안전한 범위의 일을 배워야 한다."}]}},{"id":"ART-ORG-COMPACT","record":"ORG-COMPACT","name":"맹약원","category":"Organization","tags":["Organization","맹약원"],"references":["ORG-COMPACT","EVT-COMPACT","NPC-LEA"],"body":"\n# 맹약원\n\n조약 가입 공동체 사이의 구조·통행·분쟁 조정을 맡는 사무기구.\n\n## 권한과 재정\n\n군대나 전 대륙 징세권은 없다. 조사관은 초청 또는 조약상 사고 조사 범위에서만 출입한다. 결정의 집행은 가입 공동체의 법과 보증금에 의존한다.\n\n## 현재의 갈등\n\n실무관 레아는 서류를 지키면서도 제방 보수금을 당겨 쓸 방법을 찾는다. 미가입 사막 촌락의 피해를 누가 보상할지가 현재의 쟁점이다.\n\n## 생활과 후속 이야기\n\n각 가입 공동체는 대표를 보내되 구조 현장 인력까지 대표 회의가 세부 지휘하지 않는다. 기금 회계와 조사 보고서는 공개하고 생존자의 개인정보는 제한한다. 현지 권력이 조사를 거부하면 즉시 군대를 보내는 대신 조약 보증금과 통행 협정을 재협상한다. 이 느린 절차 자체가 피해자에게 또 다른 부담이 되기도 한다.\n\n## 관련 문서\n\n- [일곱 맹약의 체결](EVT-COMPACT.md)\n- [레아 펜](NPC-LEA.md)\n","data":{"id":"ORG-COMPACT","kind":"Organization","name":"맹약원","summary":"조약 가입 공동체 사이의 구조·통행·분쟁 조정을 맡는 사무기구.","references":["EVT-COMPACT","NPC-LEA"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"군대나 전 대륙 징세권은 없다. 조사관은 초청 또는 조약상 사고 조사 범위에서만 출입한다. 결정의 집행은 가입 공동체의 법과 보증금에 의존한다."},{"heading":"현재의 갈등","text":"실무관 레아는 서류를 지키면서도 제방 보수금을 당겨 쓸 방법을 찾는다. 미가입 사막 촌락의 피해를 누가 보상할지가 현재의 쟁점이다."},{"heading":"생활과 후속 이야기","text":"각 가입 공동체는 대표를 보내되 구조 현장 인력까지 대표 회의가 세부 지휘하지 않는다. 기금 회계와 조사 보고서는 공개하고 생존자의 개인정보는 제한한다. 현지 권력이 조사를 거부하면 즉시 군대를 보내는 대신 조약 보증금과 통행 협정을 재협상한다. 이 느린 절차 자체가 피해자에게 또 다른 부담이 되기도 한다."}]}},{"id":"ART-ORG-FERRY","record":"ORG-FERRY","name":"갈대 노 연맹","category":"Organization","tags":["Organization","갈대 노 연맹"],"references":["ORG-FERRY","LOC-VELSU","NPC-TOMA"],"body":"\n# 갈대 노 연맹\n\n벨수 수계의 뱃사공과 제방 노동자 조합.\n\n## 권한과 재정\n\n홍수 때 구조 배정을 맡으며 평시 운임 상한을 협상한다. 강 전체의 소유권은 없고 가입하지 않은 배도 조난자를 구할 의무가 있다.\n\n## 현재의 갈등\n\n토마의 무상 수송은 동료들의 생계를 압박한다. 연맹은 구조 기금을 만들되 도시가 비용을 분담하길 원한다.\n\n## 생활과 후속 이야기\n\n연맹은 배 소유주뿐 아니라 노 젓는 노동자와 제방 보수공도 회원으로 받는다. 투표권을 선박 수에 비례시키자는 부유한 선주의 제안은 아직 채택되지 않았다. 공동 창고에는 밧줄과 방수천을 비축한다. 훈련은 가호가 없는 회원도 수행할 수 있도록 설계하여 수호자의 응답 여부에 생존을 맡기지 않는다.\n\n## 관련 문서\n\n- [벨수 수계](LOC-VELSU.md)\n- [토마 리드](NPC-TOMA.md)\n","data":{"id":"ORG-FERRY","kind":"Organization","name":"갈대 노 연맹","summary":"벨수 수계의 뱃사공과 제방 노동자 조합.","references":["LOC-VELSU","NPC-TOMA"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"홍수 때 구조 배정을 맡으며 평시 운임 상한을 협상한다. 강 전체의 소유권은 없고 가입하지 않은 배도 조난자를 구할 의무가 있다."},{"heading":"현재의 갈등","text":"토마의 무상 수송은 동료들의 생계를 압박한다. 연맹은 구조 기금을 만들되 도시가 비용을 분담하길 원한다."},{"heading":"생활과 후속 이야기","text":"연맹은 배 소유주뿐 아니라 노 젓는 노동자와 제방 보수공도 회원으로 받는다. 투표권을 선박 수에 비례시키자는 부유한 선주의 제안은 아직 채택되지 않았다. 공동 창고에는 밧줄과 방수천을 비축한다. 훈련은 가호가 없는 회원도 수행할 수 있도록 설계하여 수호자의 응답 여부에 생존을 맡기지 않는다."}]}},{"id":"ART-ORG-GLASS","record":"ORG-GLASS","name":"유리학회","category":"Organization","tags":["Organization","유리학회"],"references":["ORG-GLASS","HERO-ERDAN","SYS-MAGIC"],"body":"\n# 유리학회\n\n술식 교육·실험 안전·장인 보증을 담당하는 도시 연합 학회.\n\n## 권한과 재정\n\n면허 취소와 실험실 폐쇄를 권고할 수 있으나 재판이나 체포는 시 당국의 일이다. 교육비는 공방 회비와 도시 장학금으로 충당한다.\n\n## 현재의 갈등\n\n에르단은 무료 도식 보급을 주장하고 원로들은 무면허 사고 비용을 우려한다. 둘 중 어느 쪽도 자동으로 악인으로 규정하지 않는다.\n\n## 생활과 후속 이야기\n\n도식은 보관 원본과 현장용 사본을 구분하고 사고 뒤 어떤 판본을 사용했는지 조사한다. 불완전한 무료 교재가 위험할 수 있다는 걱정은 타당하지만 교재를 감추는 것이 유일한 해법은 아니다. 장학금과 공동 실험실을 늘리는 대안이 논의된다. 학회 안에는 현장 장인, 이론 연구자, 보험 담당자의 이해가 서로 다르다.\n\n## 관련 문서\n\n- [에르단 솔](HERO-ERDAN.md)\n- [術式魔法 — 술식마법](SYS-MAGIC.md)\n","data":{"id":"ORG-GLASS","kind":"Organization","name":"유리학회","summary":"술식 교육·실험 안전·장인 보증을 담당하는 도시 연합 학회.","references":["HERO-ERDAN","SYS-MAGIC"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"면허 취소와 실험실 폐쇄를 권고할 수 있으나 재판이나 체포는 시 당국의 일이다. 교육비는 공방 회비와 도시 장학금으로 충당한다."},{"heading":"현재의 갈등","text":"에르단은 무료 도식 보급을 주장하고 원로들은 무면허 사고 비용을 우려한다. 둘 중 어느 쪽도 자동으로 악인으로 규정하지 않는다."},{"heading":"생활과 후속 이야기","text":"도식은 보관 원본과 현장용 사본을 구분하고 사고 뒤 어떤 판본을 사용했는지 조사한다. 불완전한 무료 교재가 위험할 수 있다는 걱정은 타당하지만 교재를 감추는 것이 유일한 해법은 아니다. 장학금과 공동 실험실을 늘리는 대안이 논의된다. 학회 안에는 현장 장인, 이론 연구자, 보험 담당자의 이해가 서로 다르다."}]}},{"id":"ART-ORG-HUSH","record":"ORG-HUSH","name":"침묵의 정원","category":"Organization","tags":["Organization","침묵의 정원"],"references":["ORG-HUSH","BEA-HART","SPI-ASH"],"body":"\n# 침묵의 정원\n\n무음림 계약을 중개하는 약초사·기록자·벌목민의 공동체.\n\n## 권한과 재정\n\n정령을 숭배하지만 모든 요구를 따르지는 않는다. 계약은 사람과 정령 모두의 의무를 적고, 경작지 침범 문제도 협상한다.\n\n## 현재의 갈등\n\n아샤가 보관한 경계 기록과 마을 기억이 다르다. 벌목 갈등은 기억의 위변조보다 옛 지형 변화가 원인일 가능성도 있다.\n\n## 생활과 후속 이야기\n\n회의는 정령과 사람의 발언을 각각 기록하며 오래 사는 존재의 기억을 자동으로 더 높은 증거로 삼지 않는다. 벌목민이 계약을 지켜도 태풍으로 나무가 쓰러질 수 있으므로 피해와 위반을 구별한다. 숲에 들어오는 외부인을 위한 안내소는 벌금 징수보다 안전 교육을 우선한다. 협상에 실패하면 채취량을 임시로 낮추고 다시 측량한다.\n\n## 관련 문서\n\n- [은각 사슴 아우렌](BEA-HART.md)\n- [아샤 — 재의 정령](SPI-ASH.md)\n","data":{"id":"ORG-HUSH","kind":"Organization","name":"침묵의 정원","summary":"무음림 계약을 중개하는 약초사·기록자·벌목민의 공동체.","references":["BEA-HART","SPI-ASH"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"정령을 숭배하지만 모든 요구를 따르지는 않는다. 계약은 사람과 정령 모두의 의무를 적고, 경작지 침범 문제도 협상한다."},{"heading":"현재의 갈등","text":"아샤가 보관한 경계 기록과 마을 기억이 다르다. 벌목 갈등은 기억의 위변조보다 옛 지형 변화가 원인일 가능성도 있다."},{"heading":"생활과 후속 이야기","text":"회의는 정령과 사람의 발언을 각각 기록하며 오래 사는 존재의 기억을 자동으로 더 높은 증거로 삼지 않는다. 벌목민이 계약을 지켜도 태풍으로 나무가 쓰러질 수 있으므로 피해와 위반을 구별한다. 숲에 들어오는 외부인을 위한 안내소는 벌금 징수보다 안전 교육을 우선한다. 협상에 실패하면 채취량을 임시로 낮추고 다시 측량한다."}]}},{"id":"ART-ORG-KARD-VENT","record":"ORG-KARD-VENT","name":"카르드 환기갱 모임","category":"Organization","tags":["Organization","카르드 환기갱 모임"],"references":["ORG-KARD-VENT","LOC-KARD","NPC-BREN","HERO-ORVAN","NPC-HARIN"],"body":"\n# 카르드 환기갱 모임\n\n카르드 광산의 환기 상태를 살피고 수선을 요구하는 현장 모임.\n\n## 역할과 권한\n\n환기갱 모임은 점검원과 광부가 바람과 온도 기록을 모으고 위험 구간의 작업 중단과 수선을 광산 운영자에게 권고하는 모임이다. 구성원은 위험한 작업을 거절할 수 있지만 모임 자체에는 광산 전체를 폐쇄하거나 동상 예산을 전용할 권한이 없다. 브렌은 관리인으로 현장 경험을 나누고 하린은 점검과 기록을 돕는다.\n\n## 재정과 한계\n\n점검 노동의 품삯은 광산 운영자가 지급하며 모임이 걷는 소액 회비는 종이와 공동 점검 도구에 쓴다. 회비만으로 큰 수선이나 후임 교육비를 감당할 수 없어 운영자에게 별도 예산을 요구한다. 겨울 통행세의 구조대 배정분은 이 모임의 재원이 아니다.\n\n## 의견과 현재 과제\n\n브렌의 동상 건립비 전용 청원에 공감하는 구성원들은 환기 수선을 우선하자고 한다. 다른 구성원들은 수선 기간 품삯을 보장받을 방안부터 협상하자고 주장한다. 모임은 오르반의 공개 지지가 청원에 도움이 될 수 있다고 보면서도 그를 광부의 대표로 삼지는 않는다. 점검 결과와 중단 기간의 생계 대책을 함께 제시하는 일이 남아 있다.\n\n## 관련 문서\n\n- [LOC-KARD](LOC-KARD.md)\n- [NPC-BREN](NPC-BREN.md)\n- [HERO-ORVAN](HERO-ORVAN.md)\n- [NPC-HARIN](NPC-HARIN.md)\n","data":{"schema_version":1,"id":"ORG-KARD-VENT","kind":"Organization","name":"카르드 환기갱 모임","summary":"카르드 광산의 환기 상태를 살피고 수선을 요구하는 현장 모임.","references":["LOC-KARD","NPC-BREN","HERO-ORVAN","NPC-HARIN"],"details":[{"heading":"역할과 권한","text":"환기갱 모임은 점검원과 광부가 바람과 온도 기록을 모으고 위험 구간의 작업 중단과 수선을 광산 운영자에게 권고하는 모임이다. 구성원은 위험한 작업을 거절할 수 있지만 모임 자체에는 광산 전체를 폐쇄하거나 동상 예산을 전용할 권한이 없다. 브렌은 관리인으로 현장 경험을 나누고 하린은 점검과 기록을 돕는다."},{"heading":"재정과 한계","text":"점검 노동의 품삯은 광산 운영자가 지급하며 모임이 걷는 소액 회비는 종이와 공동 점검 도구에 쓴다. 회비만으로 큰 수선이나 후임 교육비를 감당할 수 없어 운영자에게 별도 예산을 요구한다. 겨울 통행세의 구조대 배정분은 이 모임의 재원이 아니다."},{"heading":"의견과 현재 과제","text":"브렌의 동상 건립비 전용 청원에 공감하는 구성원들은 환기 수선을 우선하자고 한다. 다른 구성원들은 수선 기간 품삯을 보장받을 방안부터 협상하자고 주장한다. 모임은 오르반의 공개 지지가 청원에 도움이 될 수 있다고 보면서도 그를 광부의 대표로 삼지는 않는다. 점검 결과와 중단 기간의 생계 대책을 함께 제시하는 일이 남아 있다."}]}},{"id":"ART-ORG-LANTERN","record":"ORG-LANTERN","name":"등대 협약회","category":"Organization","tags":["Organization","등대 협약회"],"references":["ORG-LANTERN","ITM-LANTERN","NPC-MARE"],"body":"\n# 등대 협약회\n\n군도 항구가 함께 운영하는 구조·보험 조직.\n\n## 권한과 재정\n\n등대 신호와 조난 구조 기록을 공유한다. 전쟁 당사자라도 구조 의무는 유지되며 밀수 단속을 이유로 조난자를 바다에 남길 수 없다.\n\n## 현재의 갈등\n\n해군은 구명 등불을 전쟁에 쓰려 하지만 구조선장 마레는 조약에 따른 보관 의무를 들어 거부한다.\n\n## 생활과 후속 이야기\n\n공동 보험료는 항구의 선박 통행량과 구조 위험을 함께 반영한다. 작은 항구도 조난 신호를 받을 수 있도록 최소 등대 유지비를 먼저 배정한다. 구조한 배의 화물 소유권을 구조선이 자동으로 얻지는 않는다. 구조 보수와 약탈의 경계를 문서화하는 일은 바다에서 마법 장비만큼 중요한 안전 수단이다.\n\n## 관련 문서\n\n- [구명 등불](ITM-LANTERN.md)\n- [마레 에스](NPC-MARE.md)\n","data":{"id":"ORG-LANTERN","kind":"Organization","name":"등대 협약회","summary":"군도 항구가 함께 운영하는 구조·보험 조직.","references":["ITM-LANTERN","NPC-MARE"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"등대 신호와 조난 구조 기록을 공유한다. 전쟁 당사자라도 구조 의무는 유지되며 밀수 단속을 이유로 조난자를 바다에 남길 수 없다."},{"heading":"현재의 갈등","text":"해군은 구명 등불을 전쟁에 쓰려 하지만 구조선장 마레는 조약에 따른 보관 의무를 들어 거부한다."},{"heading":"생활과 후속 이야기","text":"공동 보험료는 항구의 선박 통행량과 구조 위험을 함께 반영한다. 작은 항구도 조난 신호를 받을 수 있도록 최소 등대 유지비를 먼저 배정한다. 구조한 배의 화물 소유권을 구조선이 자동으로 얻지는 않는다. 구조 보수와 약탈의 경계를 문서화하는 일은 바다에서 마법 장비만큼 중요한 안전 수단이다."}]}},{"id":"ART-ORG-RED","record":"ORG-RED","name":"붉은 측량단","category":"Organization","tags":["Organization","붉은 측량단"],"references":["ORG-RED","NPC-SURI","NPC-VARKA"],"body":"\n# 붉은 측량단\n\n사헬 잔해 지대의 측량사와 유물 회수업자들.\n\n## 권한과 재정\n\n모든 단원이 범죄자는 아니다. 등록 지도와 위험 고지에 보수를 받지만 일부 지부는 발견품의 출처를 숨긴다. 지도 위조는 내부 징계와 지역 재판 대상이다.\n\n## 현재의 갈등\n\n단장 바르카는 물 공급을 조건으로 채굴 독점권을 사들인다. 무력 정복보다 채무 계약으로 지역을 장악하려 하므로 계약과 생존의 충돌이 중심이다.\n\n## 생활과 후속 이야기\n\n지부별 계약은 중앙 장부에 등록하지만 현장의 위험 보고가 늦어지는 경우가 있다. 지도 제작자는 판매량에 따라 보수를 받기 때문에 안전한 길만 그리는 것보다 위험한 유적을 과장할 유인이 생긴다. 이를 줄이려는 내부 조사원도 존재한다. 단체의 악행이 드러나더라도 모든 측량 기술과 구성원을 버리는 결말만 가능한 것은 아니다.\n\n## 관련 문서\n\n- [수리 안](NPC-SURI.md)\n- [바르카 렌](NPC-VARKA.md)\n","data":{"id":"ORG-RED","kind":"Organization","name":"붉은 측량단","summary":"사헬 잔해 지대의 측량사와 유물 회수업자들.","references":["NPC-SURI","NPC-VARKA"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"모든 단원이 범죄자는 아니다. 등록 지도와 위험 고지에 보수를 받지만 일부 지부는 발견품의 출처를 숨긴다. 지도 위조는 내부 징계와 지역 재판 대상이다."},{"heading":"현재의 갈등","text":"단장 바르카는 물 공급을 조건으로 채굴 독점권을 사들인다. 무력 정복보다 채무 계약으로 지역을 장악하려 하므로 계약과 생존의 충돌이 중심이다."},{"heading":"생활과 후속 이야기","text":"지부별 계약은 중앙 장부에 등록하지만 현장의 위험 보고가 늦어지는 경우가 있다. 지도 제작자는 판매량에 따라 보수를 받기 때문에 안전한 길만 그리는 것보다 위험한 유적을 과장할 유인이 생긴다. 이를 줄이려는 내부 조사원도 존재한다. 단체의 악행이 드러나더라도 모든 측량 기술과 구성원을 버리는 결말만 가능한 것은 아니다."}]}},{"id":"ART-ORG-TRADE-TABLE","record":"ORG-TRADE-TABLE","name":"세 지역 운반 협의 자리","category":"Organization","tags":["Organization","세 지역 운반 협의 자리"],"references":["ORG-TRADE-TABLE","EVT-TRADE-PARTIAL","ORG-FERRY","ORG-KARD-VENT","ORG-HUSH"],"body":"\n# 세 지역 운반 협의 자리\n\n한 차례의 운반과 다음 교환을 조율하는 참여자들의 임시 협의.\n\n## 범위와 권한\n\n벨수 운반자와 카르드 출하 담당자, 무음림 약초 교환 참여자들이 다음 물량과 운반일을 맞추기 위해 임시로 모인다. 참여자는 자신이 맡을 물품과 노동만 약속할 수 있다. 이 자리는 광산을 열거나 숲의 경계를 확정하고 도시 세금을 부과할 권한이 없다.\n\n## 비용과 이견\n\n모이는 비용은 참석자들이 각자 부담하며 공동 자금이나 강제 회비는 없다. 빨리 운반해 손실을 줄이자는 쪽과 안전 점검 및 채취 동의가 확인될 때까지 물량을 줄이자는 쪽의 의견이 다르다. 불참한 노동자의 품삯까지 이 자리가 일방적으로 결정하지 않는다.\n\n## 관련 문서\n\n- [EVT-TRADE-PARTIAL](EVT-TRADE-PARTIAL.md)\n- [ORG-FERRY](ORG-FERRY.md)\n- [ORG-KARD-VENT](ORG-KARD-VENT.md)\n- [ORG-HUSH](ORG-HUSH.md)\n","data":{"schema_version":1,"id":"ORG-TRADE-TABLE","kind":"Organization","name":"세 지역 운반 협의 자리","summary":"한 차례의 운반과 다음 교환을 조율하는 참여자들의 임시 협의.","references":["EVT-TRADE-PARTIAL","ORG-FERRY","ORG-KARD-VENT","ORG-HUSH"],"details":[{"heading":"범위와 권한","text":"벨수 운반자와 카르드 출하 담당자, 무음림 약초 교환 참여자들이 다음 물량과 운반일을 맞추기 위해 임시로 모인다. 참여자는 자신이 맡을 물품과 노동만 약속할 수 있다. 이 자리는 광산을 열거나 숲의 경계를 확정하고 도시 세금을 부과할 권한이 없다."},{"heading":"비용과 이견","text":"모이는 비용은 참석자들이 각자 부담하며 공동 자금이나 강제 회비는 없다. 빨리 운반해 손실을 줄이자는 쪽과 안전 점검 및 채취 동의가 확인될 때까지 물량을 줄이자는 쪽의 의견이 다르다. 불참한 노동자의 품삯까지 이 자리가 일방적으로 결정하지 않는다."}]}},{"id":"ART-ORG-UNBOUND","record":"ORG-UNBOUND","name":"무관의 새벽","category":"Organization","tags":["Organization","무관의 새벽"],"references":["ORG-UNBOUND","HERO-IRA","SYS-AUTHORITY"],"body":"\n# 무관의 새벽\n\n권능 집행자의 세습적 명성을 비판하는 느슨한 정치 운동.\n\n## 권한과 재정\n\n권능 좌는 실제로 세습되지 않지만 유명 가문의 교육 독점 때문에 시험 접근이 불평등하다고 주장한다. 공개 토론파와 폭력파는 같은 명령 체계를 공유하지 않는다.\n\n## 현재의 갈등\n\n이라의 증언 권능을 강제로 이용해 지도자의 부패를 밝히자는 급진파와 자발적 증언 원칙을 지키려는 시민들이 갈린다.\n\n## 생활과 후속 이야기\n\n공개 토론파는 시험 교육비와 후원 내역의 공개를 요구한다. 급진파 일부는 집행자가 응답하지 않으면 공공 시설을 점거하자고 주장한다. 두 집단의 행동 책임을 뭉뚱그리지 않는다. 권능 없는 시민이 재해 구조와 정치에 참여하는 통로를 넓히려는 목표는 집행자 개인을 처벌하는 것과 구별된다.\n\n## 관련 문서\n\n- [이라 덴](HERO-IRA.md)\n- [권능과 일곱 좌](SYS-AUTHORITY.md)\n","data":{"id":"ORG-UNBOUND","kind":"Organization","name":"무관의 새벽","summary":"권능 집행자의 세습적 명성을 비판하는 느슨한 정치 운동.","references":["HERO-IRA","SYS-AUTHORITY"],"schema_version":1,"details":[{"heading":"권한과 재정","text":"권능 좌는 실제로 세습되지 않지만 유명 가문의 교육 독점 때문에 시험 접근이 불평등하다고 주장한다. 공개 토론파와 폭력파는 같은 명령 체계를 공유하지 않는다."},{"heading":"현재의 갈등","text":"이라의 증언 권능을 강제로 이용해 지도자의 부패를 밝히자는 급진파와 자발적 증언 원칙을 지키려는 시민들이 갈린다."},{"heading":"생활과 후속 이야기","text":"공개 토론파는 시험 교육비와 후원 내역의 공개를 요구한다. 급진파 일부는 집행자가 응답하지 않으면 공공 시설을 점거하자고 주장한다. 두 집단의 행동 책임을 뭉뚱그리지 않는다. 권능 없는 시민이 재해 구조와 정치에 참여하는 통로를 넓히려는 목표는 집행자 개인을 처벌하는 것과 구별된다."}]}},{"id":"ART-POW-THRESHOLD","record":"POW-THRESHOLD","name":"문턱 — 연결의 권능","category":"Power","tags":["Power","문턱"],"references":["POW-THRESHOLD","HERO-SERIN","SYS-AUTHORITY"],"body":"\n# 문턱 — 연결의 권능\n\n세린이 이미 확인한 두 경계를 잠시 잇는다.\n\n## 발동\n\n세린이 직접 방문해 양쪽 경계석을 손으로 만진 장소만 연결할 수 있다. 두 경계는 같은 대륙 위 30킬로미터 이내여야 하고, 폭은 두 사람이 나란히 통과할 정도다. 문은 한 번에 90초 열리며 하루 세 번까지다.\n\n## 대가와 실패\n\n한 번 사용할 때 세린은 이후 한 시간 동안 공간 방향 감각을 잃고 동료의 안내를 받아야 한다. 어느 한 경계석이 부서지면 문은 안전하게 닫히며 통과 중인 사람은 출발지로 밀려난다. 모르는 감옥이나 바다 건너에 문을 열 수 없다.\n\n## 관련 문서\n\n- [세린 바엘](HERO-SERIN.md)\n- [권능과 일곱 좌](SYS-AUTHORITY.md)\n","data":{"id":"POW-THRESHOLD","kind":"Power","name":"문턱 — 연결의 권능","summary":"세린이 이미 확인한 두 경계를 잠시 잇는다.","references":["HERO-SERIN","SYS-AUTHORITY"],"holder":"HERO-SERIN","seat":"threshold","start":305,"end":null,"schema_version":1,"details":[{"heading":"발동","text":"세린이 직접 방문해 양쪽 경계석을 손으로 만진 장소만 연결할 수 있다. 두 경계는 같은 대륙 위 30킬로미터 이내여야 하고, 폭은 두 사람이 나란히 통과할 정도다. 문은 한 번에 90초 열리며 하루 세 번까지다."},{"heading":"대가와 실패","text":"한 번 사용할 때 세린은 이후 한 시간 동안 공간 방향 감각을 잃고 동료의 안내를 받아야 한다. 어느 한 경계석이 부서지면 문은 안전하게 닫히며 통과 중인 사람은 출발지로 밀려난다. 모르는 감옥이나 바다 건너에 문을 열 수 없다."}]}},{"id":"ART-POW-WITNESS","record":"POW-WITNESS","name":"증언 — 기억 봉인의 권능","category":"Power","tags":["Power","증언"],"references":["POW-WITNESS","HERO-IRA","SYS-AUTHORITY","SYS-DEATH"],"body":"\n# 증언 — 기억 봉인의 권능\n\n이라가 동의한 증언자의 기억 조각을 봉인하고 변경을 탐지한다.\n\n## 발동\n\n깨어 있는 증언자가 장면 하나를 자발적으로 떠
