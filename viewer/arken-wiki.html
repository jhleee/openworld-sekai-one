올리고 봉인에 동의해야 한다. 봉인은 그 사람이 기억하는 내용만 담으며 착각이나 편견을 바로잡지 않는다. 이라는 하루에 세 조각까지 봉인한다.\n\n## 대가와 실패\n\n한 조각을 봉인할 때마다 이라는 그날의 자신의 기억 한 시간을 다음 일출까지 떠올리지 못한다. 잔향과 시체는 동의할 수 없으며 고문으로 얻은 동의는 효력이 없다. 봉인을 깨면 위변조 흔적을 확인할 수 있지만 지워진 원래 내용을 복원하지는 못한다.\n\n## 관련 문서\n\n- [이라 덴](HERO-IRA.md)\n- [권능과 일곱 좌](SYS-AUTHORITY.md)\n- [죽음과 잔향](SYS-DEATH.md)\n","data":{"id":"POW-WITNESS","kind":"Power","name":"증언 — 기억 봉인의 권능","summary":"이라가 동의한 증언자의 기억 조각을 봉인하고 변경을 탐지한다.","references":["HERO-IRA","SYS-AUTHORITY","SYS-DEATH"],"holder":"HERO-IRA","seat":"witness","start":302,"end":null,"schema_version":1,"details":[{"heading":"발동","text":"깨어 있는 증언자가 장면 하나를 자발적으로 떠올리고 봉인에 동의해야 한다. 봉인은 그 사람이 기억하는 내용만 담으며 착각이나 편견을 바로잡지 않는다. 이라는 하루에 세 조각까지 봉인한다."},{"heading":"대가와 실패","text":"한 조각을 봉인할 때마다 이라는 그날의 자신의 기억 한 시간을 다음 일출까지 떠올리지 못한다. 잔향과 시체는 동의할 수 없으며 고문으로 얻은 동의는 효력이 없다. 봉인을 깨면 위변조 흔적을 확인할 수 있지만 지워진 원래 내용을 복원하지는 못한다."}]}},{"id":"ART-SPI-ASH","record":"SPI-ASH","name":"아샤 — 재의 정령","category":"Spirit","tags":["Spirit","아샤"],"references":["SPI-ASH","LOC-HUSH","NPC-MIRA","SYS-BLESSING"],"body":"\n# 아샤 — 재의 정령\n\n무음림의 오래된 산불터에서 태어나 새싹의 계절을 기억한다.\n\n## 생태와 능력\n\n불을 무한히 일으키지 못하지만 남은 열을 작은 범위에서 옮길 수 있다. 계약한 약초사는 식물의 열 손상을 감지하며 그 대가로 매년 묘목 세 그루를 가꾼다.\n\n## 관계와 대응\n\n아샤가 기억하는 경계는 산불 이전 지형이다. 인간의 새 도면과 다른 이유가 반드시 거짓말은 아니다. 기억을 업데이트하기 위해 미라에게 측량을 요청하려 한다.\n\n## 관련 문서\n\n- [무음림](LOC-HUSH.md)\n- [미라 덴](NPC-MIRA.md)\n- [가호와 호명 계약](SYS-BLESSING.md)\n","data":{"id":"SPI-ASH","kind":"Spirit","name":"아샤 — 재의 정령","summary":"무음림의 오래된 산불터에서 태어나 새싹의 계절을 기억한다.","references":["LOC-HUSH","NPC-MIRA","SYS-BLESSING"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"불을 무한히 일으키지 못하지만 남은 열을 작은 범위에서 옮길 수 있다. 계약한 약초사는 식물의 열 손상을 감지하며 그 대가로 매년 묘목 세 그루를 가꾼다."},{"heading":"관계와 대응","text":"아샤가 기억하는 경계는 산불 이전 지형이다. 인간의 새 도면과 다른 이유가 반드시 거짓말은 아니다. 기억을 업데이트하기 위해 미라에게 측량을 요청하려 한다."}]}},{"id":"ART-SPI-NEM","record":"SPI-NEM","name":"네므 — 여울의 정령","category":"Spirit","tags":["Spirit","네므"],"references":["SPI-NEM","LOC-VELSU","NPC-TOMA","SYS-BLESSING"],"body":"\n# 네므 — 여울의 정령\n\n벨수의 여러 여울에 걸쳐 기억을 이어가는 물의 정령.\n\n## 생태와 능력\n\n계약한 구조자는 흐르는 민물 속에서 최대 아홉 번의 호흡을 더 버틴다. 물을 마시거나 상처를 치료하는 효과는 없다. 수혜자는 구조 철마다 산란 여울의 폐기물을 걷어낸다.\n\n## 관계와 대응\n\n네므는 강 전체를 소유하지 않는다. 가뭄 때 가호를 줄 수 있는 수를 줄이고 마을에 그 이유를 알린다. 수문을 부수어 강을 되찾자는 제안에는 하류 피해 때문에 동의하지 않는다.\n\n## 관련 문서\n\n- [벨수 수계](LOC-VELSU.md)\n- [토마 리드](NPC-TOMA.md)\n- [가호와 호명 계약](SYS-BLESSING.md)\n","data":{"id":"SPI-NEM","kind":"Spirit","name":"네므 — 여울의 정령","summary":"벨수의 여러 여울에 걸쳐 기억을 이어가는 물의 정령.","references":["LOC-VELSU","NPC-TOMA","SYS-BLESSING"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"계약한 구조자는 흐르는 민물 속에서 최대 아홉 번의 호흡을 더 버틴다. 물을 마시거나 상처를 치료하는 효과는 없다. 수혜자는 구조 철마다 산란 여울의 폐기물을 걷어낸다."},{"heading":"관계와 대응","text":"네므는 강 전체를 소유하지 않는다. 가뭄 때 가호를 줄 수 있는 수를 줄이고 마을에 그 이유를 알린다. 수문을 부수어 강을 되찾자는 제안에는 하류 피해 때문에 동의하지 않는다."}]}},{"id":"ART-SPI-SIA","record":"SPI-SIA","name":"시아 — 돛 사이의 바람","category":"Spirit","tags":["Spirit","시아"],"references":["SPI-SIA","LOC-ESTEL","NPC-MARE","SYS-BLESSING"],"body":"\n# 시아 — 돛 사이의 바람\n\n에스텔 군도의 바람길을 따라 이동하는 정령.\n\n## 생태와 능력\n\n계약한 배의 돛에 한 시간 순풍을 보태지만 무풍을 영원히 없애지는 못한다. 계약 때 선원들은 항로의 쓰레기를 회수하고 구조 요청에 응한다. 항해마다 계약을 다시 맺는다.\n\n## 관계와 대응\n\n군함도 구조 의무를 지키면 계약할 수 있다. 정령은 인간의 국적보다 약속을 본다. 마레는 시아를 명령받는 선원으로 취급하지 않는다.\n\n## 관련 문서\n\n- [에스텔 군도](LOC-ESTEL.md)\n- [마레 에스](NPC-MARE.md)\n- [가호와 호명 계약](SYS-BLESSING.md)\n","data":{"id":"SPI-SIA","kind":"Spirit","name":"시아 — 돛 사이의 바람","summary":"에스텔 군도의 바람길을 따라 이동하는 정령.","references":["LOC-ESTEL","NPC-MARE","SYS-BLESSING"],"schema_version":1,"details":[{"heading":"생태와 능력","text":"계약한 배의 돛에 한 시간 순풍을 보태지만 무풍을 영원히 없애지는 못한다. 계약 때 선원들은 항로의 쓰레기를 회수하고 구조 요청에 응한다. 항해마다 계약을 다시 맺는다."},{"heading":"관계와 대응","text":"군함도 구조 의무를 지키면 계약할 수 있다. 정령은 인간의 국적보다 약속을 본다. 마레는 시아를 명령받는 선원으로 취급하지 않는다."}]}},{"id":"ART-SYS-AUTHORITY","record":"SYS-AUTHORITY","name":"권능과 일곱 좌","category":"Rule","tags":["Rule","권능과 일곱 좌"],"references":["SYS-AUTHORITY","POW-THRESHOLD","POW-WITNESS"],"body":"\n# 권능과 일곱 좌\n\n세계 법칙의 좁은 예외를 집행하는 일곱 자리.\n\n## 자리의 원칙\n\n문턱·증언·계절·무게·잠·귀환·이름의 좌가 존재한다. 각 좌의 현역 집행자는 같은 시점에 한 명이다. 집행자는 좌가 요구하는 공개 시험을 통과하고 이전 집행자의 사망 또는 자발적 반납 이후에만 취임한다. 다른 사람의 권능을 흡수하거나 두 좌를 동시에 차지할 수 없다.\n\n## 범위와 비용\n\n권능도 자신의 관할 밖의 규칙을 바꾸지 못한다. 문턱은 두 장소의 경계만 연결하며 목적지를 모르면 열 수 없다. 증언은 자발적으로 내놓은 기억의 위변조만 밝히고 객관적 진실이나 잊힌 사실을 알아내지 못한다. 각 사용의 대가와 제한은 해당 권능 기록에 명시한다.\n\n## 승계와 공석\n\n좌가 비어도 세계 법칙은 유지된다. 집행자는 법칙 자체가 아니며 암살로 자연 질서를 없앨 수 없다. 현재 문턱과 증언 외 다섯 좌의 집행자 상태는 설정 미정이다. 미정은 공석이라는 뜻이 아니다. 새로운 집행자를 정할 때는 승계 사건과 기존 설정 검사를 함께 제출한다.\n\n## 관련 문서\n\n- [문턱 — 연결의 권능](POW-THRESHOLD.md)\n- [증언 — 기억 봉인의 권능](POW-WITNESS.md)\n","data":{"id":"SYS-AUTHORITY","kind":"Rule","name":"권능과 일곱 좌","summary":"세계 법칙의 좁은 예외를 집행하는 일곱 자리.","references":["POW-THRESHOLD","POW-WITNESS"],"system":"authority","schema_version":1,"details":[{"heading":"자리의 원칙","text":"문턱·증언·계절·무게·잠·귀환·이름의 좌가 존재한다. 각 좌의 현역 집행자는 같은 시점에 한 명이다. 집행자는 좌가 요구하는 공개 시험을 통과하고 이전 집행자의 사망 또는 자발적 반납 이후에만 취임한다. 다른 사람의 권능을 흡수하거나 두 좌를 동시에 차지할 수 없다."},{"heading":"범위와 비용","text":"권능도 자신의 관할 밖의 규칙을 바꾸지 못한다. 문턱은 두 장소의 경계만 연결하며 목적지를 모르면 열 수 없다. 증언은 자발적으로 내놓은 기억의 위변조만 밝히고 객관적 진실이나 잊힌 사실을 알아내지 못한다. 각 사용의 대가와 제한은 해당 권능 기록에 명시한다."},{"heading":"승계와 공석","text":"좌가 비어도 세계 법칙은 유지된다. 집행자는 법칙 자체가 아니며 암살로 자연 질서를 없앨 수 없다. 현재 문턱과 증언 외 다섯 좌의 집행자 상태는 설정 미정이다. 미정은 공석이라는 뜻이 아니다. 새로운 집행자를 정할 때는 승계 사건과 기존 설정 검사를 함께 제출한다."}]}},{"id":"ART-SYS-BLESSING","record":"SYS-BLESSING","name":"가호와 호명 계약","category":"Rule","tags":["Rule","가호와 호명 계약"],"references":["SYS-BLESSING","BEA-HART","SPI-NEM"],"body":"\n# 가호와 호명 계약\n\n의지를 가진 수호자와 인간이 맺는 조건부 관계.\n\n## 성립\n\n수호자가 스스로 응답하고 수혜자가 의무를 이해한 뒤 이름을 교환해야 한다. 가호는 혈통만으로 자동 상속되지 않으며 상대의 의사를 빼앗아 맺을 수 없다. 한 사람은 두 가호까지 유지할 수 있으나 두 의무가 충돌하면 충돌한 효과가 모두 정지한다.\n\n## 대가와 철회\n\n수혜자는 계약에 명시한 돌봄이나 금기를 수행한다. 수호자는 자신의 영지를 떠나 힘을 줄 때 기억과 생기를 소모하므로 무제한 수혜자를 둘 수 없다. 철회는 장래의 효과를 끝내며 이미 치료한 상처를 다시 만들지 않는다. 계약 위반 여부가 불분명하면 효과는 정지되고 계약 당사자가 사실을 확인한다.\n\n## 대응\n\n가호는 수호자의 속성과 영향권을 벗어나면 약해진다. 강의 가호가 사막에서 무한한 물을 만들지는 않는다. 가호와 술식은 함께 쓸 수 있지만 각자의 비용을 따로 낸다. 계약을 해제해도 술식 교육으로 얻은 지식은 사라지지 않는다.\n\n## 관련 문서\n\n- [은각 사슴 아우렌](BEA-HART.md)\n- [네므 — 여울의 정령](SPI-NEM.md)\n","data":{"id":"SYS-BLESSING","kind":"Rule","name":"가호와 호명 계약","summary":"의지를 가진 수호자와 인간이 맺는 조건부 관계.","references":["BEA-HART","SPI-NEM"],"system":"blessing","schema_version":1,"details":[{"heading":"성립","text":"수호자가 스스로 응답하고 수혜자가 의무를 이해한 뒤 이름을 교환해야 한다. 가호는 혈통만으로 자동 상속되지 않으며 상대의 의사를 빼앗아 맺을 수 없다. 한 사람은 두 가호까지 유지할 수 있으나 두 의무가 충돌하면 충돌한 효과가 모두 정지한다."},{"heading":"대가와 철회","text":"수혜자는 계약에 명시한 돌봄이나 금기를 수행한다. 수호자는 자신의 영지를 떠나 힘을 줄 때 기억과 생기를 소모하므로 무제한 수혜자를 둘 수 없다. 철회는 장래의 효과를 끝내며 이미 치료한 상처를 다시 만들지 않는다. 계약 위반 여부가 불분명하면 효과는 정지되고 계약 당사자가 사실을 확인한다."},{"heading":"대응","text":"가호는 수호자의 속성과 영향권을 벗어나면 약해진다. 강의 가호가 사막에서 무한한 물을 만들지는 않는다. 가호와 술식은 함께 쓸 수 있지만 각자의 비용을 따로 낸다. 계약을 해제해도 술식 교육으로 얻은 지식은 사라지지 않는다."}]}},{"id":"ART-SYS-DEATH","record":"SYS-DEATH","name":"죽음과 잔향","category":"Rule","tags":["Rule","죽음과 잔향"],"references":["SYS-DEATH","NPC-ENA"],"body":"\n# 죽음과 잔향\n\n육체의 죽음 뒤 남은 정보는 원래 인격과 같지 않다.\n\n## 확정 경계\n\n심장과 호흡이 멎었어도 의식 연결이 남은 짧은 시간에는 응급 처치가 가능하다. 의식 연결이 끊어진 확정 사망 뒤 동일 인격을 되돌리는 마법·가호·권능은 없다. 연결의 유무는 훈련된 치유사 두 명이 서로 독립적으로 확인한다.\n\n## 잔향\n\n잔향은 강한 감정이 장소에 남긴 제한된 반응이다. 새 경험을 축적하거나 계약에 동의하지 못한다. 망자의 목소리처럼 들려도 법정 증언이나 가호 동의로 인정하지 않는다. 정령은 스스로 기억을 갱신하고 선택하므로 잔향과 구분된다.\n\n## 서사의 경계\n\n죽음을 지우는 유니크 아이템은 초기 세계에 존재하지 않는다. 죽음에서 돌아왔다는 소문은 주장으로 기록할 수 있지만, 해당 인물이 실제로 확정 사망했는지 분리해서 검토해야 한다.\n\n## 관련 문서\n\n- [에나 로](NPC-ENA.md)\n","data":{"id":"SYS-DEATH","kind":"Rule","name":"죽음과 잔향","summary":"육체의 죽음 뒤 남은 정보는 원래 인격과 같지 않다.","references":["NPC-ENA"],"schema_version":1,"details":[{"heading":"확정 경계","text":"심장과 호흡이 멎었어도 의식 연결이 남은 짧은 시간에는 응급 처치가 가능하다. 의식 연결이 끊어진 확정 사망 뒤 동일 인격을 되돌리는 마법·가호·권능은 없다. 연결의 유무는 훈련된 치유사 두 명이 서로 독립적으로 확인한다."},{"heading":"잔향","text":"잔향은 강한 감정이 장소에 남긴 제한된 반응이다. 새 경험을 축적하거나 계약에 동의하지 못한다. 망자의 목소리처럼 들려도 법정 증언이나 가호 동의로 인정하지 않는다. 정령은 스스로 기억을 갱신하고 선택하므로 잔향과 구분된다."},{"heading":"서사의 경계","text":"죽음을 지우는 유니크 아이템은 초기 세계에 존재하지 않는다. 죽음에서 돌아왔다는 소문은 주장으로 기록할 수 있지만, 해당 인물이 실제로 확정 사망했는지 분리해서 검토해야 한다."}]}},{"id":"ART-SYS-MAGIC","record":"SYS-MAGIC","name":"術式魔法 — 술식마법","category":"Rule","tags":["Rule","術式魔法"],"references":["SYS-MAGIC","LOC-LUMEN","ORG-GLASS"],"body":"\n# 術式魔法 — 술식마법\n\n주변의 에테르를 정해진 도식으로 변환하는 학습 가능한 기술.\n\n## 작동과 대가\n\n술식은 원료, 도식, 배출구를 요구한다. 불을 만드는 술자는 연료와 산소를 소모하고 열을 옮기는 술자는 냉각할 대상을 지정한다. 에테르는 변환을 매개할 뿐 물질과 에너지를 무한히 공급하지 않는다. 신체에 과도한 에테르가 통과하면 손떨림과 감각 손상이 남는다.\n\n## 한계와 대응\n\n접촉 또는 시야 안에 미리 설치한 표식이 있어야 대상을 지정할 수 있다. 표식을 끊거나 재료를 오염시키면 실패한다. 진공에서 불을 만들거나 시체에 의식을 되돌리는 술식은 성립하지 않는다. 기존 의식의 기억을 읽는 기술도 본인 협조 없이 정확한 진술을 보장하지 않는다.\n\n## 생활\n\n제분소의 수차 보조와 보냉 창고가 군용 화염술보다 널리 쓰인다. 술식공은 자격 시험과 지역 조합 보증을 받지만, 면허 없는 시골 장인도 원리를 익힐 수 있다. 면허는 지식의 독점권이 아니라 사고 배상의 책임 계약이다.\n\n## 관련 문서\n\n- [루멘 자유시](LOC-LUMEN.md)\n- [유리학회](ORG-GLASS.md)\n","data":{"id":"SYS-MAGIC","kind":"Rule","name":"術式魔法 — 술식마법","summary":"주변의 에테르를 정해진 도식으로 변환하는 학습 가능한 기술.","references":["LOC-LUMEN","ORG-GLASS"],"system":"magic","schema_version":1,"details":[{"heading":"작동과 대가","text":"술식은 원료, 도식, 배출구를 요구한다. 불을 만드는 술자는 연료와 산소를 소모하고 열을 옮기는 술자는 냉각할 대상을 지정한다. 에테르는 변환을 매개할 뿐 물질과 에너지를 무한히 공급하지 않는다. 신체에 과도한 에테르가 통과하면 손떨림과 감각 손상이 남는다."},{"heading":"한계와 대응","text":"접촉 또는 시야 안에 미리 설치한 표식이 있어야 대상을 지정할 수 있다. 표식을 끊거나 재료를 오염시키면 실패한다. 진공에서 불을 만들거나 시체에 의식을 되돌리는 술식은 성립하지 않는다. 기존 의식의 기억을 읽는 기술도 본인 협조 없이 정확한 진술을 보장하지 않는다."},{"heading":"생활","text":"제분소의 수차 보조와 보냉 창고가 군용 화염술보다 널리 쓰인다. 술식공은 자격 시험과 지역 조합 보증을 받지만, 면허 없는 시골 장인도 원리를 익힐 수 있다. 면허는 지식의 독점권이 아니라 사고 배상의 책임 계약이다."}]}},{"id":"ART-SYS-UNIQUE","record":"SYS-UNIQUE","name":"유일물과 소유·보관·사용","category":"Rule","tags":["Rule","유일물과 소유·보관·사용"],"references":["SYS-UNIQUE","ITM-LANTERN","ITM-NEEDLE"],"body":"\n# 유일물과 소유·보관·사용\n\n유니크 아이템은 고유한 역사와 재현 불가능한 핵을 가진 물건이다.\n\n## 유일성\n\n한 유일물의 본체는 동시에 하나다. 모형과 기능이 비슷한 일반 장비는 제작할 수 있으나 핵의 고유 기능까지 복제할 수 없다. 분해하면 기능이 멈추고 파편은 별개의 완제품으로 작동하지 않는다.\n\n## 권리\n\n소유자는 법적 권리를, 보관자는 실제 점유를, 사용자는 활성화 자격을 뜻한다. 셋은 다를 수 있다. 도난 사건은 보관자를 바꾸지만 자동으로 소유권이나 사용 자격을 넘기지 않는다.\n\n## 변경\n\n파괴와 이전은 사건으로 남긴다. 이름을 바꾸어 같은 아이템을 재생성하지 않는다. 새로운 유일물을 추가할 때는 기원·기능·대가·실패 조건·현재 보관자·사회적 이해관계를 모두 작성한다.\n\n## 관련 문서\n\n- [구명 등불](ITM-LANTERN.md)\n- [봉합의 바늘](ITM-NEEDLE.md)\n","data":{"id":"SYS-UNIQUE","kind":"Rule","name":"유일물과 소유·보관·사용","summary":"유니크 아이템은 고유한 역사와 재현 불가능한 핵을 가진 물건이다.","references":["ITM-LANTERN","ITM-NEEDLE"],"schema_version":1,"details":[{"heading":"유일성","text":"한 유일물의 본체는 동시에 하나다. 모형과 기능이 비슷한 일반 장비는 제작할 수 있으나 핵의 고유 기능까지 복제할 수 없다. 분해하면 기능이 멈추고 파편은 별개의 완제품으로 작동하지 않는다."},{"heading":"권리","text":"소유자는 법적 권리를, 보관자는 실제 점유를, 사용자는 활성화 자격을 뜻한다. 셋은 다를 수 있다. 도난 사건은 보관자를 바꾸지만 자동으로 소유권이나 사용 자격을 넘기지 않는다."},{"heading":"변경","text":"파괴와 이전은 사건으로 남긴다. 이름을 바꾸어 같은 아이템을 재생성하지 않는다. 새로운 유일물을 추가할 때는 기원·기능·대가·실패 조건·현재 보관자·사회적 이해관계를 모두 작성한다."}]}},{"id":"ART-THR-GATE","record":"THR-GATE","name":"영웅의 통행세","category":"Thread","tags":["Thread","영웅의 통행세"],"references":["THR-GATE","HERO-SERIN","NPC-LEA","POW-THRESHOLD"],"body":"\n# 영웅의 통행세\n\n세린에게 군용 문턱 사용을 요구하는 도시와 구조자의 갈등.\n\n## 현재\n\n도시는 제방 비용을 내는 대신 통로를 군 보급에 배정하길 원한다. 하루 세 번의 사용 한도 때문에 군용 배정은 실제 구조 여력을 줄인다.\n\n## 열린 결말\n\n권능의 새 무제한 사용법으로 갈등을 해결하지 않는다. 제방 투자·일반 운송·정치적 협상으로 선택지를 만든다.\n\n## 생활과 후속 이야기\n\n레아는 일반 운송선의 야간 운항을 늘리는 대안을 검토하고 토마는 노동시간과 사고 위험을 계산한다. 세린이 요청을 거절하면 도시가 나쁜 곳이라는 식으로 단순화하지 않는다. 시민도 군수 지연에 따른 안전 문제를 걱정할 수 있다. 장면마다 누가 어떤 정보를 알고 어떤 비용을 부담하는지 적으면 선택의 무게가 생긴다.\n\n## 관련 문서\n\n- [세린 바엘](HERO-SERIN.md)\n- [레아 펜](NPC-LEA.md)\n- [문턱 — 연결의 권능](POW-THRESHOLD.md)\n","data":{"id":"THR-GATE","kind":"Thread","name":"영웅의 통행세","summary":"세린에게 군용 문턱 사용을 요구하는 도시와 구조자의 갈등.","references":["HERO-SERIN","NPC-LEA","POW-THRESHOLD"],"status":"open","schema_version":1,"details":[{"heading":"현재","text":"도시는 제방 비용을 내는 대신 통로를 군 보급에 배정하길 원한다. 하루 세 번의 사용 한도 때문에 군용 배정은 실제 구조 여력을 줄인다."},{"heading":"열린 결말","text":"권능의 새 무제한 사용법으로 갈등을 해결하지 않는다. 제방 투자·일반 운송·정치적 협상으로 선택지를 만든다."},{"heading":"생활과 후속 이야기","text":"레아는 일반 운송선의 야간 운항을 늘리는 대안을 검토하고 토마는 노동시간과 사고 위험을 계산한다. 세린이 요청을 거절하면 도시가 나쁜 곳이라는 식으로 단순화하지 않는다. 시민도 군수 지연에 따른 안전 문제를 걱정할 수 있다. 장면마다 누가 어떤 정보를 알고 어떤 비용을 부담하는지 적으면 선택의 무게가 생긴다."}]}},{"id":"ART-THR-HUSH-BLESSING","record":"THR-HUSH-BLESSING","name":"솔이와 아샤의 가호 협상","category":"Thread","tags":["Thread","솔이와 아샤의 가호 협상"],"references":["THR-HUSH-BLESSING","NPC-SOLI","SPI-ASH","SYS-BLESSING","EVT-HUSH-SURVEY"],"body":"\n# 솔이와 아샤의 가호 협상\n\n약초 건조 일꾼과 재의 정령이 의무와 범위를 논의한다.\n\n## 협상 대상\n\n솔이는 식물의 열 손상을 살피는 가호에 관심을 보이고 아샤에게 조건을 묻는다. 아샤가 계약한 약초사에게 주는 감지와 매년 묘목 세 그루를 가꾸는 의무가 논의의 출발점이다. 이 대화만으로 아샤가 새 수혜자를 받아들였다고 볼 수 없다.\n\n## 남은 선택\n\n솔이는 돌봄에 필요한 물과 시간을 마련해야 하고 아샤는 새 계약에 쓸 생기와 기억을 고려한다. 양쪽은 각자 거절할 수 있으며 이름을 교환하고 의무를 이해하기 전에는 가호가 성립하지 않는다. 재측량으로 노동이 부족한 동안 협상이 늦어지면 손으로 약초 상태를 살피는 비용이 계속 든다.\n\n## 관련 문서\n\n- [NPC-SOLI](NPC-SOLI.md)\n- [SPI-ASH](SPI-ASH.md)\n- [SYS-BLESSING](SYS-BLESSING.md)\n- [EVT-HUSH-SURVEY](EVT-HUSH-SURVEY.md)\n","data":{"schema_version":1,"id":"THR-HUSH-BLESSING","kind":"Thread","name":"솔이와 아샤의 가호 협상","summary":"약초 건조 일꾼과 재의 정령이 의무와 범위를 논의한다.","references":["NPC-SOLI","SPI-ASH","SYS-BLESSING","EVT-HUSH-SURVEY"],"status":"open","details":[{"heading":"협상 대상","text":"솔이는 식물의 열 손상을 살피는 가호에 관심을 보이고 아샤에게 조건을 묻는다. 아샤가 계약한 약초사에게 주는 감지와 매년 묘목 세 그루를 가꾸는 의무가 논의의 출발점이다. 이 대화만으로 아샤가 새 수혜자를 받아들였다고 볼 수 없다."},{"heading":"남은 선택","text":"솔이는 돌봄에 필요한 물과 시간을 마련해야 하고 아샤는 새 계약에 쓸 생기와 기억을 고려한다. 양쪽은 각자 거절할 수 있으며 이름을 교환하고 의무를 이해하기 전에는 가호가 성립하지 않는다. 재측량으로 노동이 부족한 동안 협상이 늦어지면 손으로 약초 상태를 살피는 비용이 계속 든다."}]}},{"id":"ART-THR-REGIONAL-COST","record":"THR-REGIONAL-COST","name":"교환 비용과 안전의 갈림길","category":"Thread","tags":["Thread","교환 비용과 안전의 갈림길"],"references":["THR-REGIONAL-COST","EVT-TRADE-PARTIAL","THR-TRADE-PAUSE","ORG-TRADE-TABLE","CLM-HUSH-BOUNDARY","CLM-ORVAN-DEBT"],"body":"\n# 교환 비용과 안전의 갈림길\n\n부분 운반 뒤에도 품삯·수선·경계 합의가 남았다.\n\n## 각 지역의 쟁점\n\n벨수 운반자와 장비 점검자는 기다린 노동의 보상을 요구하고, 카르드 작업자들은 환기 수선과 중단 기간 품삯을 함께 논의한다. 무음림 주민과 아샤의 경계 기억은 재측량을 거쳐야 한다. 각각의 판단은 서로 다른 당사자와 권한에 달려 있다.\n\n## 결정되지 않은 것\n\n옛 물길 경계설과 오르반의 채무 계약에 관한 주장은 여전히 확인되지 않았다. 운반 협의가 이루어져도 두 주장은 사실로 바뀌지 않으며 도시 분담 구조 기금도 자동으로 설립되지 않는다. 다음 교환의 비용과 안전 조건을 놓고 각자의 협상이 계속된다.\n\n## 관련 문서\n\n- [EVT-TRADE-PARTIAL](EVT-TRADE-PARTIAL.md)\n- [THR-TRADE-PAUSE](THR-TRADE-PAUSE.md)\n- [ORG-TRADE-TABLE](ORG-TRADE-TABLE.md)\n- [CLM-HUSH-BOUNDARY](CLM-HUSH-BOUNDARY.md)\n- [CLM-ORVAN-DEBT](CLM-ORVAN-DEBT.md)\n","data":{"schema_version":1,"id":"THR-REGIONAL-COST","kind":"Thread","name":"교환 비용과 안전의 갈림길","summary":"부분 운반 뒤에도 품삯·수선·경계 합의가 남았다.","references":["EVT-TRADE-PARTIAL","THR-TRADE-PAUSE","ORG-TRADE-TABLE","CLM-HUSH-BOUNDARY","CLM-ORVAN-DEBT"],"status":"open","details":[{"heading":"각 지역의 쟁점","text":"벨수 운반자와 장비 점검자는 기다린 노동의 보상을 요구하고, 카르드 작업자들은 환기 수선과 중단 기간 품삯을 함께 논의한다. 무음림 주민과 아샤의 경계 기억은 재측량을 거쳐야 한다. 각각의 판단은 서로 다른 당사자와 권한에 달려 있다."},{"heading":"결정되지 않은 것","text":"옛 물길 경계설과 오르반의 채무 계약에 관한 주장은 여전히 확인되지 않았다. 운반 협의가 이루어져도 두 주장은 사실로 바뀌지 않으며 도시 분담 구조 기금도 자동으로 설립되지 않는다. 다음 교환의 비용과 안전 조건을 놓고 각자의 협상이 계속된다."}]}},{"id":"ART-THR-TRADE-PAUSE","record":"THR-TRADE-PAUSE","name":"세 지역 교환 지연","category":"Thread","tags":["Thread","세 지역 교환 지연"],"references":["THR-TRADE-PAUSE","EVT-TRADE-PAUSE","ORG-KARD-VENT","CUL-HUSH-BARTER","LOC-VELSU-STORE"],"body":"\n# 세 지역 교환 지연\n\n약초와 철의 공급 지연이 운반 노동과 장비 수선에 이어진다.\n\n## 지연의 연결\n\n환기 점검으로 철 출하가 늦어지고 숲 경계 협상으로 약초 교환량이 줄어 벨수의 예정된 항차가 미뤄졌다. 서로 다른 공급 사정이 한 운반 일정에 겹쳤을 뿐 세 지역이 하나의 조직에 속한 것은 아니다.\n\n## 미해결 비용\n\n누가 기다린 노동과 줄 교체 비용을 부담할지 정해지지 않았다. 임시분담장부에 손실을 적더라도 지급이 보장되지는 않는다. 환기 수선과 숲의 경계 합의는 각각의 당사자가 결정해야 한다.\n\n## 관련 문서\n\n- [EVT-TRADE-PAUSE](EVT-TRADE-PAUSE.md)\n- [ORG-KARD-VENT](ORG-KARD-VENT.md)\n- [CUL-HUSH-BARTER](CUL-HUSH-BARTER.md)\n- [LOC-VELSU-STORE](LOC-VELSU-STORE.md)\n","data":{"schema_version":1,"id":"THR-TRADE-PAUSE","kind":"Thread","name":"세 지역 교환 지연","summary":"약초와 철의 공급 지연이 운반 노동과 장비 수선에 이어진다.","references":["EVT-TRADE-PAUSE","ORG-KARD-VENT","CUL-HUSH-BARTER","LOC-VELSU-STORE"],"status":"open","details":[{"heading":"지연의 연결","text":"환기 점검으로 철 출하가 늦어지고 숲 경계 협상으로 약초 교환량이 줄어 벨수의 예정된 항차가 미뤄졌다. 서로 다른 공급 사정이 한 운반 일정에 겹쳤을 뿐 세 지역이 하나의 조직에 속한 것은 아니다."},{"heading":"미해결 비용","text":"누가 기다린 노동과 줄 교체 비용을 부담할지 정해지지 않았다. 임시분담장부에 손실을 적더라도 지급이 보장되지는 않는다. 환기 수선과 숲의 경계 합의는 각각의 당사자가 결정해야 한다."}]}},{"id":"ART-THR-WATER","record":"THR-WATER","name":"물값과 독점 계약","category":"Thread","tags":["Thread","물값과 독점 계약"],"references":["THR-WATER","MON-WORM","NPC-SURI","NPC-VARKA"],"body":"\n# 물값과 독점 계약\n\n수리의 마을이 측량단의 물 공급 계약을 받아들일지 결정해야 한다.\n\n## 현재\n\n펌프 도입은 즉시 물 부족을 완화하지만 부품 공급과 채굴 권한을 묶는다. 바르카는 재정 위험을 지므로 무상 공급을 쉽게 약속하지 않는다.\n\n## 열린 결말\n\n공동 투자·계약 수정·독립 기술 개발·결렬 중 어느 결말도 아직 정사가 아니다. 가짜 선악 구도 대신 각 선택의 물·노동·환경 비용을 보여준다.\n\n## 생활과 후속 이야기\n\n청동등 거북의 이동과 굴착충의 번식 통로는 협상 자료가 될 수 있지만 어느 쪽도 인간의 도덕적 정당성을 자동 판정하지 않는다. 수리는 우물의 회복량을, 바르카는 부품과 인력 비용을 공개해야 한다. 결말을 만들 때 실제로 물이 늘거나 줄어드는 과정과 피해를 받는 사람을 함께 기록한다.\n\n## 관련 문서\n\n- [유리굴착충](MON-WORM.md)\n- [수리 안](NPC-SURI.md)\n- [바르카 렌](NPC-VARKA.md)\n","data":{"id":"THR-WATER","kind":"Thread","name":"물값과 독점 계약","summary":"수리의 마을이 측량단의 물 공급 계약을 받아들일지 결정해야 한다.","references":["MON-WORM","NPC-SURI","NPC-VARKA"],"status":"open","schema_version":1,"details":[{"heading":"현재","text":"펌프 도입은 즉시 물 부족을 완화하지만 부품 공급과 채굴 권한을 묶는다. 바르카는 재정 위험을 지므로 무상 공급을 쉽게 약속하지 않는다."},{"heading":"열린 결말","text":"공동 투자·계약 수정·독립 기술 개발·결렬 중 어느 결말도 아직 정사가 아니다. 가짜 선악 구도 대신 각 선택의 물·노동·환경 비용을 보여준다."},{"heading":"생활과 후속 이야기","text":"청동등 거북의 이동과 굴착충의 번식 통로는 협상 자료가 될 수 있지만 어느 쪽도 인간의 도덕적 정당성을 자동 판정하지 않는다. 수리는 우물의 회복량을, 바르카는 부품과 인력 비용을 공개해야 한다. 결말을 만들 때 실제로 물이 늘거나 줄어드는 과정과 피해를 받는 사람을 함께 기록한다."}]}},{"record":"overview","name":"세계 개요","category":"Guide","tags":[],"references":[],"body":"# 세계 개요\n\n## 세 가지 힘\n\n| 힘 | 획득 | 비용 | 사회적 의미 |\n|---|---|---|---|\n| 술식 | 교육·도식·재료 | 원료·신체 부담 | 교육, 면허, 산업 사고 |\n| 가호 | 수호자와 자발적 계약 | 의무·수호자의 생기 | 공존, 돌봄, 계약 갈등 |\n| 권능 | 좌의 시험과 승계 | 자리별 명시 비용 | 공적 책임, 독점 논쟁 |\n\n## 지리와 생계\n\n중앙 루멘은 렌즈·교육·수로, 서부 벨수는 어업·곡물·수운, 북부 카르드는 철·산악 통행, 동부 무음림은 약초·임업·정령 계약, 남부 사헬은 잔해·지하수, 에스텔 군도는 항해·보험·구조가 중심이다. 어느 지역도 전 분야를 자급하지 못한다.\n\n일곱 맹약은 일곱 현대 국가의 목록이 아니라 6년 조약의 일곱 조항이다. 여섯 주요 지역 밖은 확장 공간이다.\n\n## 인물 관계\n\n세린과 토마는 구조 동료지만 비용 부담에 의견이 다르다. 이라와 미라는 자매이며 기억 조사와 사생활 보호를 고민한다. 오르반과 브렌은 전투와 피난을 함께 해냈지만 보상이 다르다. 수리와 바르카는 물 공급 협상 상대다. 마레와 시아는 항해마다 계약하는 동료다. 에나는 치료·장애·이별을 담당한다.\n\n## 시작 가능한 이야기\n\n- 사헬 펌프 계약: 물 부족, 채굴 진동, 영물 이동, 기술 자립.\n- 루멘 군용 통로: 권능 사용 한도, 구조 예산, 시민 안전.\n- 무음림 재측량: 새 도면과 정령의 오래된 기억 사이의 악의 없는 불일치.\n- 에스텔 구조: 등불의 소유·보관을 구별하고 군수 지원의 대가 협상.\n\n[분류 색인](indexes/README.md)에서 탐색한다. 과거 수백 년을 미확인 전승으로 채우기보다 현재의 생활과 관계를 넓게 정의했다.\n","data":null},{"record":"constitution","name":"세계 헌장","category":"Guide","tags":[],"references":[],"body":"# 아르켄 세계 헌장\n\n문서 ID: ARKEN-WORLD-001 · 버전: 1.0 · 상태: bootstrap · 기준일: 2026-11-17\n\n## 확정 전제\n\n현재는 맹약력312년 초여름이다. 하늘 파열의 원인은 의도적으로 열어 둔다. 대륙 전체의 단일 제국이나 전지전능한 현역 신은 초기 설정에 없다. 인간의 제도, 비인간의 의지, 생태와 경제가 모두 사건의 원인이다.\n\n술식은 학습 기술, 가호는 쌍방 계약, 권능은 좁은 예외를 집행하는 자리다. 셋은 서로의 비용을 면제하지 않는다. 일곱 좌의 동시 집행자는 각 한 명이며 한 인물이 복수 좌를 점유하지 않는다. 문턱과 증언 외 다섯 좌의 상세 기능·집행자 상태는 미정이다.\n\n확정 사망 뒤 동일 인격의 부활, 무한 물질·에너지 생성, 강제 가호 계약을 금지한다. 잔향은 원래 인격이 아니다. 영물은 죽을 수 있는 육체적 장수 생명이다. 정령은 기억을 갱신하고 선택한다. 몬스터는 적대만을 위해 존재하지 않는 생태적 생명이다.\n\n## 창작 방향\n\n영웅의 능력은 선택을 어렵게 만든다. 주변인물에게 생계·관계·거절할 권리·독자적 목표를 준다. 조직의 권한·재정·내부 이견을 분리한다. 지역마다 식량·노동·교통·치료·축제를 확장한다. 모든 갈등을 비밀 조직이나 고대 흑막으로 설명하지 않는다.\n\n유일물은 동시에 하나의 본체다. 소유·보관·사용 자격을 구분한다. 복제품·파편·이름 변경으로 유일성을 우회하지 않는다. 대가와 부상을 새 장비 하나로 지우지 않는다.\n\n## 미정 영역\n\n다른 종족·대륙·신앙은 추가 가능하지만 규칙·이동 거리·시대를 검사한다. 나머지 다섯 좌의 존재는 확정이고 효과와 집행자는 미정이다. 미정은 공석이 아니다. 파열 원인은 단일 작업에서 확정하지 않는다.\n\n헌장 변경은 별도 설계 변경이다. 영향 문서와 호환성 검토를 제출하고 사용자의 판단을 받는다.\n","data":null},{"record":"timeline","name":"연표","category":"Guide","tags":[],"references":[],"body":"# 확정 연표\n\n연도 안의 목록 순서만으로 선후를 추측하지 않는다. 명시된 선후만 표시한다.\n\n## 0년\n\n- [하늘의 파열](../wiki/EVT-FRACTURE.md)\n\n## 6년\n\n- [일곱 맹약의 체결](../wiki/EVT-COMPACT.md)\n\n## 307년\n\n- [푸른 제방의 밤](../wiki/EVT-FLOOD.md)\n\n## 309년\n\n- [검은 눈 고개 전투](../wiki/EVT-PASS.md)\n\n## 311년\n\n- [접힌 성벽의 경첩 정비](../wiki/EVT-ORVAN-REPAIR.md)\n\n## 312년\n\n- [숲가의 임시 재측량](../wiki/EVT-HUSH-SURVEY.md)\n- [초여름 교역 중단](../wiki/EVT-TRADE-PAUSE.md)\n- [남은 물품의 임시 교환](../wiki/EVT-TRADE-PARTIAL.md)\n- 명시된 선후: 초여름 교역 중단 → 남은 물품의 임시 교환\n\n범위 사건과 미정 시점은 정확한 연도로 환산하지 않는다.\n","data":null}],"articles":75}</script><script>'use strict';
const dataset=JSON.parse(document.getElementById('wiki-data').textContent),pages=dataset.pages,byId=new Map(pages.map(p=>[p.record,p]));
const categories={Guide:'세계 안내',Rule:'세계 규칙',Place:'지역·장소',Organization:'단체·조직',Character:'영웅·인물',Power:'권능',Spirit:'정령',SacredBeast:'영물',Monster:'몬스터',Item:'유니크 아이템',Event:'역사·사건',Claim:'주장·소문',Thread:'열린 갈등',Culture:'생활·문화',Fact:'확정 상태',Belief:'인물의 믿음'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=id=>'#page/'+encodeURIComponent(id);let headingIndex=0,toc=[];
function inline(text){
 const tokens=[];const token=html=>'\u0000'+(tokens.push(html)-1)+'\u0000';
 text=text.replace(/`([^`]+)`/g,(_,x)=>token('<code>'+esc(x)+'</code>'));
 text=text.replace(/\[([^\]]+)\]\(([^\s)]+)\)/g,(_,label,target)=>{
  const bare=target.split('#')[0].split('/').pop(),id=bare.replace(/\.md$/,'');
  return token(byId.has(id)?'<a href="'+link(id)+'">'+esc(label)+'</a>':esc(label));
 });
 text=esc(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
 return text.replace(/\u0000(\d+)\u0000/g,(_,n)=>tokens[Number(n)]||'');
}
function markdown(text){
 headingIndex=0;toc=[];const lines=text.split('\n'),out=[];let para=[],list=null,code=null;
 const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}if(list){out.push('</'+list+'>');list=null}};
 for(let i=0;i<lines.length;i++){
  const line=lines[i];if(line.startsWith('```')){flush();if(code!==null){out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');code=null}else code=[];continue}if(code!==null){code.push(line);continue}
  const h=line.match(/^(#{1,6})\s+(.+)$/);if(h){flush();if(h[1].length===1)continue;const level=Math.min(3,h[1].length),id='section-'+headingIndex++;toc.push({id,text:h[2],level});out.push('<h'+level+' id="'+id+'">'+inline(h[2])+'</h'+level+'>');continue}
  if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){flush();const cells=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());out.push('<table><thead><tr>'+cells(line).map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>');i+=2;while(i<lines.length&&lines[i].includes('|')){out.push('<tr>'+cells(lines[i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>');i++}i--;out.push('</tbody></table>');continue}
  const item=line.match(/^\s*(?:[-*]|\d+\.)\s+(.+)$/);if(item){if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}const type=/^\s*\d+\./.test(line)?'ol':'ul';if(list!==type){if(list)out.push('</'+list+'>');out.push('<'+type+'>');list=type}out.push('<li>'+inline(item[1])+'</li>');continue}
  if(!line.trim()){flush();continue}if(/^---+$/.test(line)){flush();out.push('<hr>');continue}if(list){out.push('</'+list+'>');list=null}para.push(line.trim());
 }flush();if(code!==null)out.push('<pre>'+esc(code.join('\n'))+'</pre>');return out.join('\n');
}
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}

const main=document.getElementById('main'),rail=document.getElementById('rail');
function tiles(items){return '<div class="grid">'+items.map(p=>'<a class="tile" href="'+link(p.record)+'"><strong>'+esc(p.name)+'</strong><p>'+esc(p.data?.summary||categories[p.category])+'</p></a>').join('')+'</div>'}
function sidebar(){document.getElementById('categories').innerHTML=Object.entries(categories).filter(([k])=>k!=='Guide'&&pages.some(p=>p.category===k)).map(([k,n])=>'<a href="#category/'+k+'">'+n+'<span class="count">'+pages.filter(p=>p.category===k).length+'</span></a>').join('');document.getElementById('recent').innerHTML=recent.filter(id=>byId.has(id)).slice(0,6).map(id=>'<a href="'+link(id)+'">'+esc(byId.get(id).name)+'</a>').join('')}
function home(){
 main.innerHTML='<div class="eyebrow">THE WORLD OF ARKEN · OFFLINE EDITION</div><h1>아르켄 위키</h1><p class="lead">부서진 하늘 아래의 일곱 맹약</p><div class="hero"><strong>한 세계, 수많은 선택.</strong><p>맹약력 312년 초여름. 마법은 기술이고, 가호는 약속이며, 권능은 책임입니다.</p><p>영웅의 전설부터 뱃사공의 생계까지, 서로 연결된 세계를 읽어보세요.</p></div><div class="stats"><span><b>'+dataset.articles+'</b>세계관 문서</span><span><b>'+Object.keys(categories).filter(k=>k!=='Guide'&&pages.some(p=>p.category===k)).length+'</b>분류</span><span><b>312</b>현재 맹약력</span></div><h2>처음 오셨나요?</h2>'+tiles(['overview','SYS-MAGIC','SYS-BLESSING','SYS-AUTHORITY'].map(id=>byId.get(id)))+'<h2>인물과 그들의 선택</h2>'+tiles(['HERO-SERIN','NPC-TOMA','NPC-SURI','NPC-VARKA'].map(id=>byId.get(id)))+'<h2>세계 둘러보기</h2>'+tiles(['LOC-HUSH','LOC-ESTEL','MON-WORM','ITM-LANTERN'].map(id=>byId.get(id)));
 rail.innerHTML='<div class="panel"><h3>이 위키에 대하여</h3><p>이 파일 하나에 모든 문서가 담겨 있습니다. 인터넷 연결 없이 검색하고 링크를 따라갈 수 있습니다.</p><a href="#page/constitution">세계의 원칙과 창작 경계 →</a></div><div class="panel"><h3>분류 바로가기</h3>'+Object.entries(categories).filter(([k])=>k!=='Guide'&&pages.some(p=>p.category===k)).map(([k,n])=>'<a href="#category/'+k+'">'+n+'</a>').join('')+'</div>';
}
function article(id){const p=byId.get(id);if(!p){main.innerHTML='<h1>문서를 찾을 수 없습니다</h1><a href="#home">대문으로 돌아가기</a>';rail.innerHTML='';return}
 recent=[id,...recent.filter(x=>x!==id)].slice(0,8);save('arken-recent',recent);const body=markdown(p.body),headings=toc.slice();
 main.innerHTML='<div class="eyebrow">ARKEN / '+esc(categories[p.category]||p.category)+'</div><h1>'+esc(p.name)+'</h1><div>'+p.tags.map(t=>'<a class="tag" href="#search/'+encodeURIComponent(t)+'">'+esc(t)+'</a>').join('')+'</div><div class="actions"><a href="#category/'+encodeURIComponent(p.category)+'">같은 분류 보기</a><button class="outline" id="download-md">Markdown 저장 ↓</button></div><article class="body">'+body+'</article>'+(p.data?'<details><summary>근거 기록 보기 · '+esc(id)+'</summary><pre>'+esc(JSON.stringify(p.data,null,2))+'</pre></details>':'');
 const related=pages.filter(x=>x.record!==id&&x.references.includes(id));
 rail.innerHTML='<div class="panel"><h3>목차</h3>'+headings.map(h=>'<a class="'+(h.level===3?'toc-sub':'')+'" href="#page/'+encodeURIComponent(id)+'/'+h.id+'">'+esc(h.text)+'</a>').join('')+'</div>'+(related.length?'<div class="panel"><h3>이 문서를 가리키는 문서</h3>'+related.map(x=>'<a href="'+link(x.record)+'">'+esc(x.name)+'</a>').join('')+'</div>':'')+'<div class="panel"><h3>문서 정보</h3><p>'+esc(categories[p.category]||p.category)+'</p><div class="record-id">'+esc(id)+'</div></div>';
 document.getElementById('download-md').onclick=()=>{const meta={...p};delete meta.body;delete meta.data;const front='---\n'+Object.entries(meta).map(([k,v])=>k+': '+JSON.stringify(v)).join('\n')+'\n---\n';const url=URL.createObjectURL(new Blob([front+p.body],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=id+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
}
function results(title,items){main.innerHTML='<div class="eyebrow">ARKEN INDEX</div><h1>'+esc(title)+'</h1><p class="lead">'+items.length+'개 문서</p>'+(items.length?items.map(p=>'<div class="result"><a href="'+link(p.record)+'"><strong>'+esc(p.name)+'</strong></a><p>'+esc(p.data?.summary||categories[p.category])+'</p><span class="tag">'+esc(categories[p.category])+'</span></div>').join(''):'<div class="empty">일치하는 문서가 없습니다. 다른 이름이나 키워드로 검색해 보세요.</div>');rail.innerHTML=''}
function route(){let parts;try{parts=location.hash.slice(1).split('/').map(decodeURIComponent)}catch{parts=['home']}const [view,arg,section]=parts;document.getElementById('query').value=view==='search'?(arg||''):'';
 if(view==='page')article(arg);else if(view==='category')results(categories[arg]||arg,pages.filter(p=>p.category===arg));else if(view==='search'){const q=(arg||'').trim().toLocaleLowerCase();results('검색: '+(arg||''),q?pages.filter(p=>(p.name+' '+p.tags.join(' ')+' '+p.body).toLocaleLowerCase().includes(q)).sort((a,b)=>Number(b.name.toLocaleLowerCase().includes(q))-Number(a.name.toLocaleLowerCase().includes(q))):[])}else home();sidebar();document.title=(view==='page'&&byId.has(arg)?byId.get(arg).name+' — ':'')+'아르켄 위키';
 if(section&&/^section-\d+$/.test(section))document.getElementById(section)?.scrollIntoView();else window.scrollTo(0,0);
}
document.getElementById('search').onsubmit=e=>{e.preventDefault();location.hash='search/'+encodeURIComponent(document.getElementById('query').value.trim())};document.getElementById('random').onclick=()=>{const choices=pages.filter(p=>p.category!=='Guide');location.hash=link(choices[Math.floor(Math.random()*choices.length)].record)};document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');save('arken-dark',document.body.classList.contains('dark'))};window.addEventListener('hashchange',route);route();
</script></body></html>
